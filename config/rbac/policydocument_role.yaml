apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kropath-policydocument
rules:
  - apiGroups: ["aws.kropath.run"]
    resources:
      - awspolicydocuments
      - awspolicydocuments/status
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["aws.kropath.run"]
    resources:
      - awsiamroles
      - awss3buckets
      - awslambdafunctions
      - awssqsqueues
      - awskmskeys
      - awssecretsmanagersecrets
    verbs: ["get", "list", "watch"]
