# ClusterRole for the label-operator reconciler (ctrl-label-op-01).
# The wildcard resources: ["*"] ensures new CRDs registered under these API
# groups are automatically covered without an RBAC update.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kropath-label-operator
rules:
  - apiGroups: ["aws.kropath.run"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["gcp.kropath.run"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["azure.kropath.run"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "patch"]
