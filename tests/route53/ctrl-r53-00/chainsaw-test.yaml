# ctrl-r53-00 Chainsaw integration tests — Route53 effectiveConfig cascade.
#
# Covers acceptance criteria: AC-1 through AC-9.
#
# Test isolation — unique-name-per-step, no inter-step deletes:
#   Each AC owns a distinct resource name (acN-r53-policy). The controller
#   resolves a config's global counterpart by *name* — a local Route53Config
#   route53-prod/acN-r53-policy merges only kro-system/acN-r53-policy — so a
#   per-AC name isolates each AC completely.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-r53-00
spec:
  description: "Route53 effectiveConfig cascade — acceptance criteria AC-1 through AC-9 (ctrl-r53-00)"
  namespace: route53-prod
  steps:
    # AC-1: globalKropathConfig.mandatory.route53.defaultTTL=300 (level 1) → effCfg.mandatory.defaultTTL=300
    - name: ac1-global-kpc-mandatory-default-ttl
      try:
        - apply:
            file: ac01-setup.yaml
        - assert:
            file: ac01-assert.yaml
            timeout: 30s

    # AC-2: localKropathConfig.mandatory.route53.healthCheckRequestInterval=10 (level 2)
    # → effCfg.mandatory.healthCheckRequestInterval=10 (wins when level 1 absent)
    - name: ac2-local-kpc-mandatory-hc-interval
      try:
        - apply:
            file: ac02-setup.yaml
        - assert:
            file: ac02-assert.yaml
            timeout: 30s

    # AC-3: globalRoute53Config.mandatory.healthCheckFailureThreshold=3 (level 3)
    # → effCfg.mandatory.healthCheckFailureThreshold=3 (wins when levels 1,2 absent)
    - name: ac3-global-r53cfg-mandatory-hc-threshold
      try:
        - apply:
            file: ac03-setup.yaml
        - assert:
            file: ac03-assert.yaml
            timeout: 30s

    # AC-4: localRoute53Config.mandatory.resolverEndpointType=IPV4 (level 4)
    # → effCfg.mandatory.resolverEndpointType=IPV4 (wins when levels 1-3 absent)
    - name: ac4-local-r53cfg-mandatory-resolver-endpoint-type
      try:
        - apply:
            file: ac04-setup.yaml
        - assert:
            file: ac04-assert.yaml
            timeout: 30s

    # AC-5: localRoute53Config.defaults.defaultTTL=60 (level 6)
    # → effCfg.defaults.defaultTTL=60 (no mandatory set)
    - name: ac5-local-r53cfg-defaults-ttl
      try:
        - apply:
            file: ac05-setup.yaml
        - assert:
            file: ac05-assert.yaml
            timeout: 30s

    # AC-6: globalRoute53Config.defaults.healthCheckRequestInterval=30 (level 7)
    # → effCfg.defaults.healthCheckRequestInterval=30 (level 6 absent)
    - name: ac6-global-r53cfg-defaults-hc-interval
      try:
        - apply:
            file: ac06-setup.yaml
        - assert:
            file: ac06-assert.yaml
            timeout: 30s

    # AC-7: KropathConfig.mandatory.tags + Route53Config.mandatory.tags
    # → union-merged into effCfg.mandatory.tags (closer-to-instance wins on key conflict)
    - name: ac7-tag-union-merge
      try:
        - apply:
            file: ac07-setup.yaml
        - assert:
            file: ac07-assert.yaml
            timeout: 30s

    # AC-8: Route53Config.mandatory.syncedLabels propagated to effCfg.mandatory.syncedLabels
    - name: ac8-synced-labels-propagation
      try:
        - apply:
            file: ac08-setup.yaml
        - assert:
            file: ac08-assert.yaml
            timeout: 30s

    # AC-9: Route53Config with defaultTTL in both mandatory and defaults is rejected
    # by the Route53Config CRD's CEL mutual-exclusion rule.
    - name: ac9-mutual-exclusivity-dual-tier-rejected
      try:
        - apply:
            file: ac09-setup.yaml
            expect:
            - match:
                apiVersion: aws.kropath.run/v1alpha1
                kind: Route53Config
              check:
                ($error != null): true
