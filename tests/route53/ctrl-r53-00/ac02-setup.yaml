# AC-2: localKropathConfig.mandatory.route53.healthCheckRequestInterval=10 (level 2)
# flows to effCfg.mandatory.healthCheckRequestInterval=10 when level 1 is absent.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: default
  namespace: route53-prod
spec:
  mandatory:
    route53:
      healthCheckRequestInterval: 10
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: Route53Config
metadata:
  name: ac2-r53-policy
  namespace: route53-prod
spec: {}
