# Assert AC-5: defaults.defaultTTL=60 from level-6 localRoute53Config.defaults.
apiVersion: aws.kropath.run/v1alpha1
kind: Route53Config
metadata:
  name: ac5-r53-policy
  namespace: route53-prod
status:
  effectiveConfig:
    defaults:
      defaultTTL: 60
