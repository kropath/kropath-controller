# AC-L4: LambdaConfig defaults tracingMode="Active" in product namespace (level 6)
# propagates to effectiveConfig.defaults.tracingMode.
apiVersion: v1
kind: Namespace
metadata:
  name: ac04-lambda-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac04-lambda-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac04-lambda-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac04-lambda-global-ns
spec:
  mandatory: {}
---
apiVersion: aws.kropath.run/v1alpha1
kind: LambdaConfig
metadata:
  name: ac4-lambdacfg-policy
  namespace: ac04-lambda-app-ns
spec:
  mandatory: {}
  defaults:
    tracingMode: "Active"
