# AC-L2: KropathConfig mandatory lambda.runtime propagates to effectiveConfig.mandatory.runtime.
apiVersion: aws.kropath.run/v1alpha1
kind: LambdaConfig
metadata:
  name: ac2-lambdacfg-policy
  namespace: ac02-lambda-app-ns
status:
  conditions:
  - type: Valid
    status: "True"
    reason: ValidationPassed
  - type: GlobalProfileResolved
    status: "False"
    reason: ProfileUnresolved
  effectiveConfig:
    mandatory:
      runtime: "python3.12"
