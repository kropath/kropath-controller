# AC-L1: LambdaConfig with empty spec; KropathConfig with provider identity.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac1-lambdacfg-policy
  namespace: kro-system
spec:
  mandatory: {}
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: LambdaConfig
metadata:
  name: ac1-lambdacfg-policy
  namespace: payments-prod
spec:
  mandatory: {}
  defaults: {}
