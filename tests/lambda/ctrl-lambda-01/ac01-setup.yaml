# AC-L1: LambdaConfig with empty spec; KropathConfig with provider identity.
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-lambda-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-lambda-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac01-lambda-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac01-lambda-global-ns
spec:
  mandatory: {}
---
apiVersion: aws.kropath.run/v1alpha1
kind: LambdaConfig
metadata:
  name: ac1-lambdacfg-policy
  namespace: ac01-lambda-app-ns
spec:
  mandatory: {}
  defaults: {}
