# AC-L5: LambdaConfig defaults namingTemplate="{namespace}-{name}" in product namespace (level 6)
# propagates to effectiveConfig.defaults.namingTemplate.
apiVersion: v1
kind: Namespace
metadata:
  name: ac05-lambda-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac05-lambda-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac05-lambda-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac05-lambda-global-ns
spec:
  mandatory: {}
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: LambdaConfig
metadata:
  name: ac5-lambdacfg-policy
  namespace: ac05-lambda-app-ns
spec:
  mandatory: {}
  defaults:
    namingTemplate: "{namespace}-{name}"
