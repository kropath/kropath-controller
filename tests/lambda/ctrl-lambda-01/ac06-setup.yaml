# AC-L6: Provider identity (aws.accountId, aws.region) from KropathConfig
# propagates to effectiveConfig.aws.
apiVersion: v1
kind: Namespace
metadata:
  name: ac06-lambda-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac06-lambda-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac06-lambda-global-ns
    services.k8s.aws/owner-account-id: "987654321098"
    services.k8s.aws/default-region: "eu-west-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac06-lambda-global-ns
spec:
  mandatory: {}
---
apiVersion: aws.kropath.run/v1alpha1
kind: LambdaConfig
metadata:
  name: ac6-lambdacfg-policy
  namespace: ac06-lambda-app-ns
spec:
  mandatory: {}
  defaults: {}
