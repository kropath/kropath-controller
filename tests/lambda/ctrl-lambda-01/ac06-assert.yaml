# AC-L6: Provider identity propagates to effectiveConfig.aws.
apiVersion: aws.kropath.run/v1alpha1
kind: LambdaConfig
metadata:
  name: ac6-lambdacfg-policy
  namespace: ac06-lambda-app-ns
status:
  conditions:
  - type: Valid
    status: "True"
    reason: ValidationPassed
  - type: PlacementResolved
    status: "True"
    reason: ResolvedFromNamespace
  - type: GlobalProfileResolved
    status: "False"
    reason: ProfileUnresolved
  effectiveConfig:
    aws:
      accountId: "987654321098"
      region: "eu-west-1"
