# AC-L7: Tags union-merge — global LambdaConfig (level 3) wins on key conflict.
apiVersion: aws.kropath.run/v1alpha1
kind: LambdaConfig
metadata:
  name: ac7-lambdacfg-policy
  namespace: ac07-lambda-app-ns
status:
  conditions:
  - type: Valid
    status: "True"
    reason: ValidationPassed
  - type: PlacementResolved
    status: "True"
    reason: ResolvedFromNamespace
  - type: GlobalProfileResolved
    status: "True"
    reason: ProfileFound
  effectiveConfig:
    mandatory:
      tags:
        env: "staging"
        team: "platform"
        app: "api"
