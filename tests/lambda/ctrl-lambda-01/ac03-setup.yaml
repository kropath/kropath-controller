# AC-L3: LambdaConfig mandatory memorySize=512 in product namespace (level 4)
# propagates to effectiveConfig.mandatory.memorySize.
apiVersion: v1
kind: Namespace
metadata:
  name: ac03-lambda-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac03-lambda-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac03-lambda-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac03-lambda-global-ns
spec:
  mandatory: {}
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: LambdaConfig
metadata:
  name: ac3-lambdacfg-policy
  namespace: ac03-lambda-app-ns
spec:
  mandatory:
    memorySize: 512
  defaults: {}
