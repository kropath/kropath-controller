# AC-L3: LambdaConfig mandatory memorySize=512 in product namespace (level 4)
# propagates to effectiveConfig.mandatory.memorySize.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac3-lambdacfg-policy
  namespace: kro-system
spec:
  mandatory: {}
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: LambdaConfig
metadata:
  name: ac3-lambdacfg-policy
  namespace: payments-prod
spec:
  mandatory:
    memorySize: 512
  defaults: {}
