# AC-L3: LambdaConfig mandatory memorySize propagates to effectiveConfig.mandatory.memorySize.
apiVersion: aws.kropath.run/v1alpha1
kind: LambdaConfig
metadata:
  name: ac3-lambdacfg-policy
  namespace: payments-prod
status:
  conditions:
    - type: Valid
      status: "True"
      reason: ValidationPassed
  effectiveConfig:
    mandatory:
      memorySize: 512
