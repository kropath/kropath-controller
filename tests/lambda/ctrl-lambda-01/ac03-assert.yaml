# AC-L3: LambdaConfig mandatory memorySize propagates to effectiveConfig.mandatory.memorySize.
apiVersion: aws.kropath.run/v1alpha1
kind: LambdaConfig
metadata:
  name: ac3-lambdacfg-policy
  namespace: ac03-lambda-app-ns
status:
  conditions:
  - type: Valid
    status: "True"
    reason: ValidationPassed
  - type: PlacementResolved
    status: "True"
    reason: ResolvedFromNamespace
  - type: GlobalProfileResolved
    status: "False"
    reason: ProfileUnresolved
  effectiveConfig:
    mandatory:
      memorySize: 512
