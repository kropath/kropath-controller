# AC-L5: LambdaConfig defaults namingTemplate propagates to effectiveConfig.defaults.namingTemplate.
apiVersion: aws.kropath.run/v1alpha1
kind: LambdaConfig
metadata:
  name: ac5-lambdacfg-policy
  namespace: ac05-lambda-app-ns
status:
  conditions:
  - type: Valid
    status: "True"
    reason: ValidationPassed
  - type: GlobalProfileResolved
    status: "False"
    reason: ProfileUnresolved
  effectiveConfig:
    defaults:
      namingTemplate: "{namespace}-{name}"
