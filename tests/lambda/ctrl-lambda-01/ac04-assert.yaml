# AC-L4: LambdaConfig defaults tracingMode propagates to effectiveConfig.defaults.tracingMode.
apiVersion: aws.kropath.run/v1alpha1
kind: LambdaConfig
metadata:
  name: ac4-lambdacfg-policy
  namespace: ac04-lambda-app-ns
status:
  conditions:
  - type: Valid
    status: "True"
    reason: ValidationPassed
  - type: PlacementResolved
    status: "True"
    reason: ResolvedFromNamespace
  - type: GlobalProfileResolved
    status: "False"
    reason: ProfileUnresolved
  effectiveConfig:
    defaults:
      tracingMode: "Active"
