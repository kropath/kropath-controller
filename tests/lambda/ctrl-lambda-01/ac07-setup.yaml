# AC-L7: Tags union-merge across mandatory levels 3 (global LambdaConfig) and 4 (local LambdaConfig).
# Global LambdaConfig (kro-system, level 3): tags env=staging, team=platform
# Local LambdaConfig (payments-prod, level 4): tags env=prod, app=api
# Expected effective mandatory tags: env=staging (level 3 wins), team=platform, app=api (union)
apiVersion: v1
kind: Namespace
metadata:
  name: ac07-lambda-global-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac07-lambda-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac07-lambda-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac07-lambda-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac07-lambda-global-ns
spec:
  mandatory: {}
---
apiVersion: aws.kropath.run/v1alpha1
kind: LambdaConfig
metadata:
  name: ac7-lambdacfg-policy
  namespace: ac07-lambda-global-ns
spec:
  mandatory:
    tags:
      env: "staging"
      team: "platform"
  defaults: {}
---
apiVersion: aws.kropath.run/v1alpha1
kind: LambdaConfig
metadata:
  name: ac7-lambdacfg-policy
  namespace: ac07-lambda-app-ns
spec:
  mandatory:
    tags:
      env: "prod"
      app: "api"
  defaults: {}
