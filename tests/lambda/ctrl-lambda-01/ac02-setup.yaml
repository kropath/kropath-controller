# AC-L2: KropathConfig mandatory lambda.runtime="python3.12" (level 1)
# propagates to effectiveConfig.mandatory.runtime.
apiVersion: v1
kind: Namespace
metadata:
  name: ac02-lambda-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac02-lambda-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac02-lambda-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac02-lambda-global-ns
spec:
  mandatory:
    lambda:
      runtime: "python3.12"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: LambdaConfig
metadata:
  name: ac2-lambdacfg-policy
  namespace: ac02-lambda-app-ns
spec:
  mandatory: {}
  defaults: {}
