---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dsqlconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: DSQLConfig
    listKind: DSQLConfigList
    plural: dsqlconfigs
    singular: dsqlconfig
    shortNames:
      - awsdsqlcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            # Boolean fields: zero-value false = not enforced (value boolean pattern, not pointer).
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.deletionProtectionEnabled) &&
                  self.spec.mandatory.deletionProtectionEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.deletionProtectionEnabled) &&
                  self.spec.defaults.deletionProtectionEnabled == true)
              message: >-
                deletionProtectionEnabled cannot be set to true in both mandatory and defaults
            # String fields: zero-value "" = not enforced.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.kmsEncryptionKey) &&
                  self.spec.mandatory.kmsEncryptionKey != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.kmsEncryptionKey) &&
                  self.spec.defaults.kmsEncryptionKey != "")
              message: >-
                kmsEncryptionKey cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                mandatory:
                  type: object
                  properties:
                    deletionProtectionEnabled:
                      type: boolean
                    kmsEncryptionKey:
                      type: string
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  properties:
                    deletionProtectionEnabled:
                      type: boolean
                    kmsEncryptionKey:
                      type: string
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      additionalProperties:
                        type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
