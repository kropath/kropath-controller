---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: awspolicydocuments.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: AWSPolicyDocument
    listKind: AWSPolicyDocumentList
    plural: awspolicydocuments
    singular: awspolicydocument
    shortNames:
      - awspoldoc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                sources:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                statements:
                  type: array
                  items:
                    type: object
                    required:
                      - effect
                      - actions
                    properties:
                      sid:
                        type: string
                      effect:
                        type: string
                      principals:
                        type: array
                        items:
                          type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                            arn:
                              type: string
                            ref:
                              type: object
                              required:
                                - kind
                                - name
                              properties:
                                kind:
                                  type: string
                                name:
                                  type: string
                                field:
                                  type: string
                      actions:
                        type: array
                        items:
                          type: string
                      resources:
                        type: array
                        items:
                          type: object
                          properties:
                            arn:
                              type: string
                            ref:
                              type: object
                              required:
                                - kind
                                - name
                              properties:
                                kind:
                                  type: string
                                name:
                                  type: string
                                field:
                                  type: string
                      conditions:
                        type: array
                        items:
                          type: object
                          required:
                            - operator
                            - key
                            - values
                          properties:
                            operator:
                              type: string
                            key:
                              type: string
                            values:
                              type: array
                              items:
                                type: string
                documentJSON:
                  type: string
            status:
              type: object
              properties:
                resolvedDocumentJSON:
                  type: string
                statementCount:
                  type: integer
                  format: int32
                sourceCount:
                  type: integer
                  format: int32
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
