---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: athenaconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: AthenaConfig
    listKind: AthenaConfigList
    plural: athenaconfigs
    singular: athenaconfig
    shortNames:
      - awsathenacfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            # Boolean fields: zero-value false = not enforced (value boolean pattern, not pointer).
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.enforceWorkGroupConfiguration) &&
                  self.spec.mandatory.enforceWorkGroupConfiguration == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.enforceWorkGroupConfiguration) &&
                  self.spec.defaults.enforceWorkGroupConfiguration == true)
              message: >-
                enforceWorkGroupConfiguration cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.enableMinimumEncryptionConfiguration) &&
                  self.spec.mandatory.enableMinimumEncryptionConfiguration == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.enableMinimumEncryptionConfiguration) &&
                  self.spec.defaults.enableMinimumEncryptionConfiguration == true)
              message: >-
                enableMinimumEncryptionConfiguration cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.publishCloudWatchMetricsEnabled) &&
                  self.spec.mandatory.publishCloudWatchMetricsEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.publishCloudWatchMetricsEnabled) &&
                  self.spec.defaults.publishCloudWatchMetricsEnabled == true)
              message: >-
                publishCloudWatchMetricsEnabled cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.requesterPaysEnabled) &&
                  self.spec.mandatory.requesterPaysEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.requesterPaysEnabled) &&
                  self.spec.defaults.requesterPaysEnabled == true)
              message: >-
                requesterPaysEnabled cannot be set to true in both mandatory and defaults
            # Integer fields: zero (0) = not enforced.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.bytesScannedCutoffPerQuery) &&
                  self.spec.mandatory.bytesScannedCutoffPerQuery > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.bytesScannedCutoffPerQuery) &&
                  self.spec.defaults.bytesScannedCutoffPerQuery > 0)
              message: >-
                bytesScannedCutoffPerQuery cannot be set in both mandatory and defaults
            # String fields: zero-value "" = not enforced.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.resultEncryptionOption) &&
                  self.spec.mandatory.resultEncryptionOption != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.resultEncryptionOption) &&
                  self.spec.defaults.resultEncryptionOption != "")
              message: >-
                resultEncryptionOption cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.resultOutputLocation) &&
                  self.spec.mandatory.resultOutputLocation != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.resultOutputLocation) &&
                  self.spec.defaults.resultOutputLocation != "")
              message: >-
                resultOutputLocation cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.engineVersion) &&
                  self.spec.mandatory.engineVersion != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.engineVersion) &&
                  self.spec.defaults.engineVersion != "")
              message: >-
                engineVersion cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                mandatory:
                  type: object
                  properties:
                    enforceWorkGroupConfiguration:
                      type: boolean
                    enableMinimumEncryptionConfiguration:
                      type: boolean
                    publishCloudWatchMetricsEnabled:
                      type: boolean
                    bytesScannedCutoffPerQuery:
                      type: integer
                      format: int64
                    requesterPaysEnabled:
                      type: boolean
                    resultEncryptionOption:
                      type: string
                    resultOutputLocation:
                      type: string
                    engineVersion:
                      type: string
                    namingTemplate:
                      type: string
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  properties:
                    enforceWorkGroupConfiguration:
                      type: boolean
                    enableMinimumEncryptionConfiguration:
                      type: boolean
                    publishCloudWatchMetricsEnabled:
                      type: boolean
                    bytesScannedCutoffPerQuery:
                      type: integer
                      format: int64
                    requesterPaysEnabled:
                      type: boolean
                    resultEncryptionOption:
                      type: string
                    resultOutputLocation:
                      type: string
                    engineVersion:
                      type: string
                    namingTemplate:
                      type: string
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      additionalProperties:
                        type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
