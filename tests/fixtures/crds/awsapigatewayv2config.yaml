---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apigatewayv2configs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: ApiGatewayV2Config
    listKind: ApiGatewayV2ConfigList
    plural: apigatewayv2configs
    singular: apigatewayv2config
    shortNames:
      - awsapigwv2cfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.corsEnabled) &&
                  self.spec.mandatory.corsEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.corsEnabled) &&
                  self.spec.defaults.corsEnabled == true)
              message: >-
                corsEnabled cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.disableExecuteApiEndpoint) &&
                  self.spec.mandatory.disableExecuteApiEndpoint == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.disableExecuteApiEndpoint) &&
                  self.spec.defaults.disableExecuteApiEndpoint == true)
              message: >-
                disableExecuteApiEndpoint cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.minimumTlsVersion) &&
                  self.spec.mandatory.minimumTlsVersion != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.minimumTlsVersion) &&
                  self.spec.defaults.minimumTlsVersion != "")
              message: >-
                minimumTlsVersion cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.defaultThrottlingBurstLimit) &&
                  self.spec.mandatory.defaultThrottlingBurstLimit > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.defaultThrottlingBurstLimit) &&
                  self.spec.defaults.defaultThrottlingBurstLimit > 0)
              message: >-
                defaultThrottlingBurstLimit cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.defaultThrottlingRateLimit) &&
                  self.spec.mandatory.defaultThrottlingRateLimit > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.defaultThrottlingRateLimit) &&
                  self.spec.defaults.defaultThrottlingRateLimit > 0)
              message: >-
                defaultThrottlingRateLimit cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory API Gateway V2 governance fields. Zero-value means the field
                    is not enforced at this tier.
                  properties:
                    corsEnabled:
                      type: boolean
                      default: false
                      description: >-
                        Enforce CORS configuration. true = all HTTP APIs must define a corsConfiguration.
                        false = not enforced.
                    disableExecuteApiEndpoint:
                      type: boolean
                      default: false
                      description: >-
                        Enforce disabling the default execute-api endpoint.
                        true = all APIs must disable the endpoint. false = not enforced.
                    defaultThrottlingBurstLimit:
                      type: integer
                      format: int64
                      default: 0
                      description: >-
                        Burst throttle limit for all stages. 0 = not enforced.
                    defaultThrottlingRateLimit:
                      type: number
                      format: double
                      default: 0
                      description: >-
                        Rate throttle limit for all stages. 0 = not enforced.
                    minimumTlsVersion:
                      type: string
                      default: ""
                      description: >-
                        Minimum TLS version for custom domain names. Empty = not enforced.
                        e.g. "TLS_1_2".
                    accessLogDestinationArn:
                      type: string
                      default: ""
                      description: >-
                        ARN of the CloudWatch Logs or Kinesis Firehose destination. Empty = not enforced.
                    accessLogFormat:
                      type: string
                      default: ""
                      description: >-
                        Access log format string. Empty = not enforced.
                    namingTemplate:
                      type: string
                      default: ""
                      description: API Gateway V2 resource naming template. Empty = not enforced.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default API Gateway V2 governance fields. Zero-value means no default
                    is provided at this tier.
                  properties:
                    corsEnabled:
                      type: boolean
                      default: false
                      description: Default CORS enabled setting. false = no default.
                    disableExecuteApiEndpoint:
                      type: boolean
                      default: false
                      description: Default disableExecuteApiEndpoint setting. false = no default.
                    defaultThrottlingBurstLimit:
                      type: integer
                      format: int64
                      default: 0
                      description: Default burst throttle limit. 0 = no default.
                    defaultThrottlingRateLimit:
                      type: number
                      format: double
                      default: 0
                      description: Default rate throttle limit. 0 = no default.
                    minimumTlsVersion:
                      type: string
                      default: ""
                      description: Default minimum TLS version. Empty = no default.
                    accessLogDestinationArn:
                      type: string
                      default: ""
                      description: Default access log destination ARN. Empty = no default.
                    accessLogFormat:
                      type: string
                      default: ""
                      description: Default access log format. Empty = no default.
                    namingTemplate:
                      type: string
                      default: ""
                      description: Default naming template. Empty = no default.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                syncedTimestamp:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged API Gateway V2 governance config written by kropath-controller.
                    RGDs read exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        corsEnabled:
                          type: boolean
                        disableExecuteApiEndpoint:
                          type: boolean
                        defaultThrottlingBurstLimit:
                          type: integer
                          format: int64
                        defaultThrottlingRateLimit:
                          type: number
                          format: double
                        minimumTlsVersion:
                          type: string
                        accessLogDestinationArn:
                          type: string
                        accessLogFormat:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        corsEnabled:
                          type: boolean
                        disableExecuteApiEndpoint:
                          type: boolean
                        defaultThrottlingBurstLimit:
                          type: integer
                          format: int64
                        defaultThrottlingRateLimit:
                          type: number
                          format: double
                        minimumTlsVersion:
                          type: string
                        accessLogDestinationArn:
                          type: string
                        accessLogFormat:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
