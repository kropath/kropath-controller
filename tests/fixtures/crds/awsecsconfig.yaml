apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ecsconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: ECSConfig
    listKind: ECSConfigList
    plural: ecsconfigs
    singular: ecsconfig
    shortNames:
      - awsecscfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.containerInsights) &&
                  self.spec.mandatory.containerInsights == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.containerInsights) &&
                  self.spec.defaults.containerInsights == true)
              message: >-
                containerInsights cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.defaultLaunchType) &&
                  self.spec.mandatory.defaultLaunchType != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.defaultLaunchType) &&
                  self.spec.defaults.defaultLaunchType != "")
              message: >-
                defaultLaunchType cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.defaultPlatformVersion) &&
                  self.spec.mandatory.defaultPlatformVersion != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.defaultPlatformVersion) &&
                  self.spec.defaults.defaultPlatformVersion != "")
              message: >-
                defaultPlatformVersion cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.defaultNetworkMode) &&
                  self.spec.mandatory.defaultNetworkMode != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.defaultNetworkMode) &&
                  self.spec.defaults.defaultNetworkMode != "")
              message: >-
                defaultNetworkMode cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.defaultTaskCPU) &&
                  self.spec.mandatory.defaultTaskCPU != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.defaultTaskCPU) &&
                  self.spec.defaults.defaultTaskCPU != "")
              message: >-
                defaultTaskCPU cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.defaultTaskMemory) &&
                  self.spec.mandatory.defaultTaskMemory != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.defaultTaskMemory) &&
                  self.spec.defaults.defaultTaskMemory != "")
              message: >-
                defaultTaskMemory cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                mandatory:
                  type: object
                  properties:
                    containerInsights:
                      type: boolean
                    defaultLaunchType:
                      type: string
                    defaultPlatformVersion:
                      type: string
                    defaultNetworkMode:
                      type: string
                    defaultTaskCPU:
                      type: string
                    defaultTaskMemory:
                      type: string
                    namingTemplate:
                      type: string
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  properties:
                    containerInsights:
                      type: boolean
                    defaultLaunchType:
                      type: string
                    defaultPlatformVersion:
                      type: string
                    defaultNetworkMode:
                      type: string
                    defaultTaskCPU:
                      type: string
                    defaultTaskMemory:
                      type: string
                    namingTemplate:
                      type: string
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      additionalProperties:
                        type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
