---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: emrconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: EMRConfig
    listKind: EMRConfigList
    plural: emrconfigs
    singular: emrconfig
    shortNames:
      - awsemrcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            # String fields: zero-value "" = not enforced.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.releaseLabel) &&
                  self.spec.mandatory.releaseLabel != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.releaseLabel) &&
                  self.spec.defaults.releaseLabel != "")
              message: >-
                releaseLabel cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.architecture) &&
                  self.spec.mandatory.architecture != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.architecture) &&
                  self.spec.defaults.architecture != "")
              message: >-
                architecture cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.maximumCapacityCPU) &&
                  self.spec.mandatory.maximumCapacityCPU != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.maximumCapacityCPU) &&
                  self.spec.defaults.maximumCapacityCPU != "")
              message: >-
                maximumCapacityCPU cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.maximumCapacityMemory) &&
                  self.spec.mandatory.maximumCapacityMemory != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.maximumCapacityMemory) &&
                  self.spec.defaults.maximumCapacityMemory != "")
              message: >-
                maximumCapacityMemory cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.diskEncryptionKeyARN) &&
                  self.spec.mandatory.diskEncryptionKeyARN != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.diskEncryptionKeyARN) &&
                  self.spec.defaults.diskEncryptionKeyARN != "")
              message: >-
                diskEncryptionKeyARN cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
            # Integer field: zero (0) = not enforced (integer sentinel pattern).
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.autoStopIdleTimeoutMinutes) &&
                  self.spec.mandatory.autoStopIdleTimeoutMinutes > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.autoStopIdleTimeoutMinutes) &&
                  self.spec.defaults.autoStopIdleTimeoutMinutes > 0)
              message: >-
                autoStopIdleTimeoutMinutes cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                mandatory:
                  type: object
                  properties:
                    releaseLabel:
                      type: string
                    architecture:
                      type: string
                    autoStopIdleTimeoutMinutes:
                      type: integer
                      format: int64
                    maximumCapacityCPU:
                      type: string
                    maximumCapacityMemory:
                      type: string
                    diskEncryptionKeyARN:
                      type: string
                    namingTemplate:
                      type: string
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  properties:
                    releaseLabel:
                      type: string
                    architecture:
                      type: string
                    autoStopIdleTimeoutMinutes:
                      type: integer
                      format: int64
                    maximumCapacityCPU:
                      type: string
                    maximumCapacityMemory:
                      type: string
                    diskEncryptionKeyARN:
                      type: string
                    namingTemplate:
                      type: string
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      additionalProperties:
                        type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
