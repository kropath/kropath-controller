---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudwatchconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: CloudWatchConfig
    listKind: CloudWatchConfigList
    plural: cloudwatchconfigs
    singular: cloudwatchconfig
    shortNames:
      - awscwcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.actionsEnabled) &&
                  has(self.spec.defaults) && has(self.spec.defaults.actionsEnabled))
              message: >-
                actionsEnabled cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.treatMissingData) &&
                  self.spec.mandatory.treatMissingData != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.treatMissingData) &&
                  self.spec.defaults.treatMissingData != "")
              message: >-
                treatMissingData cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.outputFormat) &&
                  self.spec.mandatory.outputFormat != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.outputFormat) &&
                  self.spec.defaults.outputFormat != "")
              message: >-
                outputFormat cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory CloudWatch governance fields. Zero-value / nil means the field
                    is not enforced at this tier.
                  properties:
                    actionsEnabled:
                      type: boolean
                      nullable: true
                      description: >-
                        Enforce alarm actions org-wide. nil = not enforced.
                        Distinct from false — nil means this level does not participate.
                    treatMissingData:
                      type: string
                      default: ""
                      description: >-
                        Missing data treatment. Empty = not enforced.
                        Allowed: breaching | notBreaching | ignore | missing.
                    outputFormat:
                      type: string
                      default: ""
                      description: >-
                        Metric stream output format. Empty = not enforced.
                        Allowed: json | opentelemetry1.0 | opentelemetry0.7.
                    namingTemplate:
                      type: string
                      default: ""
                      description: Naming template (e.g. "{namespace}-{name}"). Empty = not enforced.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default CloudWatch governance fields. Zero-value / nil means no default
                    is provided at this tier.
                  properties:
                    actionsEnabled:
                      type: boolean
                      nullable: true
                      description: Default alarm actions setting. nil = no default.
                    treatMissingData:
                      type: string
                      default: ""
                      description: Default missing data treatment. Empty = no default.
                    outputFormat:
                      type: string
                      default: ""
                      description: Default metric stream output format. Empty = no default.
                    namingTemplate:
                      type: string
                      default: ""
                      description: Default naming template. Empty = no default.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                syncedTimestamp:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged CloudWatch governance config written by kropath-controller.
                    RGDs read exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        actionsEnabled:
                          type: boolean
                          nullable: true
                        treatMissingData:
                          type: string
                        outputFormat:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        actionsEnabled:
                          type: boolean
                          nullable: true
                        treatMissingData:
                          type: string
                        outputFormat:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
