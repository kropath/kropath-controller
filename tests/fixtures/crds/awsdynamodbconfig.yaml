---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dynamodbconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: DynamoDBConfig
    listKind: DynamoDBConfigList
    plural: dynamodbconfigs
    singular: dynamodbconfig
    shortNames:
      - awsddbcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.kmsMasterKeyId) &&
                  self.spec.mandatory.kmsMasterKeyId != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.kmsMasterKeyId) &&
                  self.spec.defaults.kmsMasterKeyId != "")
              message: >-
                kmsMasterKeyId cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.billingMode) &&
                  self.spec.mandatory.billingMode != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.billingMode) &&
                  self.spec.defaults.billingMode != "")
              message: >-
                billingMode cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.tableClass) &&
                  self.spec.mandatory.tableClass != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.tableClass) &&
                  self.spec.defaults.tableClass != "")
              message: >-
                tableClass cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.contributorInsights) &&
                  self.spec.mandatory.contributorInsights != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.contributorInsights) &&
                  self.spec.defaults.contributorInsights != "")
              message: >-
                contributorInsights cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory DynamoDB governance fields. Zero-value / nil means the field
                    is not enforced at this tier.
                  properties:
                    encryptionEnabled:
                      type: boolean
                      description: >-
                        Enable SSE encryption. Omit (nil) = not enforced at this tier;
                        false = explicitly disabled. No default declared — nil (*bool)
                        detection is required for the cascade priority chain.
                    kmsMasterKeyId:
                      type: string
                      default: ""
                      description: KMS key ARN/ID for SSE-KMS. Empty = not enforced.
                    deletionProtectionEnabled:
                      type: boolean
                      description: Prevent table deletion. Omit (nil) = not enforced.
                    pointInTimeRecoveryEnabled:
                      type: boolean
                      description: Enable PITR. Omit (nil) = not enforced.
                    billingMode:
                      type: string
                      default: ""
                      description: Capacity billing mode ("PROVISIONED" or "PAY_PER_REQUEST"). Empty = not enforced.
                    tableClass:
                      type: string
                      default: ""
                      description: DynamoDB table class ("STANDARD" or "STANDARD_INFREQUENT_ACCESS"). Empty = not enforced.
                    contributorInsights:
                      type: string
                      default: ""
                      description: CloudWatch Contributor Insights action ("ENABLE" or "DISABLE"). Empty = not enforced.
                    namingTemplate:
                      type: string
                      default: ""
                      description: Table naming template (e.g. "{namespace}-{name}"). Empty = no mandatory template.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default DynamoDB governance fields. Zero-value / nil means no default
                    is provided at this tier.
                  properties:
                    encryptionEnabled:
                      type: boolean
                      description: >-
                        Default encryption setting. Omit (nil) = no default at this tier;
                        false = explicitly disabled by default.
                    kmsMasterKeyId:
                      type: string
                      default: ""
                      description: Default KMS key ARN/ID. Empty string = no default.
                    deletionProtectionEnabled:
                      type: boolean
                      description: Default deletion-protection setting. Omit (nil) = no default.
                    pointInTimeRecoveryEnabled:
                      type: boolean
                      description: Default PITR setting. Omit (nil) = no default.
                    billingMode:
                      type: string
                      default: ""
                      description: Default billing mode. Empty string = no default.
                    tableClass:
                      type: string
                      default: ""
                      description: Default table class. Empty string = no default.
                    contributorInsights:
                      type: string
                      default: ""
                      description: Default Contributor Insights action. Empty string = no default.
                    namingTemplate:
                      type: string
                      default: ""
                      description: Default naming template. Empty string = no default.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                syncedTimestamp:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged DynamoDB governance config written by kropath-controller.
                    RGDs read exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        encryptionEnabled:
                          type: boolean
                        kmsMasterKeyId:
                          type: string
                        deletionProtectionEnabled:
                          type: boolean
                        pointInTimeRecoveryEnabled:
                          type: boolean
                        billingMode:
                          type: string
                        tableClass:
                          type: string
                        contributorInsights:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        encryptionEnabled:
                          type: boolean
                        kmsMasterKeyId:
                          type: string
                        deletionProtectionEnabled:
                          type: boolean
                        pointInTimeRecoveryEnabled:
                          type: boolean
                        billingMode:
                          type: string
                        tableClass:
                          type: string
                        contributorInsights:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
