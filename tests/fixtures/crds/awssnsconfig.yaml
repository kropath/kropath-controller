---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: snsconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: SNSConfig
    listKind: SNSConfigList
    plural: snsconfigs
    singular: snsconfig
    shortNames:
      - awssnscfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.kmsMasterKeyId) &&
                  self.spec.mandatory.kmsMasterKeyId != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.kmsMasterKeyId) &&
                  self.spec.defaults.kmsMasterKeyId != "")
              message: >-
                kmsMasterKeyId cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.signatureVersion) &&
                  self.spec.mandatory.signatureVersion != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.signatureVersion) &&
                  self.spec.defaults.signatureVersion != "")
              message: >-
                signatureVersion cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.tracingConfig) &&
                  self.spec.mandatory.tracingConfig != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.tracingConfig) &&
                  self.spec.defaults.tracingConfig != "")
              message: >-
                tracingConfig cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.dataProtectionPolicy) &&
                  self.spec.mandatory.dataProtectionPolicy != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.dataProtectionPolicy) &&
                  self.spec.defaults.dataProtectionPolicy != "")
              message: >-
                dataProtectionPolicy cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory SNS governance fields. Zero-value means the field is not
                    enforced at this tier.
                  properties:
                    kmsMasterKeyId:
                      type: string
                      default: ""
                      description: KMS key ID/ARN for SNS SSE. Empty string = not enforced.
                    signatureVersion:
                      type: string
                      default: ""
                      description: SNS message signature version ("1" or "2"). Empty string = not enforced.
                    tracingConfig:
                      type: string
                      default: ""
                      description: SNS X-Ray tracing mode ("Active", "PassThrough"). Empty string = not enforced.
                    dataProtectionPolicy:
                      type: string
                      default: ""
                      description: SNS data protection policy JSON. Empty string = not enforced.
                    namingTemplate:
                      type: string
                      default: ""
                      description: Topic naming template. Empty string = not enforced.
                    deliveryFeedback:
                      type: object
                      default: {}
                      description: Per-protocol delivery feedback logging configuration.
                      properties:
                        application:
                          type: object
                          properties:
                            successFeedbackRoleArn:
                              type: string
                              default: ""
                            failureFeedbackRoleArn:
                              type: string
                              default: ""
                            successFeedbackSampleRate:
                              type: string
                              default: ""
                        http:
                          type: object
                          properties:
                            successFeedbackRoleArn:
                              type: string
                              default: ""
                            failureFeedbackRoleArn:
                              type: string
                              default: ""
                            successFeedbackSampleRate:
                              type: string
                              default: ""
                        lambda:
                          type: object
                          properties:
                            successFeedbackRoleArn:
                              type: string
                              default: ""
                            failureFeedbackRoleArn:
                              type: string
                              default: ""
                            successFeedbackSampleRate:
                              type: string
                              default: ""
                        sqs:
                          type: object
                          properties:
                            successFeedbackRoleArn:
                              type: string
                              default: ""
                            failureFeedbackRoleArn:
                              type: string
                              default: ""
                            successFeedbackSampleRate:
                              type: string
                              default: ""
                        firehose:
                          type: object
                          properties:
                            successFeedbackRoleArn:
                              type: string
                              default: ""
                            failureFeedbackRoleArn:
                              type: string
                              default: ""
                            successFeedbackSampleRate:
                              type: string
                              default: ""
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default SNS governance fields. Zero-value means no default is provided
                    at this tier.
                  properties:
                    kmsMasterKeyId:
                      type: string
                      default: ""
                      description: Default KMS key ID/ARN. Empty string = no default.
                    signatureVersion:
                      type: string
                      default: ""
                      description: Default SNS message signature version. Empty string = no default.
                    tracingConfig:
                      type: string
                      default: ""
                      description: Default SNS X-Ray tracing mode. Empty string = no default.
                    dataProtectionPolicy:
                      type: string
                      default: ""
                      description: Default SNS data protection policy JSON. Empty string = no default.
                    namingTemplate:
                      type: string
                      default: ""
                      description: Default naming template. Empty string = no default.
                    deliveryFeedback:
                      type: object
                      default: {}
                      description: Default per-protocol delivery feedback logging configuration.
                      properties:
                        application:
                          type: object
                          properties:
                            successFeedbackRoleArn:
                              type: string
                              default: ""
                            failureFeedbackRoleArn:
                              type: string
                              default: ""
                            successFeedbackSampleRate:
                              type: string
                              default: ""
                        http:
                          type: object
                          properties:
                            successFeedbackRoleArn:
                              type: string
                              default: ""
                            failureFeedbackRoleArn:
                              type: string
                              default: ""
                            successFeedbackSampleRate:
                              type: string
                              default: ""
                        lambda:
                          type: object
                          properties:
                            successFeedbackRoleArn:
                              type: string
                              default: ""
                            failureFeedbackRoleArn:
                              type: string
                              default: ""
                            successFeedbackSampleRate:
                              type: string
                              default: ""
                        sqs:
                          type: object
                          properties:
                            successFeedbackRoleArn:
                              type: string
                              default: ""
                            failureFeedbackRoleArn:
                              type: string
                              default: ""
                            successFeedbackSampleRate:
                              type: string
                              default: ""
                        firehose:
                          type: object
                          properties:
                            successFeedbackRoleArn:
                              type: string
                              default: ""
                            failureFeedbackRoleArn:
                              type: string
                              default: ""
                            successFeedbackSampleRate:
                              type: string
                              default: ""
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                syncedTimestamp:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged SNS governance config written by kropath-controller.
                    RGDs read exclusively from this field via a single resources.get() call.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        kmsMasterKeyId:
                          type: string
                        signatureVersion:
                          type: string
                        tracingConfig:
                          type: string
                        dataProtectionPolicy:
                          type: string
                        namingTemplate:
                          type: string
                        deliveryFeedback:
                          type: object
                          properties:
                            application:
                              type: object
                              properties:
                                successFeedbackRoleArn:
                                  type: string
                                failureFeedbackRoleArn:
                                  type: string
                                successFeedbackSampleRate:
                                  type: string
                            http:
                              type: object
                              properties:
                                successFeedbackRoleArn:
                                  type: string
                                failureFeedbackRoleArn:
                                  type: string
                                successFeedbackSampleRate:
                                  type: string
                            lambda:
                              type: object
                              properties:
                                successFeedbackRoleArn:
                                  type: string
                                failureFeedbackRoleArn:
                                  type: string
                                successFeedbackSampleRate:
                                  type: string
                            sqs:
                              type: object
                              properties:
                                successFeedbackRoleArn:
                                  type: string
                                failureFeedbackRoleArn:
                                  type: string
                                successFeedbackSampleRate:
                                  type: string
                            firehose:
                              type: object
                              properties:
                                successFeedbackRoleArn:
                                  type: string
                                failureFeedbackRoleArn:
                                  type: string
                                successFeedbackSampleRate:
                                  type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        kmsMasterKeyId:
                          type: string
                        signatureVersion:
                          type: string
                        tracingConfig:
                          type: string
                        dataProtectionPolicy:
                          type: string
                        namingTemplate:
                          type: string
                        deliveryFeedback:
                          type: object
                          properties:
                            application:
                              type: object
                              properties:
                                successFeedbackRoleArn:
                                  type: string
                                failureFeedbackRoleArn:
                                  type: string
                                successFeedbackSampleRate:
                                  type: string
                            http:
                              type: object
                              properties:
                                successFeedbackRoleArn:
                                  type: string
                                failureFeedbackRoleArn:
                                  type: string
                                successFeedbackSampleRate:
                                  type: string
                            lambda:
                              type: object
                              properties:
                                successFeedbackRoleArn:
                                  type: string
                                failureFeedbackRoleArn:
                                  type: string
                                successFeedbackSampleRate:
                                  type: string
                            sqs:
                              type: object
                              properties:
                                successFeedbackRoleArn:
                                  type: string
                                failureFeedbackRoleArn:
                                  type: string
                                successFeedbackSampleRate:
                                  type: string
                            firehose:
                              type: object
                              properties:
                                successFeedbackRoleArn:
                                  type: string
                                failureFeedbackRoleArn:
                                  type: string
                                successFeedbackSampleRate:
                                  type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
