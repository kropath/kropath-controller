---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudtrailconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: CloudTrailConfig
    listKind: CloudTrailConfigList
    plural: cloudtrailconfigs
    singular: cloudtrailconfig
    shortNames:
      - awsctcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory CloudTrail governance fields. Zero-value / nil means the field
                    is not enforced at this tier.
                  properties:
                    isMultiRegionTrail:
                      type: boolean
                      default: false
                      description: >-
                        Enforce multi-region trail setting. false = not enforced; true = required.
                    enableLogFileValidation:
                      type: boolean
                      default: false
                      description: >-
                        Enforce log file integrity validation. false = not enforced; true = required.
                    includeGlobalServiceEvents:
                      type: boolean
                      default: false
                      description: >-
                        Enforce inclusion of global service events. false = not enforced; true = required.
                    isOrganizationTrail:
                      type: boolean
                      default: false
                      description: >-
                        Enforce org-level trail setting. false = not enforced; true = required.
                    s3BucketName:
                      type: string
                      default: ""
                      description: S3 bucket name for trail log delivery. Empty string = not enforced.
                    s3KeyPrefix:
                      type: string
                      default: ""
                      description: S3 key prefix for trail log delivery. Empty string = not enforced.
                    kmsKeyID:
                      type: string
                      default: ""
                      description: KMS key ARN for CloudTrail log encryption. Empty string = not enforced.
                    multiRegionEnabled:
                      type: boolean
                      default: false
                      description: >-
                        Enforce multi-region event data store. false = not enforced; true = required.
                    organizationEnabled:
                      type: boolean
                      default: false
                      description: >-
                        Enforce org-level event data store. false = not enforced; true = required.
                    retentionPeriod:
                      type: integer
                      format: int64
                      default: 0
                      minimum: 0
                      description: >-
                        Event data store retention period in days. 0 = not enforced.
                    terminationProtectionEnabled:
                      type: boolean
                      default: false
                      description: >-
                        Enforce deletion protection for event data stores. false = not enforced; true = required.
                    namingTemplate:
                      type: string
                      default: ""
                      description: CloudTrail resource naming template. Empty string = not enforced.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default CloudTrail governance fields. Zero-value / nil means no default
                    is provided at this tier.
                  properties:
                    isMultiRegionTrail:
                      type: boolean
                      default: false
                      description: Default multi-region trail setting. false = no default enforcement.
                    enableLogFileValidation:
                      type: boolean
                      default: false
                      description: Default log file validation setting. false = no default enforcement.
                    includeGlobalServiceEvents:
                      type: boolean
                      default: false
                      description: Default global service events setting. false = no default enforcement.
                    isOrganizationTrail:
                      type: boolean
                      default: false
                      description: Default org-level trail setting. false = no default enforcement.
                    s3BucketName:
                      type: string
                      default: ""
                      description: Default S3 bucket name. Empty string = no default.
                    s3KeyPrefix:
                      type: string
                      default: ""
                      description: Default S3 key prefix. Empty string = no default.
                    kmsKeyID:
                      type: string
                      default: ""
                      description: Default KMS key ARN. Empty string = no default.
                    multiRegionEnabled:
                      type: boolean
                      default: false
                      description: Default multi-region EDS setting. false = no default enforcement.
                    organizationEnabled:
                      type: boolean
                      default: false
                      description: Default org-level EDS setting. false = no default enforcement.
                    retentionPeriod:
                      type: integer
                      format: int64
                      default: 0
                      minimum: 0
                      description: Default event data store retention period in days. 0 = no default.
                    terminationProtectionEnabled:
                      type: boolean
                      default: false
                      description: Default termination protection setting. false = no default enforcement.
                    namingTemplate:
                      type: string
                      default: ""
                      description: Default naming template. Empty string = no default.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                syncedTimestamp:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged CloudTrail governance config written by kropath-controller.
                    RGDs read exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        isMultiRegionTrail:
                          type: boolean
                        enableLogFileValidation:
                          type: boolean
                        includeGlobalServiceEvents:
                          type: boolean
                        isOrganizationTrail:
                          type: boolean
                        s3BucketName:
                          type: string
                        s3KeyPrefix:
                          type: string
                        kmsKeyID:
                          type: string
                        multiRegionEnabled:
                          type: boolean
                        organizationEnabled:
                          type: boolean
                        retentionPeriod:
                          type: integer
                          format: int64
                        terminationProtectionEnabled:
                          type: boolean
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        isMultiRegionTrail:
                          type: boolean
                        enableLogFileValidation:
                          type: boolean
                        includeGlobalServiceEvents:
                          type: boolean
                        isOrganizationTrail:
                          type: boolean
                        s3BucketName:
                          type: string
                        s3KeyPrefix:
                          type: string
                        kmsKeyID:
                          type: string
                        multiRegionEnabled:
                          type: boolean
                        organizationEnabled:
                          type: boolean
                        retentionPeriod:
                          type: integer
                          format: int64
                        terminationProtectionEnabled:
                          type: boolean
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
