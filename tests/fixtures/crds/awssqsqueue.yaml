# (see internal/reconciler/policydocument/resolve.go), so this fixture
# is intentionally minimal rather than mirroring the full ACK schema.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: awssqsqueues.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: AWSSQSQueue
    listKind: AWSSQSQueueList
    plural: awssqsqueues
    singular: awssqsqueue
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                predictedArn:
                  type: string
              x-kubernetes-preserve-unknown-fields: true
