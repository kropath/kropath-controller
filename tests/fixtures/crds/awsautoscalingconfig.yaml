---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: autoscalingconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: AutoScalingConfig
    listKind: AutoScalingConfigList
    plural: autoscalingconfigs
    singular: autoscalingconfig
    shortNames:
      - awsascfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.newInstancesProtectedFromScaleIn) &&
                  self.spec.mandatory.newInstancesProtectedFromScaleIn == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.newInstancesProtectedFromScaleIn) &&
                  self.spec.defaults.newInstancesProtectedFromScaleIn == true)
              message: >-
                newInstancesProtectedFromScaleIn cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.capacityRebalance) &&
                  self.spec.mandatory.capacityRebalance == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.capacityRebalance) &&
                  self.spec.defaults.capacityRebalance == true)
              message: >-
                capacityRebalance cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.healthCheckType) &&
                  self.spec.mandatory.healthCheckType != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.healthCheckType) &&
                  self.spec.defaults.healthCheckType != "")
              message: >-
                healthCheckType cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                mandatory:
                  type: object
                  properties:
                    newInstancesProtectedFromScaleIn:
                      type: boolean
                    capacityRebalance:
                      type: boolean
                    healthCheckType:
                      type: string
                    healthCheckGracePeriod:
                      type: integer
                      format: int64
                    maxInstanceLifetime:
                      type: integer
                      format: int64
                    namingTemplate:
                      type: string
                    syncedLabels:
                      type: object
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      additionalProperties:
                        type: string
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  properties:
                    newInstancesProtectedFromScaleIn:
                      type: boolean
                    capacityRebalance:
                      type: boolean
                    healthCheckType:
                      type: string
                    healthCheckGracePeriod:
                      type: integer
                      format: int64
                    maxInstanceLifetime:
                      type: integer
                      format: int64
                    namingTemplate:
                      type: string
                    syncedLabels:
                      type: object
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      additionalProperties:
                        type: string
                    tags:
                      type: object
                      additionalProperties:
                        type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
