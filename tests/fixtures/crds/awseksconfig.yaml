apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: eksconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: EKSConfig
    listKind: EKSConfigList
    plural: eksconfigs
    singular: eksconfig
    shortNames:
      - awsekscfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            # String fields: zero-value "" = not enforced.
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.version) &&
                  self.spec.mandatory.version != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.version) &&
                  self.spec.defaults.version != "")
              message: >-
                version cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.authenticationMode) &&
                  self.spec.mandatory.authenticationMode != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.authenticationMode) &&
                  self.spec.defaults.authenticationMode != "")
              message: >-
                authenticationMode cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.encryptionKeyArn) &&
                  self.spec.mandatory.encryptionKeyArn != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.encryptionKeyArn) &&
                  self.spec.defaults.encryptionKeyArn != "")
              message: >-
                encryptionKeyArn cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.supportType) &&
                  self.spec.mandatory.supportType != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.supportType) &&
                  self.spec.defaults.supportType != "")
              message: >-
                supportType cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
            # Array field: nil/empty = not enforced; treat as scalar (first-non-empty wins).
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.loggingTypes) &&
                  size(self.spec.mandatory.loggingTypes) > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.loggingTypes) &&
                  size(self.spec.defaults.loggingTypes) > 0)
              message: >-
                loggingTypes cannot be set in both mandatory and defaults
            # Boolean pointer fields: use has() to detect explicit set (nil = absent).
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.endpointPublicAccess) &&
                  has(self.spec.defaults) && has(self.spec.defaults.endpointPublicAccess))
              message: >-
                endpointPublicAccess cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.endpointPrivateAccess) &&
                  has(self.spec.defaults) && has(self.spec.defaults.endpointPrivateAccess))
              message: >-
                endpointPrivateAccess cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                mandatory:
                  type: object
                  properties:
                    version:
                      type: string
                    authenticationMode:
                      type: string
                    loggingTypes:
                      type: array
                      items:
                        type: string
                    encryptionKeyArn:
                      type: string
                    endpointPublicAccess:
                      type: boolean
                    endpointPrivateAccess:
                      type: boolean
                    supportType:
                      type: string
                    namingTemplate:
                      type: string
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  properties:
                    version:
                      type: string
                    authenticationMode:
                      type: string
                    loggingTypes:
                      type: array
                      items:
                        type: string
                    encryptionKeyArn:
                      type: string
                    endpointPublicAccess:
                      type: boolean
                    endpointPrivateAccess:
                      type: boolean
                    supportType:
                      type: string
                    namingTemplate:
                      type: string
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      additionalProperties:
                        type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
