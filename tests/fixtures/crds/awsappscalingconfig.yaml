---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: appscalingconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: AppScalingConfig
    listKind: AppScalingConfigList
    plural: appscalingconfigs
    singular: appscalingconfig
    shortNames:
      - awsapscfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.disableScaleIn) &&
                  self.spec.mandatory.disableScaleIn == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.disableScaleIn) &&
                  self.spec.defaults.disableScaleIn == true)
              message: >-
                disableScaleIn cannot be set to true in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                mandatory:
                  type: object
                  properties:
                    minCapacity:
                      type: integer
                      format: int64
                    maxCapacity:
                      type: integer
                      format: int64
                    disableScaleIn:
                      type: boolean
                    scaleInCooldown:
                      type: integer
                      format: int64
                    scaleOutCooldown:
                      type: integer
                      format: int64
                    syncedLabels:
                      type: object
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      additionalProperties:
                        type: string
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  properties:
                    minCapacity:
                      type: integer
                      format: int64
                    maxCapacity:
                      type: integer
                      format: int64
                    disableScaleIn:
                      type: boolean
                    scaleInCooldown:
                      type: integer
                      format: int64
                    scaleOutCooldown:
                      type: integer
                      format: int64
                    syncedLabels:
                      type: object
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      additionalProperties:
                        type: string
                    tags:
                      type: object
                      additionalProperties:
                        type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
