# SecretsManagerConfig CRD — governance ResourceConfig for AWS Secrets Manager.
# This CRD is produced by kropath-aws (KRO-250). This copy is used in
# kropath-controller integration tests. Keep in sync with kropath-aws/crds/secretsmanagerconfig.yaml.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: secretsmanagerconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: SecretsManagerConfig
    listKind: SecretsManagerConfigList
    plural: secretsmanagerconfigs
    singular: secretsmanagerconfig
    shortNames:
      - smcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.kmsKeyID) &&
                  self.spec.mandatory.kmsKeyID != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.kmsKeyID) &&
                  self.spec.defaults.kmsKeyID != "")
              message: >-
                kmsKeyID cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory Secrets Manager governance. Cascade levels 3-4 in the
                    ten-level priority chain (ADR-015 §5.3).
                  properties:
                    kmsKeyID:
                      type: string
                      default: ""
                      description: >-
                        Mandatory KMS key ID, ARN, or alias. Overrides the instance spec.
                        Empty string = no mandatory encryption key enforced.
                    replicaRegions:
                      type: array
                      default: []
                      description: >-
                        Cross-region replication targets. Priority replacement — the first
                        non-empty array across governance levels wins (not additive merge).
                      items:
                        type: object
                        properties:
                          region:
                            type: string
                            description: AWS region code (e.g. us-west-2).
                          kmsKeyID:
                            type: string
                            description: KMS key for this replica region.
                    forceOverwriteReplicaSecret:
                      type: boolean
                      description: >-
                        When true, overwrite a pre-existing secret in replica regions.
                        false (zero value) = not enforced.
                    namingTemplate:
                      type: string
                      default: ""
                      description: >-
                        Secret naming template (e.g. "{namespace}-{name}"). Mandatory
                        governance — overrides instance spec.
                    syncedLabels:
                      type: object
                      default: {}
                      description: Labels synced to created Secret resource metadata.
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      description: Annotations synced to created Secret resource metadata.
                      additionalProperties:
                        type: string
                    tags:
                      type: object
                      default: {}
                      description: Cloud resource tags merged into all governed secrets.
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default Secrets Manager governance. Cascade levels 6-7 in the
                    ten-level priority chain (ADR-015 §5.3).
                  properties:
                    kmsKeyID:
                      type: string
                      default: ""
                      description: >-
                        Default KMS key ID, ARN, or alias. Applied when no mandatory
                        source sets kmsKeyID. Empty string = use AWS default key.
                    replicaRegions:
                      type: array
                      default: []
                      description: >-
                        Default cross-region replication targets. Applied when no mandatory
                        source sets replicaRegions.
                      items:
                        type: object
                        properties:
                          region:
                            type: string
                          kmsKeyID:
                            type: string
                    forceOverwriteReplicaSecret:
                      type: boolean
                      description: Default forceOverwrite setting.
                    namingTemplate:
                      type: string
                      default: ""
                      description: Default secret naming template.
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                effectiveConfig:
                  type: object
                  description: >-
                    Merged governance configuration written by kropath-controller.
                    Read-only; written only by the controller reconciler.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        kmsKeyID:
                          type: string
                        replicaRegions:
                          type: array
                          items:
                            type: object
                            properties:
                              region:
                                type: string
                              kmsKeyID:
                                type: string
                        forceOverwriteReplicaSecret:
                          type: boolean
                        namingTemplate:
                          type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        kmsKeyID:
                          type: string
                        replicaRegions:
                          type: array
                          items:
                            type: object
                            properties:
                              region:
                                type: string
                              kmsKeyID:
                                type: string
                        forceOverwriteReplicaSecret:
                          type: boolean
                        namingTemplate:
                          type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
