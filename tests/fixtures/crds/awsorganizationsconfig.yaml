---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: organizationsconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: OrganizationsConfig
    listKind: OrganizationsConfigList
    plural: organizationsconfigs
    singular: organizationsconfig
    shortNames:
      - awsorgcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.iamUserAccessToBilling) &&
                  self.spec.mandatory.iamUserAccessToBilling != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.iamUserAccessToBilling) &&
                  self.spec.defaults.iamUserAccessToBilling != "")
              message: >-
                iamUserAccessToBilling cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.roleName) &&
                  self.spec.mandatory.roleName != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.roleName) &&
                  self.spec.defaults.roleName != "")
              message: >-
                roleName cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.parentId) &&
                  self.spec.mandatory.parentId != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.parentId) &&
                  self.spec.defaults.parentId != "")
              message: >-
                parentId cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory Organizations governance fields. Zero-value / nil means the field
                    is not enforced at this tier.
                  properties:
                    iamUserAccessToBilling:
                      type: string
                      default: ""
                      description: >-
                        Whether IAM users can access billing information. Empty string = not enforced.
                    roleName:
                      type: string
                      default: ""
                      description: >-
                        IAM role name for cross-account access. Empty string = not enforced.
                    parentId:
                      type: string
                      default: ""
                      description: >-
                        Parent organizational unit or root ID. Empty string = not enforced.
                    namingTemplate:
                      type: string
                      default: ""
                      description: Organization account naming template. Empty = not enforced.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default Organizations governance fields. Zero-value / nil means no default
                    is provided at this tier.
                  properties:
                    iamUserAccessToBilling:
                      type: string
                      default: ""
                      description: Default IAM user access to billing. Empty string = no default.
                    roleName:
                      type: string
                      default: ""
                      description: Default IAM role name. Empty string = no default.
                    parentId:
                      type: string
                      default: ""
                      description: Default parent organizational unit or root ID. Empty string = no default.
                    namingTemplate:
                      type: string
                      default: ""
                      description: Default naming template. Empty string = no default.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                syncedTimestamp:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged Organizations governance config written by kropath-controller.
                    RGDs read exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        iamUserAccessToBilling:
                          type: string
                        roleName:
                          type: string
                        parentId:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        iamUserAccessToBilling:
                          type: string
                        roleName:
                          type: string
                        parentId:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
