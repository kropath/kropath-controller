---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: memorydbconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: MemoryDBConfig
    listKind: MemoryDBConfigList
    plural: memorydbconfigs
    singular: memorydbconfig
    shortNames:
      - awsmemorydbcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.tlsEnabled) &&
                  self.spec.mandatory.tlsEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.tlsEnabled) &&
                  self.spec.defaults.tlsEnabled == true)
              message: >-
                tlsEnabled cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.kmsKeyArn) &&
                  self.spec.mandatory.kmsKeyArn != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.kmsKeyArn) &&
                  self.spec.defaults.kmsKeyArn != "")
              message: >-
                kmsKeyArn cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.nodeType) &&
                  self.spec.mandatory.nodeType != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.nodeType) &&
                  self.spec.defaults.nodeType != "")
              message: >-
                nodeType cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.engineVersion) &&
                  self.spec.mandatory.engineVersion != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.engineVersion) &&
                  self.spec.defaults.engineVersion != "")
              message: >-
                engineVersion cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.allowedNodeTypes) &&
                  size(self.spec.mandatory.allowedNodeTypes) > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.allowedNodeTypes) &&
                  size(self.spec.defaults.allowedNodeTypes) > 0)
              message: >-
                allowedNodeTypes cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.numReplicasPerShard) &&
                  self.spec.mandatory.numReplicasPerShard > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.numReplicasPerShard) &&
                  self.spec.defaults.numReplicasPerShard > 0)
              message: >-
                numReplicasPerShard cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.snapshotRetentionLimit) &&
                  self.spec.mandatory.snapshotRetentionLimit > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.snapshotRetentionLimit) &&
                  self.spec.defaults.snapshotRetentionLimit > 0)
              message: >-
                snapshotRetentionLimit cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.autoMinorVersionUpgrade) &&
                  self.spec.mandatory.autoMinorVersionUpgrade == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.autoMinorVersionUpgrade) &&
                  self.spec.defaults.autoMinorVersionUpgrade == true)
              message: >-
                autoMinorVersionUpgrade cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory MemoryDB governance fields. Zero-value / nil means the
                    field is not enforced at this tier.
                  properties:
                    tlsEnabled:
                      type: boolean
                      description: >-
                        Enforce TLS on all MemoryDB clusters. Omit (nil) = not enforced.
                    kmsKeyArn:
                      type: string
                      description: >-
                        Force a specific KMS key ARN for encryption. Empty = not enforced.
                        No KropathConfig.memorydb equivalent.
                    nodeType:
                      type: string
                      description: >-
                        Force a specific node type (e.g. "db.r7g.large"). Empty = not enforced.
                        No KropathConfig.memorydb equivalent.
                    engineVersion:
                      type: string
                      description: >-
                        Force a specific MemoryDB engine version (e.g. "7.1.0"). Empty = not enforced.
                        No KropathConfig.memorydb equivalent.
                    allowedNodeTypes:
                      type: array
                      description: >-
                        Restrict node types to an allowlist. Empty = no restriction.
                      items:
                        type: string
                    numReplicasPerShard:
                      type: integer
                      format: int64
                      description: >-
                        Minimum replica count per shard. 0 = not enforced.
                        No KropathConfig.memorydb equivalent.
                    snapshotRetentionLimit:
                      type: integer
                      format: int64
                      description: >-
                        Minimum snapshot retention in days. 0 = not enforced.
                    autoMinorVersionUpgrade:
                      type: boolean
                      description: >-
                        Force automatic minor version upgrades. Omit (nil) = not enforced.
                        No KropathConfig.memorydb equivalent.
                    namingTemplate:
                      type: string
                      description: >-
                        Naming template (e.g. "{namespace}-{name}"). Empty = not enforced.
                        No KropathConfig.memorydb equivalent.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default MemoryDB governance fields. Zero-value / nil means no
                    default is provided at this tier.
                  properties:
                    tlsEnabled:
                      type: boolean
                      description: >-
                        Default TLS setting. Omit (nil) = no default.
                    kmsKeyArn:
                      type: string
                      description: >-
                        Default KMS key ARN. Empty = no default.
                    nodeType:
                      type: string
                      description: >-
                        Default node type. Empty = no default.
                    engineVersion:
                      type: string
                      description: >-
                        Default engine version. Empty = no default.
                    allowedNodeTypes:
                      type: array
                      description: >-
                        Default node type allowlist. Empty = no default.
                      items:
                        type: string
                    numReplicasPerShard:
                      type: integer
                      format: int64
                      description: >-
                        Default replica count per shard. 0 = no default.
                    snapshotRetentionLimit:
                      type: integer
                      format: int64
                      description: >-
                        Default snapshot retention in days. 0 = no default.
                    autoMinorVersionUpgrade:
                      type: boolean
                      description: >-
                        Default auto minor version upgrade setting. Omit (nil) = no default.
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming template. Empty = no default.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                syncedTimestamp:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged MemoryDB governance config written by kropath-controller.
                    RGDs read exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        tlsEnabled:
                          type: boolean
                        kmsKeyArn:
                          type: string
                        nodeType:
                          type: string
                        engineVersion:
                          type: string
                        allowedNodeTypes:
                          type: array
                          items:
                            type: string
                        numReplicasPerShard:
                          type: integer
                          format: int64
                        snapshotRetentionLimit:
                          type: integer
                          format: int64
                        autoMinorVersionUpgrade:
                          type: boolean
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        tlsEnabled:
                          type: boolean
                        kmsKeyArn:
                          type: string
                        nodeType:
                          type: string
                        engineVersion:
                          type: string
                        allowedNodeTypes:
                          type: array
                          items:
                            type: string
                        numReplicasPerShard:
                          type: integer
                          format: int64
                        snapshotRetentionLimit:
                          type: integer
                          format: int64
                        autoMinorVersionUpgrade:
                          type: boolean
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
