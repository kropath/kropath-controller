---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bedrockconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: BedrockConfig
    listKind: BedrockConfigList
    plural: bedrockconfigs
    singular: bedrockconfig
    shortNames:
      - awsbedrockcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.guardrailIdentifier) &&
                  self.spec.mandatory.guardrailIdentifier != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.guardrailIdentifier) &&
                  self.spec.defaults.guardrailIdentifier != "")
              message: >-
                guardrailIdentifier cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.guardrailVersion) &&
                  self.spec.mandatory.guardrailVersion != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.guardrailVersion) &&
                  self.spec.defaults.guardrailVersion != "")
              message: >-
                guardrailVersion cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.foundationModel) &&
                  self.spec.mandatory.foundationModel != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.foundationModel) &&
                  self.spec.defaults.foundationModel != "")
              message: >-
                foundationModel cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                mandatory:
                  type: object
                  properties:
                    guardrailIdentifier:
                      type: string
                    guardrailVersion:
                      type: string
                    foundationModel:
                      type: string
                    allowedModels:
                      type: array
                      items:
                        type: string
                    maxIterations:
                      type: integer
                      format: int64
                    maxTokens:
                      type: integer
                      format: int64
                    timeoutSeconds:
                      type: integer
                      format: int64
                    idleSessionTTLInSeconds:
                      type: integer
                      format: int64
                    namingTemplate:
                      type: string
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  properties:
                    guardrailIdentifier:
                      type: string
                    guardrailVersion:
                      type: string
                    foundationModel:
                      type: string
                    allowedModels:
                      type: array
                      items:
                        type: string
                    maxIterations:
                      type: integer
                      format: int64
                    maxTokens:
                      type: integer
                      format: int64
                    timeoutSeconds:
                      type: integer
                      format: int64
                    idleSessionTTLInSeconds:
                      type: integer
                      format: int64
                    namingTemplate:
                      type: string
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      additionalProperties:
                        type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
