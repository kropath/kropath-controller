apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: awskropathconfigs.kropath.run
spec:
  group: kropath.run
  scope: Namespaced
  names:
    kind: AWSKropathConfig
    listKind: AWSKropathConfigList
    plural: awskropathconfigs
    singular: awskropathconfig
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              properties:
                mandatory:
                  type: object
                  properties:
                    iam:
                      type: object
                      properties:
                        permissionsBoundaryArn:
                          type: string
                          default: ""
                        blockIamUserAccessKeys:
                          type: boolean
                          default: false
                        maxSessionDurationSeconds:
                          type: integer
                          format: int64
                          default: 0
                    s3:
                      type: object
                      properties:
                        encryptionAlgorithm:
                          type: string
                          default: ""
                        kmsKeyArn:
                          type: string
                          default: ""
                        blockPublicAccess:
                          type: boolean
                          default: false
                        versioning:
                          type: string
                          default: ""
                        loggingEnabled:
                          type: boolean
                          default: false
                        logDeliveryBucket:
                          type: string
                          default: ""
                        enforceHttpsOnly:
                          type: boolean
                          default: false
                        objectLockMode:
                          type: string
                          default: ""
                        objectLockRetentionDays:
                          type: integer
                          format: int64
                          default: 0
                    namingTemplate:
                      type: string
                      default: ""
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  properties:
                    iam:
                      type: object
                      properties:
                        permissionsBoundaryArn:
                          type: string
                          default: ""
                        blockIamUserAccessKeys:
                          type: boolean
                          default: false
                        maxSessionDurationSeconds:
                          type: integer
                          format: int64
                          default: 0
                    s3:
                      type: object
                      properties:
                        encryptionAlgorithm:
                          type: string
                          default: ""
                        kmsKeyArn:
                          type: string
                          default: ""
                        blockPublicAccess:
                          type: boolean
                          default: false
                        versioning:
                          type: string
                          default: ""
                        loggingEnabled:
                          type: boolean
                          default: false
                        logDeliveryBucket:
                          type: string
                          default: ""
                        enforceHttpsOnly:
                          type: boolean
                          default: false
                        objectLockMode:
                          type: string
                          default: ""
                        objectLockRetentionDays:
                          type: integer
                          format: int64
                          default: 0
                    namingTemplate:
                      type: string
                      default: ""
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                aws:
                  type: object
                  properties:
                    accountId:
                      type: string
                      default: ""
                    region:
                      type: string
                      default: ""
          x-kubernetes-validations:
            - rule: '!(self.spec.mandatory.iam.permissionsBoundaryArn != "" && has(self.spec.defaults) && has(self.spec.defaults.iam) && self.spec.defaults.iam.permissionsBoundaryArn != "")'
              message: permissionsBoundaryArn must be set in either mandatory or defaults, not both.
            - rule: '!(self.spec.mandatory.iam.blockIamUserAccessKeys && has(self.spec.defaults) && has(self.spec.defaults.iam) && self.spec.defaults.iam.blockIamUserAccessKeys)'
              message: blockIamUserAccessKeys must be set in either mandatory or defaults, not both.
            - rule: '!(self.spec.mandatory.iam.maxSessionDurationSeconds > 0 && has(self.spec.defaults) && has(self.spec.defaults.iam) && self.spec.defaults.iam.maxSessionDurationSeconds > 0)'
              message: maxSessionDurationSeconds must be set in either mandatory or defaults, not both.
