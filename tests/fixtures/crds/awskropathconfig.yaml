apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kropathconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  scope: Namespaced
  names:
    kind: KropathConfig
    listKind: KropathConfigList
    plural: kropathconfigs
    singular: kropathconfig
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          x-kubernetes-validations:
            - rule: '!(self.spec.mandatory.iam.permissionsBoundaryArn != "" && has(self.spec.defaults) && has(self.spec.defaults.iam) && self.spec.defaults.iam.permissionsBoundaryArn != "")'
              message: permissionsBoundaryArn must be set in either mandatory or defaults, not both.
            - rule: '!(self.spec.mandatory.iam.blockIamUserAccessKeys && has(self.spec.defaults) && has(self.spec.defaults.iam) && self.spec.defaults.iam.blockIamUserAccessKeys)'
              message: blockIamUserAccessKeys must be set in either mandatory or defaults, not both.
            - rule: '!(self.spec.mandatory.iam.maxSessionDurationSeconds > 0 && has(self.spec.defaults) && has(self.spec.defaults.iam) && self.spec.defaults.iam.maxSessionDurationSeconds > 0)'
              message: maxSessionDurationSeconds must be set in either mandatory or defaults, not both.
            - rule: '!(self.spec.mandatory.s3.encryptionAlgorithm != "" && has(self.spec.defaults) && has(self.spec.defaults.s3) && self.spec.defaults.s3.encryptionAlgorithm != "")'
              message: encryptionAlgorithm must be set in either mandatory or defaults, not both.
            - rule: '!(self.spec.mandatory.s3.kmsKeyArn != "" && has(self.spec.defaults) && has(self.spec.defaults.s3) && self.spec.defaults.s3.kmsKeyArn != "")'
              message: kmsKeyArn must be set in either mandatory or defaults, not both.
            - rule: '!(self.spec.mandatory.s3.blockPublicAccess && has(self.spec.defaults) && has(self.spec.defaults.s3) && self.spec.defaults.s3.blockPublicAccess)'
              message: blockPublicAccess must be set in either mandatory or defaults, not both.
            - rule: '!(self.spec.mandatory.s3.versioning != "" && has(self.spec.defaults) && has(self.spec.defaults.s3) && self.spec.defaults.s3.versioning != "")'
              message: versioning must be set in either mandatory or defaults, not both.
            - rule: '!(self.spec.mandatory.s3.loggingEnabled && has(self.spec.defaults) && has(self.spec.defaults.s3) && self.spec.defaults.s3.loggingEnabled)'
              message: loggingEnabled must be set in either mandatory or defaults, not both.
            - rule: '!(self.spec.mandatory.s3.logDeliveryBucket != "" && has(self.spec.defaults) && has(self.spec.defaults.s3) && self.spec.defaults.s3.logDeliveryBucket != "")'
              message: logDeliveryBucket must be set in either mandatory or defaults, not both.
            - rule: '!(self.spec.mandatory.s3.enforceHttpsOnly && has(self.spec.defaults) && has(self.spec.defaults.s3) && self.spec.defaults.s3.enforceHttpsOnly)'
              message: enforceHttpsOnly must be set in either mandatory or defaults, not both.
            - rule: '!(self.spec.mandatory.s3.objectLockMode != "" && has(self.spec.defaults) && has(self.spec.defaults.s3) && self.spec.defaults.s3.objectLockMode != "")'
              message: objectLockMode must be set in either mandatory or defaults, not both.
            - rule: '!(self.spec.mandatory.s3.objectLockRetentionDays > 0 && has(self.spec.defaults) && has(self.spec.defaults.s3) && self.spec.defaults.s3.objectLockRetentionDays > 0)'
              message: objectLockRetentionDays must be set in either mandatory or defaults, not both.
            - rule: '!(has(self.spec.mandatory.kms) && self.spec.mandatory.kms.enableKeyRotation && has(self.spec.defaults.kms) && self.spec.defaults.kms.enableKeyRotation)'
              message: "kms.enableKeyRotation cannot be set to true in both mandatory and defaults"
            - rule: '!(has(self.spec.mandatory.kms) && has(self.spec.mandatory.kms.allowedKeySpecs) && size(self.spec.mandatory.kms.allowedKeySpecs) > 0 && has(self.spec.defaults.kms) && has(self.spec.defaults.kms.allowedKeySpecs) && size(self.spec.defaults.kms.allowedKeySpecs) > 0)'
              message: "kms.allowedKeySpecs cannot be set in both mandatory and defaults"
            - rule: '!(has(self.spec.mandatory.sqs) && self.spec.mandatory.sqs.encryptionType != "" && has(self.spec.defaults.sqs) && self.spec.defaults.sqs.encryptionType != "")'
              message: "sqs.encryptionType cannot be set in both mandatory and defaults"
            - rule: '!(has(self.spec.mandatory.sqs) && self.spec.mandatory.sqs.kmsMasterKeyId != "" && has(self.spec.defaults.sqs) && self.spec.defaults.sqs.kmsMasterKeyId != "")'
              message: "sqs.kmsMasterKeyId cannot be set in both mandatory and defaults"
            - rule: '!(has(self.spec.mandatory.sqs) && self.spec.mandatory.sqs.visibilityTimeout > 0 && has(self.spec.defaults.sqs) && self.spec.defaults.sqs.visibilityTimeout > 0)'
              message: "sqs.visibilityTimeout cannot be set in both mandatory and defaults"
            - rule: '!(has(self.spec.mandatory.sqs) && self.spec.mandatory.sqs.messageRetentionPeriod > 0 && has(self.spec.defaults.sqs) && self.spec.defaults.sqs.messageRetentionPeriod > 0)'
              message: "sqs.messageRetentionPeriod cannot be set in both mandatory and defaults"
            - rule: '!(has(self.spec.mandatory.sqs) && self.spec.mandatory.sqs.delaySeconds > 0 && has(self.spec.defaults.sqs) && self.spec.defaults.sqs.delaySeconds > 0)'
              message: "sqs.delaySeconds cannot be set in both mandatory and defaults"
            - rule: '!(has(self.spec.mandatory.sqs) && self.spec.mandatory.sqs.maximumMessageSize > 0 && has(self.spec.defaults.sqs) && self.spec.defaults.sqs.maximumMessageSize > 0)'
              message: "sqs.maximumMessageSize cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.secretsManager) &&
                  has(self.spec.mandatory.secretsManager.kmsKeyID) &&
                  self.spec.mandatory.secretsManager.kmsKeyID != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.secretsManager) &&
                  has(self.spec.defaults.secretsManager.kmsKeyID) &&
                  self.spec.defaults.secretsManager.kmsKeyID != "")
              message: >-
                spec.mandatory.secretsManager.kmsKeyID and
                spec.defaults.secretsManager.kmsKeyID cannot both be set.
                Set the field in exactly one tier.
            - rule: '!(has(self.spec.mandatory.sns) && self.spec.mandatory.sns.kmsMasterKeyId != "" && has(self.spec.defaults.sns) && self.spec.defaults.sns.kmsMasterKeyId != "")'
              message: "sns.kmsMasterKeyId cannot be set in both mandatory and defaults"
            - rule: '!(has(self.spec.mandatory.sns) && self.spec.mandatory.sns.signatureVersion != "" && has(self.spec.defaults.sns) && self.spec.defaults.sns.signatureVersion != "")'
              message: "sns.signatureVersion cannot be set in both mandatory and defaults"
            - rule: '!(has(self.spec.mandatory.sns) && self.spec.mandatory.sns.tracingConfig != "" && has(self.spec.defaults.sns) && self.spec.defaults.sns.tracingConfig != "")'
              message: "sns.tracingConfig cannot be set in both mandatory and defaults"
            - rule: '!(has(self.spec.mandatory.dynamodb) && self.spec.mandatory.dynamodb.kmsMasterKeyId != "" && has(self.spec.defaults.dynamodb) && self.spec.defaults.dynamodb.kmsMasterKeyId != "")'
              message: "dynamodb.kmsMasterKeyId cannot be set in both mandatory and defaults"
            - rule: '!(has(self.spec.mandatory.dynamodb) && self.spec.mandatory.dynamodb.billingMode != "" && has(self.spec.defaults.dynamodb) && self.spec.defaults.dynamodb.billingMode != "")'
              message: "dynamodb.billingMode cannot be set in both mandatory and defaults"
            - rule: '!(has(self.spec.mandatory.dynamodb) && self.spec.mandatory.dynamodb.tableClass != "" && has(self.spec.defaults.dynamodb) && self.spec.defaults.dynamodb.tableClass != "")'
              message: "dynamodb.tableClass cannot be set in both mandatory and defaults"
            - rule: '!(has(self.spec.mandatory.dynamodb) && self.spec.mandatory.dynamodb.contributorInsights != "" && has(self.spec.defaults.dynamodb) && self.spec.defaults.dynamodb.contributorInsights != "")'
              message: "dynamodb.contributorInsights cannot be set in both mandatory and defaults"
          properties:
            spec:
              type: object
              properties:
                mandatory:
                  type: object
                  default: {}
                  properties:
                    iam:
                      type: object
                      properties:
                        permissionsBoundaryArn:
                          type: string
                          default: ""
                        blockIamUserAccessKeys:
                          type: boolean
                          default: false
                        maxSessionDurationSeconds:
                          type: integer
                          format: int64
                          default: 0
                    s3:
                      type: object
                      default: {}
                      properties:
                        encryptionAlgorithm:
                          type: string
                          default: ""
                        kmsKeyArn:
                          type: string
                          default: ""
                        blockPublicAccess:
                          type: boolean
                          default: false
                        versioning:
                          type: string
                          default: ""
                        loggingEnabled:
                          type: boolean
                          default: false
                        logDeliveryBucket:
                          type: string
                          default: ""
                        enforceHttpsOnly:
                          type: boolean
                          default: false
                        objectLockMode:
                          type: string
                          default: ""
                        objectLockRetentionDays:
                          type: integer
                          format: int64
                          default: 0
                    kms:
                      type: object
                      default: {}
                      properties:
                        enableKeyRotation:
                          type: boolean
                          default: false
                        allowedKeySpecs:
                          type: array
                          items:
                            type: string
                          default: []
                    sqs:
                      type: object
                      default: {}
                      properties:
                        encryptionType:
                          type: string
                          default: ""
                        kmsMasterKeyId:
                          type: string
                          default: ""
                        visibilityTimeout:
                          type: integer
                          format: int64
                          default: 0
                        messageRetentionPeriod:
                          type: integer
                          format: int64
                          default: 0
                        delaySeconds:
                          type: integer
                          format: int64
                          default: 0
                        maximumMessageSize:
                          type: integer
                          format: int64
                          default: 0
                    secretsManager:
                      type: object
                      default: {}
                      properties:
                        kmsKeyID:
                          type: string
                          default: ""
                    sns:
                      type: object
                      default: {}
                      properties:
                        kmsMasterKeyId:
                          type: string
                          default: ""
                        signatureVersion:
                          type: string
                          default: ""
                        tracingConfig:
                          type: string
                          default: ""
                    dynamodb:
                      type: object
                      default: {}
                      properties:
                        encryptionEnabled:
                          type: boolean
                        kmsMasterKeyId:
                          type: string
                          default: ""
                        deletionProtectionEnabled:
                          type: boolean
                        pointInTimeRecoveryEnabled:
                          type: boolean
                        billingMode:
                          type: string
                          default: ""
                        tableClass:
                          type: string
                          default: ""
                        contributorInsights:
                          type: string
                          default: ""
                        tags:
                          type: object
                          default: {}
                          additionalProperties:
                            type: string
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                      default: {}
                defaults:
                  type: object
                  default: {}
                  properties:
                    iam:
                      type: object
                      properties:
                        permissionsBoundaryArn:
                          type: string
                          default: ""
                        blockIamUserAccessKeys:
                          type: boolean
                          default: false
                        maxSessionDurationSeconds:
                          type: integer
                          format: int64
                          default: 0
                    s3:
                      type: object
                      default: {}
                      properties:
                        encryptionAlgorithm:
                          type: string
                          default: ""
                        kmsKeyArn:
                          type: string
                          default: ""
                        blockPublicAccess:
                          type: boolean
                          default: false
                        versioning:
                          type: string
                          default: ""
                        loggingEnabled:
                          type: boolean
                          default: false
                        logDeliveryBucket:
                          type: string
                          default: ""
                        enforceHttpsOnly:
                          type: boolean
                          default: false
                        objectLockMode:
                          type: string
                          default: ""
                        objectLockRetentionDays:
                          type: integer
                          format: int64
                          default: 0
                    kms:
                      type: object
                      default: {}
                      properties:
                        enableKeyRotation:
                          type: boolean
                          default: false
                        allowedKeySpecs:
                          type: array
                          items:
                            type: string
                          default: []
                    sqs:
                      type: object
                      default: {}
                      properties:
                        encryptionType:
                          type: string
                          default: ""
                        kmsMasterKeyId:
                          type: string
                          default: ""
                        visibilityTimeout:
                          type: integer
                          format: int64
                          default: 0
                        messageRetentionPeriod:
                          type: integer
                          format: int64
                          default: 0
                        delaySeconds:
                          type: integer
                          format: int64
                          default: 0
                        maximumMessageSize:
                          type: integer
                          format: int64
                          default: 0
                    secretsManager:
                      type: object
                      default: {}
                      properties:
                        kmsKeyID:
                          type: string
                          default: ""
                    sns:
                      type: object
                      default: {}
                      properties:
                        kmsMasterKeyId:
                          type: string
                          default: ""
                        signatureVersion:
                          type: string
                          default: ""
                        tracingConfig:
                          type: string
                          default: ""
                    dynamodb:
                      type: object
                      default: {}
                      properties:
                        encryptionEnabled:
                          type: boolean
                        kmsMasterKeyId:
                          type: string
                          default: ""
                        deletionProtectionEnabled:
                          type: boolean
                        pointInTimeRecoveryEnabled:
                          type: boolean
                        billingMode:
                          type: string
                          default: ""
                        tableClass:
                          type: string
                          default: ""
                        contributorInsights:
                          type: string
                          default: ""
                        tags:
                          type: object
                          default: {}
                          additionalProperties:
                            type: string
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                      default: {}
                aws:
                  type: object
                  properties:
                    accountId:
                      type: string
                      default: ""
                    region:
                      type: string
                      default: ""
