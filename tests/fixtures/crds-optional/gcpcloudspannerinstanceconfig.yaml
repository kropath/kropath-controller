# Test-only stand-in GCP CRD for ctrl-dyn-05 (AC-10).
# Must be absent at operator startup — placed in crds-optional/ deliberately.
# Used to verify labeloperator registers a controller at runtime when a new
# provider CRD becomes available after startup.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudspannerinstanceconfigs.gcp.kropath.run
spec:
  group: gcp.kropath.run
  names:
    kind: CloudSpannerInstanceConfig
    listKind: CloudSpannerInstanceConfigList
    plural: cloudspannerinstanceconfigs
    singular: cloudspannerinstanceconfig
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
