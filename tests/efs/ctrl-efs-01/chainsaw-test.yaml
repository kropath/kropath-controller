# ctrl-efs-01 Chainsaw integration tests — all 10 controller acceptance criteria.
# Requires:
#   - kind cluster with kropath-operator deployed
#   - KropathConfig CRD applied (fixtures/crds/awskropathconfig.yaml)
#   - EFSConfig CRD applied (fixtures/crds/awsefsconfig.yaml)
#
# Test isolation — unique name per step, no inter-step deletes:
#   Each step owns a distinct set of resource names (ac<N>-*). The controller
#   pairs a namespaced config with its kro-system counterpart by *name*, so a
#   per-step name isolates each step completely — no step can shadow another,
#   in either direction, regardless of order. That removes the need for the
#   per-step cleanup deletes and inline reset steps this suite used to carry.
#   See kropath-aws docs/frequent-rgd-errors.md §6 for the full rationale.
#
#   skipDelete is not set per-suite; the whole run instead passes --skip-delete
#   via CHAINSAW_FLAGS in the Makefile, matching the reference pattern. Chainsaw
#   otherwise deletes each step's resources at step end and blocks on it, and
#   since every AC now creates its own Namespace pair that cost dominated the
#   job -- 310 namespace deletions, 27.4 of 32 minutes (KRO-1154). Deletion is
#   not what isolates suites here; the unique-name-per-AC rule above is.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-efs-01-cascade
spec:
  namespace: efs
  namespaceTemplate:
    metadata:
      annotations:
        aws.kropath.run/global-config-namespace: kro-system
        services.k8s.aws/owner-account-id: "123456789012"
        services.k8s.aws/default-region: "us-east-1"
  steps:
    # AC-C1: globalEFSConfig.mandatory.encrypted=true (level 3) propagates.
    - name: ac-c1-global-efscfg-encrypted-level3
      try:
        - apply:
            file: ac01-setup.yaml
        - assert:
            file: ac01-assert.yaml
            timeout: 30s

    # AC-C2: globalEFSConfig.mandatory.kmsKeyId (level 3) propagates.
    - name: ac-c2-global-efscfg-kmskey-level3
      try:
        - apply:
            file: ac02-setup.yaml
        - assert:
            file: ac02-assert.yaml
            timeout: 30s

    # AC-C3: localEFSConfig.defaults.encrypted=false (level 6) is preserved;
    # explicit false must not be treated as nil.
    - name: ac-c3-local-efscfg-defaults-encrypted-false
      try:
        - apply:
            file: ac03-setup.yaml
        - assert:
            file: ac03-assert.yaml
            timeout: 30s

    # AC-C4: localEFSConfig.defaults.performanceMode (level 6) propagates.
    - name: ac-c4-local-efscfg-defaults-performancemode
      try:
        - apply:
            file: ac04-setup.yaml
        - assert:
            file: ac04-assert.yaml
            timeout: 30s

    # AC-C5: localEFSConfig.defaults.throughputMode (level 6) propagates.
    - name: ac-c5-local-efscfg-defaults-throughputmode
      try:
        - apply:
            file: ac05-setup.yaml
        - assert:
            file: ac05-assert.yaml
            timeout: 30s

    # AC-C6: globalEFSConfig.mandatory.backupEnabled=true (level 3) propagates.
    - name: ac-c6-global-efscfg-backup-level3
      try:
        - apply:
            file: ac06-setup.yaml
        - assert:
            file: ac06-assert.yaml
            timeout: 30s

    # AC-C7: localEFSConfig.defaults.replicationOverwriteProtection (level 6) propagates.
    - name: ac-c7-local-efscfg-defaults-replication-protection
      try:
        - apply:
            file: ac07-setup.yaml
        - assert:
            file: ac07-assert.yaml
            timeout: 30s

    # AC-C8: Tags union — KropathConfig.mandatory.tags and EFSConfig.mandatory.tags
    # both appear in effectiveConfig.mandatory.tags.
    - name: ac-c8-tags-union-mandatory
      try:
        - apply:
            file: ac08-setup.yaml
        - assert:
            file: ac08-assert.yaml
            timeout: 30s

    # AC-C9: syncedLabels from globalEFSConfig.mandatory propagates.
    - name: ac-c9-syncedlabels-mandatory
      try:
        - apply:
            file: ac09-setup.yaml
        - assert:
            file: ac09-assert.yaml
            timeout: 30s

    # AC-C10: effectiveConfig.aws.accountId and region are populated from KropathConfig.
    - name: ac-c10-aws-identity
      try:
        - apply:
            file: ac10-setup.yaml
        - assert:
            file: ac10-assert.yaml
            timeout: 30s
