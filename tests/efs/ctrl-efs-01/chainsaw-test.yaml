# ctrl-efs-01 Chainsaw integration tests — all 10 controller acceptance criteria.
# Requires:
#   - kind cluster with kropath-operator deployed (feature flag: --enable-efs-cascade)
#   - KropathConfig CRD applied (fixtures/crds/awskropathconfig.yaml)
#   - EFSConfig CRD applied (fixtures/crds/awsefsconfig.yaml)
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-efs-01-cascade
spec:
  namespace: efs
  steps:
    # Purge any stale resources from prior runs before the suite starts.
    - name: purge-stale-leftovers
      try:
        - script:
            content: |
              kubectl delete efsconfig general-storage -n efs --ignore-not-found
              kubectl delete efsconfig general-storage -n kro-system --ignore-not-found
              kubectl delete kropathconfig general-storage -n kro-system --ignore-not-found
              kubectl delete kropathconfig general-storage -n efs --ignore-not-found

    # AC-C1: globalEFSConfig.mandatory.encrypted=true (level 3) propagates.
    - name: ac-c1-global-efscfg-encrypted-level3
      try:
        - apply:
            file: 01-global-efscfg-encrypted-true.yaml
        - apply:
            file: 02-efsconfig.yaml
        - assert:
            file: 03-assert-ac-c1.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-efsconfig.yaml
        - delete:
            file: 01-global-efscfg-encrypted-true.yaml

    # AC-C2: globalEFSConfig.mandatory.kmsKeyId (level 3) propagates.
    - name: ac-c2-global-efscfg-kmskey-level3
      try:
        - apply:
            file: 04-global-efscfg-kmskey.yaml
        - apply:
            file: 02-efsconfig.yaml
        - assert:
            file: 05-assert-ac-c2.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-efsconfig.yaml
        - delete:
            file: 04-global-efscfg-kmskey.yaml

    # AC-C3: localEFSConfig.defaults.encrypted=false (level 6) is preserved;
    # explicit false must not be treated as nil.
    - name: ac-c3-local-efscfg-defaults-encrypted-false
      try:
        - apply:
            file: 06-local-efscfg-defaults-encrypted-false.yaml
        - assert:
            file: 07-assert-ac-c3.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 06-local-efscfg-defaults-encrypted-false.yaml

    # AC-C4: localEFSConfig.defaults.performanceMode (level 6) propagates.
    - name: ac-c4-local-efscfg-defaults-performancemode
      try:
        - apply:
            file: 08-local-efscfg-defaults-performancemode.yaml
        - assert:
            file: 09-assert-ac-c4.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 08-local-efscfg-defaults-performancemode.yaml

    # AC-C5: localEFSConfig.defaults.throughputMode (level 6) propagates.
    - name: ac-c5-local-efscfg-defaults-throughputmode
      try:
        - apply:
            file: 10-local-efscfg-defaults-throughputmode.yaml
        - assert:
            file: 11-assert-ac-c5.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 10-local-efscfg-defaults-throughputmode.yaml

    # AC-C6: globalEFSConfig.mandatory.backupEnabled=true (level 3) propagates.
    - name: ac-c6-global-efscfg-backup-level3
      try:
        - apply:
            file: 12-global-efscfg-backup-true.yaml
        - apply:
            file: 02-efsconfig.yaml
        - assert:
            file: 13-assert-ac-c6.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-efsconfig.yaml
        - delete:
            file: 12-global-efscfg-backup-true.yaml

    # AC-C7: localEFSConfig.defaults.replicationOverwriteProtection (level 6) propagates.
    - name: ac-c7-local-efscfg-defaults-replication-protection
      try:
        - apply:
            file: 14-local-efscfg-defaults-replication.yaml
        - assert:
            file: 15-assert-ac-c7.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 14-local-efscfg-defaults-replication.yaml

    # AC-C8: Tags union — KropathConfig.mandatory.tags and EFSConfig.mandatory.tags
    # both appear in effectiveConfig.mandatory.tags.
    - name: ac-c8-tags-union-mandatory
      try:
        - apply:
            file: 16-global-kpc-tags.yaml
        - apply:
            file: 17-global-efscfg-tags.yaml
        - apply:
            file: 02-efsconfig.yaml
        - assert:
            file: 18-assert-ac-c8.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-efsconfig.yaml
        - delete:
            file: 17-global-efscfg-tags.yaml
        - delete:
            file: 16-global-kpc-tags.yaml

    # AC-C9: syncedLabels from globalEFSConfig.mandatory propagates.
    - name: ac-c9-syncedlabels-mandatory
      try:
        - apply:
            file: 19-global-efscfg-syncedlabels.yaml
        - apply:
            file: 02-efsconfig.yaml
        - assert:
            file: 20-assert-ac-c9.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-efsconfig.yaml
        - delete:
            file: 19-global-efscfg-syncedlabels.yaml

    # AC-C10: effectiveConfig.aws.accountId and region are populated from KropathConfig.
    - name: ac-c10-aws-identity
      try:
        - apply:
            file: 21-global-kpc-aws-identity.yaml
        - apply:
            file: 02-efsconfig.yaml
        - assert:
            file: 22-assert-ac-c10.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-efsconfig.yaml
        - delete:
            file: 21-global-kpc-aws-identity.yaml
