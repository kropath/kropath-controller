# Global EFSConfig (kro-system) — sets mandatory.kmsKeyId (level 3).
apiVersion: aws.kropath.run/v1alpha1
kind: EFSConfig
metadata:
  name: ac2-general-storage
  namespace: kro-system
spec:
  mandatory:
    kmsKeyId: "arn:aws:kms:us-east-1:123456789012:key/global-key"
---
# Local EFSConfig (namespace=efs) — base resource used across multiple AC steps.
# No mandatory or defaults fields set; tests layer governance on top.
apiVersion: aws.kropath.run/v1alpha1
kind: EFSConfig
metadata:
  name: ac2-general-storage
  namespace: efs
spec: {}
