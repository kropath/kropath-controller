# Global KropathConfig — sets aws.accountId and aws.region.
apiVersion: v1
kind: Namespace
metadata:
  name: ac10-efs-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac10-efs-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac10-efs-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac10-efs-global-ns
spec: {}
---
# Local EFSConfig (namespace=efs) — base resource used across multiple AC steps.
# No mandatory or defaults fields set; tests layer governance on top.
apiVersion: aws.kropath.run/v1alpha1
kind: EFSConfig
metadata:
  name: ac10-general-storage
  namespace: ac10-efs-app-ns
spec: {}
