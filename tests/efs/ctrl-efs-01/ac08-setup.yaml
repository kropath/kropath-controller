# Global KropathConfig — sets mandatory.tags (level 1 org-wide tags).
apiVersion: v1
kind: Namespace
metadata:
  name: ac08-efs-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac08-efs-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac08-efs-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac08-efs-global-ns
spec:
  mandatory:
    tags:
      cost-centre: platform
---
# Global EFSConfig — sets mandatory.tags (level 3).
apiVersion: aws.kropath.run/v1alpha1
kind: EFSConfig
metadata:
  name: ac8-general-storage
  namespace: ac08-efs-global-ns
spec:
  mandatory:
    tags:
      resource-type: storage
---
# Local EFSConfig (namespace=efs) — base resource used across multiple AC steps.
# No mandatory or defaults fields set; tests layer governance on top.
apiVersion: aws.kropath.run/v1alpha1
kind: EFSConfig
metadata:
  name: ac8-general-storage
  namespace: ac08-efs-app-ns
spec: {}
