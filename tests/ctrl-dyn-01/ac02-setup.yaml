#
# AC-2: S3Config reconciles despite ELBConfig CRD being absent.
#
# A kro-system KropathConfig sets mandatory.s3.encryptionAlgorithm so the
# controller has a governance value to propagate. The paired S3Config in
# payments-prod should receive it in status.effectiveConfig regardless of
# whether the ELBConfig CRD is installed.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac02-dyn-s3
  namespace: kro-system
spec:
  mandatory:
    s3:
      encryptionAlgorithm: aws:kms
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: S3Config
metadata:
  name: ac02-dyn-s3
  namespace: payments-prod
spec:
  mandatory: {}
  defaults: {}
