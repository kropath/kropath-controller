# AC-10: globalKropathConfig with mandatory.sqs.kmsMasterKeyId (level 1).
apiVersion: v1
kind: Namespace
metadata:
  name: ac10-sqs-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac10-sqs-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac10-sqs-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac10-sqs-global-ns
spec:
  mandatory:
    sqs:
      kmsMasterKeyId: "arn:aws:kms:ap-southeast-2:123:key/org-key"
---
# Shared empty local SQSConfig — all cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: SQSConfig
metadata:
  name: ac10-general-policy
  namespace: ac10-sqs-app-ns
spec:
  mandatory: {}
  defaults: {}
