# AC-8: globalSQSConfig with defaults.maximumMessageSize=131072 (level 7).
apiVersion: aws.kropath.run/v1alpha1
kind: SQSConfig
metadata:
  name: ac8-general-policy
  namespace: kro-system
spec:
  mandatory: {}
  defaults:
    maximumMessageSize: 131072
---
# Shared empty local SQSConfig — all cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: SQSConfig
metadata:
  name: ac8-general-policy
  namespace: payments-prod
spec:
  mandatory: {}
  defaults: {}
