# AC-7: globalSQSConfig with mandatory.delaySeconds=60 (level 3).
apiVersion: aws.kropath.run/v1alpha1
kind: SQSConfig
metadata:
  name: ac7-general-policy
  namespace: kro-system
spec:
  mandatory:
    delaySeconds: 60
  defaults: {}
---
# Shared empty local SQSConfig — all cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: SQSConfig
metadata:
  name: ac7-general-policy
  namespace: payments-prod
spec:
  mandatory: {}
  defaults: {}
