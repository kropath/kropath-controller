# AC-9: globalKropathConfig with mandatory.tags (tier-level tags, level 1).
apiVersion: v1
kind: Namespace
metadata:
  name: ac09-sqs-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac09-sqs-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac09-sqs-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac09-sqs-global-ns
spec:
  mandatory:
    tags:
      cost-centre: infra
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# AC-9: localSQSConfig with mandatory.tags (SQS config-level tags, level 4).
apiVersion: aws.kropath.run/v1alpha1
kind: SQSConfig
metadata:
  name: ac9-general-policy
  namespace: ac09-sqs-app-ns
spec:
  mandatory:
    tags:
      queue-type: messaging
  defaults: {}
