# AC-9: globalKropathConfig with mandatory.tags (tier-level tags, level 1).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac9-general-policy
  namespace: kro-system
spec:
  mandatory:
    tags:
      cost-centre: infra
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# AC-9: localSQSConfig with mandatory.tags (SQS config-level tags, level 4).
apiVersion: aws.kropath.run/v1alpha1
kind: SQSConfig
metadata:
  name: ac9-general-policy
  namespace: payments-prod
spec:
  mandatory:
    tags:
      queue-type: messaging
  defaults: {}
