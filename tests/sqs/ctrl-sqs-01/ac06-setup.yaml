# AC-6: globalKropathConfig with mandatory.sqs.messageRetentionPeriod=604800 (level 1).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac6-general-policy
  namespace: kro-system
spec:
  mandatory:
    sqs:
      messageRetentionPeriod: 604800
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Shared empty local SQSConfig — all cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: SQSConfig
metadata:
  name: ac6-general-policy
  namespace: payments-prod
spec:
  mandatory: {}
  defaults: {}
