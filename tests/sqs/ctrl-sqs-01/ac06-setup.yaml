# AC-6: globalKropathConfig with mandatory.sqs.messageRetentionPeriod=604800 (level 1).
apiVersion: v1
kind: Namespace
metadata:
  name: ac06-sqs-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac06-sqs-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac06-sqs-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac06-sqs-global-ns
spec:
  mandatory:
    sqs:
      messageRetentionPeriod: 604800
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Shared empty local SQSConfig — all cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: SQSConfig
metadata:
  name: ac6-general-policy
  namespace: ac06-sqs-app-ns
spec:
  mandatory: {}
  defaults: {}
