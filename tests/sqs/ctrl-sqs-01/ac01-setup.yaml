# AC-1: globalKropathConfig with mandatory.sqs.encryptionType="kms" (level 1).
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-sqs-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-sqs-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac01-sqs-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac01-sqs-global-ns
spec:
  mandatory:
    sqs:
      encryptionType: "kms"
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Shared empty local SQSConfig — all cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: SQSConfig
metadata:
  name: ac1-general-policy
  namespace: ac01-sqs-app-ns
spec:
  mandatory: {}
  defaults: {}
