# ctrl-sqs-01 Chainsaw integration tests — all 13 acceptance criteria.
# Requires:
#   - kind cluster with kropath-operator deployed
#   - KropathConfig CRD applied (crds/kropathconfig.yaml from kropath-aws)
#   - SQSConfig CRD applied (crds/sqsconfig.yaml from kropath-aws)
#
# Test isolation — unique name per step, no inter-step deletes:
#   Each step owns a distinct set of resource names (ac<N>-*). The controller
#   pairs a namespaced config with its kro-system counterpart by *name*, so a
#   per-step name isolates each step completely — no step can shadow another,
#   in either direction, regardless of order. That removes the need for the
#   per-step cleanup deletes and inline reset steps this suite used to carry.
#   See kropath-aws docs/frequent-rgd-errors.md §6 for the full rationale.
#
#   Unlike that reference, this suite does NOT set skipDelete. Chainsaw's
#   end-of-test cleanup is cheap here — these are plain config CRs with no
#   finalizers and no cloud calls, so there is no deletion queue to back up,
#   which is the only reason skipDelete is mandated there. Letting Chainsaw
#   reclaim each suite's objects keeps the shared kind cluster small; leaving
#   every suite's objects behind for a whole run puts enough reconcile load on
#   the API server to trip the test client's rate limiter in later suites.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-sqs-01-cascade
spec:
  steps:
    # AC-1: globalKropathConfig.mandatory.sqs.encryptionType="kms" (level 1) propagates.
    - name: ac1-global-kpc-encryption-level1
      try:
        - apply:
            file: ac01-setup.yaml
        - assert:
            file: ac01-assert.yaml
            timeout: 30s

    # AC-2: globalSQSConfig.mandatory.encryptionType="kms" (level 3) wins when
    # levels 1-2 are empty.
    - name: ac2-global-sqscfg-encryption-level3
      try:
        - apply:
            file: ac02-setup.yaml
        - assert:
            file: ac02-assert.yaml
            timeout: 30s

    # AC-3: localSQSConfig.defaults.encryptionType="sqs-managed" (level 6) propagates;
    # mandatory.encryptionType stays empty.
    - name: ac3-local-sqscfg-defaults-encryption-level6
      try:
        - apply:
            file: ac03-setup.yaml
        - assert:
            file: ac03-assert.yaml
            timeout: 30s

    # AC-4: globalKropathConfig.mandatory.sqs.visibilityTimeout=120 (level 1) propagates.
    - name: ac4-global-kpc-visibility-level1
      try:
        - apply:
            file: ac04-setup.yaml
        - assert:
            file: ac04-assert.yaml
            timeout: 30s

    # AC-5: globalSQSConfig.defaults.visibilityTimeout=30 (level 7) wins over
    # globalKropathConfig.defaults.sqs.visibilityTimeout=60 (level 9).
    # Chainsaw defers all cleanup blocks to test end, so the AC-4 KropathConfig
    # (kro-system/general-policy with mandatory.sqs.visibilityTimeout=120) is still
    # present when AC-5 runs. Applying fixture 11 (defaults.sqs.visibilityTimeout=60)
    # to that same object triggers the CEL mutual-exclusivity rule.
    # Fix: (1) delete the stale KropathConfig at the start of try; (2) delete the
    # AC-5 KropathConfig after the assert to prevent defaults.sqs.visibilityTimeout
    # leaking into later ACs (follows the KMS AC-8 pattern).
    - name: ac5-global-sqscfg-defaults-wins-over-kpc-defaults
      try:
        - apply:
            file: ac05-setup.yaml
        - assert:
            file: ac05-assert.yaml
            timeout: 30s

    # AC-6: globalKropathConfig.mandatory.sqs.messageRetentionPeriod=604800 (level 1)
    # propagates.
    - name: ac6-global-kpc-retention-level1
      try:
        - apply:
            file: ac06-setup.yaml
        - assert:
            file: ac06-assert.yaml
            timeout: 30s

    # AC-7: globalSQSConfig.mandatory.delaySeconds=60 (level 3) propagates.
    - name: ac7-global-sqscfg-delay-level3
      try:
        - apply:
            file: ac07-setup.yaml
        - assert:
            file: ac07-assert.yaml
            timeout: 30s

    # AC-8: globalSQSConfig.defaults.maximumMessageSize=131072 (level 7) propagates.
    - name: ac8-global-sqscfg-defaults-msgsize-level7
      try:
        - apply:
            file: ac08-setup.yaml
        - assert:
            file: ac08-assert.yaml
            timeout: 30s

    # AC-9: KropathConfig.mandatory.tags and SQSConfig.mandatory.tags are
    # union-merged into effCfg.mandatory.tags.
    - name: ac9-tag-union-merge
      try:
        - apply:
            file: ac09-setup.yaml
        - assert:
            file: ac09-assert.yaml
            timeout: 30s

    # AC-10: globalKropathConfig.mandatory.sqs.kmsMasterKeyId (level 1) propagates.
    - name: ac10-global-kpc-kmskey-level1
      try:
        - apply:
            file: ac10-setup.yaml
        - assert:
            file: ac10-assert.yaml
            timeout: 30s

    # AC-11: globalSQSConfig.defaults.namingTemplate="{namespace}-{name}" (level 7)
    # propagates. KropathConfig.sqs has no namingTemplate field.
    - name: ac11-global-sqscfg-defaults-naming-level7
      try:
        - apply:
            file: ac11-setup.yaml
        - assert:
            file: ac11-assert.yaml
            timeout: 30s

    # AC-12: globalSQSConfig.mandatory.syncedLabels={data-class: internal} (level 3)
    # propagates.
    - name: ac12-global-sqscfg-synced-labels
      try:
        - apply:
            file: ac12-setup.yaml
        - assert:
            file: ac12-assert.yaml
            timeout: 30s

    # AC-13: globalKropathConfig.spec.aws.region and accountId propagate
    # to effCfg.aws.region and effCfg.aws.accountId.
    - name: ac13-provider-identity-propagates
      try:
        - apply:
            file: ac13-setup.yaml
        - assert:
            file: ac13-assert.yaml
            timeout: 30s
