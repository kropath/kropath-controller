# ctrl-sqs-01 Chainsaw integration tests — all 13 acceptance criteria.
# Requires:
#   - kind cluster with kropath-operator deployed (feature flag: --enable-sqs-cascade)
#   - KropathConfig CRD applied (crds/kropathconfig.yaml from kropath-aws)
#   - SQSConfig CRD applied (crds/sqsconfig.yaml from kropath-aws)
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-sqs-01-cascade
spec:
  steps:
    # AC-1: globalKropathConfig.mandatory.sqs.encryptionType="kms" (level 1) propagates.
    - name: ac1-global-kpc-encryption-level1
      try:
        - apply:
            file: 01-global-kpc-encryption-kms.yaml
        - apply:
            file: 02-sqsconfig.yaml
        - assert:
            file: 03-assert-ac1.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-sqsconfig.yaml
        - delete:
            file: 01-global-kpc-encryption-kms.yaml

    # AC-2: globalSQSConfig.mandatory.encryptionType="kms" (level 3) wins when
    # levels 1-2 are empty.
    - name: ac2-global-sqscfg-encryption-level3
      try:
        - apply:
            file: 04-global-sqscfg-encryption-l3.yaml
        - apply:
            file: 02-sqsconfig.yaml
        - assert:
            file: 05-assert-ac2.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-sqsconfig.yaml
        - delete:
            file: 04-global-sqscfg-encryption-l3.yaml

    # AC-3: localSQSConfig.defaults.encryptionType="sqs-managed" (level 6) propagates;
    # mandatory.encryptionType stays empty.
    - name: ac3-local-sqscfg-defaults-encryption-level6
      try:
        - apply:
            file: 06-local-sqscfg-defaults-encryption.yaml
        - assert:
            file: 07-assert-ac3.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 06-local-sqscfg-defaults-encryption.yaml

    # AC-4: globalKropathConfig.mandatory.sqs.visibilityTimeout=120 (level 1) propagates.
    - name: ac4-global-kpc-visibility-level1
      try:
        - apply:
            file: 08-global-kpc-visibility-l1.yaml
        - apply:
            file: 02-sqsconfig.yaml
        - assert:
            file: 09-assert-ac4.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-sqsconfig.yaml
        - delete:
            file: 08-global-kpc-visibility-l1.yaml

    # AC-5: globalSQSConfig.defaults.visibilityTimeout=30 (level 7) wins over
    # globalKropathConfig.defaults.sqs.visibilityTimeout=60 (level 9).
    - name: ac5-global-sqscfg-defaults-wins-over-kpc-defaults
      try:
        - apply:
            file: 11-global-kpc-defaults-visibility-l9.yaml
        - apply:
            file: 10-global-sqscfg-defaults-visibility-l7.yaml
        - apply:
            file: 02-sqsconfig.yaml
        - assert:
            file: 12-assert-ac5.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-sqsconfig.yaml
        - delete:
            file: 10-global-sqscfg-defaults-visibility-l7.yaml
        - delete:
            file: 11-global-kpc-defaults-visibility-l9.yaml

    # AC-6: globalKropathConfig.mandatory.sqs.messageRetentionPeriod=604800 (level 1)
    # propagates.
    - name: ac6-global-kpc-retention-level1
      try:
        - apply:
            file: 13-global-kpc-retention-l1.yaml
        - apply:
            file: 02-sqsconfig.yaml
        - assert:
            file: 14-assert-ac6.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-sqsconfig.yaml
        - delete:
            file: 13-global-kpc-retention-l1.yaml

    # AC-7: globalSQSConfig.mandatory.delaySeconds=60 (level 3) propagates.
    - name: ac7-global-sqscfg-delay-level3
      try:
        - apply:
            file: 15-global-sqscfg-delay-l3.yaml
        - apply:
            file: 02-sqsconfig.yaml
        - assert:
            file: 16-assert-ac7.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-sqsconfig.yaml
        - delete:
            file: 15-global-sqscfg-delay-l3.yaml

    # AC-8: globalSQSConfig.defaults.maximumMessageSize=131072 (level 7) propagates.
    - name: ac8-global-sqscfg-defaults-msgsize-level7
      try:
        - apply:
            file: 17-global-sqscfg-defaults-msgsize-l7.yaml
        - apply:
            file: 02-sqsconfig.yaml
        - assert:
            file: 18-assert-ac8.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-sqsconfig.yaml
        - delete:
            file: 17-global-sqscfg-defaults-msgsize-l7.yaml

    # AC-9: KropathConfig.mandatory.tags and SQSConfig.mandatory.tags are
    # union-merged into effCfg.mandatory.tags.
    - name: ac9-tag-union-merge
      try:
        - apply:
            file: 19-global-kpc-mandatory-tags.yaml
        - apply:
            file: 20-sqsconfig-mandatory-tags.yaml
        - assert:
            file: 21-assert-ac9.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 20-sqsconfig-mandatory-tags.yaml
        - delete:
            file: 19-global-kpc-mandatory-tags.yaml

    # AC-10: globalKropathConfig.mandatory.sqs.kmsMasterKeyId (level 1) propagates.
    - name: ac10-global-kpc-kmskey-level1
      try:
        - apply:
            file: 22-global-kpc-kmskey-l1.yaml
        - apply:
            file: 02-sqsconfig.yaml
        - assert:
            file: 23-assert-ac10.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-sqsconfig.yaml
        - delete:
            file: 22-global-kpc-kmskey-l1.yaml

    # AC-11: globalSQSConfig.defaults.namingTemplate="{namespace}-{name}" (level 7)
    # propagates. KropathConfig.sqs has no namingTemplate field.
    - name: ac11-global-sqscfg-defaults-naming-level7
      try:
        - apply:
            file: 24-global-sqscfg-defaults-naming-l7.yaml
        - apply:
            file: 02-sqsconfig.yaml
        - assert:
            file: 25-assert-ac11.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-sqsconfig.yaml
        - delete:
            file: 24-global-sqscfg-defaults-naming-l7.yaml

    # AC-12: globalSQSConfig.mandatory.syncedLabels={data-class: internal} (level 3)
    # propagates.
    - name: ac12-global-sqscfg-synced-labels
      try:
        - apply:
            file: 26-global-sqscfg-synced-labels.yaml
        - apply:
            file: 02-sqsconfig.yaml
        - assert:
            file: 27-assert-ac12.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-sqsconfig.yaml
        - delete:
            file: 26-global-sqscfg-synced-labels.yaml

    # AC-13: globalKropathConfig.spec.aws.region and accountId propagate
    # to effCfg.aws.region and effCfg.aws.accountId.
    - name: ac13-provider-identity-propagates
      try:
        - apply:
            file: 28-global-kpc-aws-identity.yaml
        - apply:
            file: 02-sqsconfig.yaml
        - assert:
            file: 29-assert-ac13.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-sqsconfig.yaml
        - delete:
            file: 28-global-kpc-aws-identity.yaml
