# AC-2: globalSQSConfig with mandatory.encryptionType="kms" (level 3).
apiVersion: aws.kropath.run/v1alpha1
kind: SQSConfig
metadata:
  name: ac2-general-policy
  namespace: kro-system
spec:
  mandatory:
    encryptionType: "kms"
  defaults: {}
---
# Shared empty local SQSConfig — all cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: SQSConfig
metadata:
  name: ac2-general-policy
  namespace: payments-prod
spec:
  mandatory: {}
  defaults: {}
