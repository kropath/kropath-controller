# AC-4: globalKropathConfig with mandatory.sqs.visibilityTimeout=120 (level 1).
apiVersion: v1
kind: Namespace
metadata:
  name: ac04-sqs-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac04-sqs-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac04-sqs-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac04-sqs-global-ns
spec:
  mandatory:
    sqs:
      visibilityTimeout: 120
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Shared empty local SQSConfig — all cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: SQSConfig
metadata:
  name: ac4-general-policy
  namespace: ac04-sqs-app-ns
spec:
  mandatory: {}
  defaults: {}
