# AC-5: globalKropathConfig with defaults.sqs.visibilityTimeout=60 (level 9).
# Level 7 (globalSQSConfig.defaults) should win over level 9.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: general-policy
  namespace: kro-system
spec:
  defaults:
    sqs:
      visibilityTimeout: 60
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
