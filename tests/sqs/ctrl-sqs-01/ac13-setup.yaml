# AC-13: globalKropathConfig with aws.region and aws.accountId set.
apiVersion: v1
kind: Namespace
metadata:
  name: ac13-sqs-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac13-sqs-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac13-sqs-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "ap-southeast-2"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac13-sqs-global-ns
spec: {}
---
# Shared empty local SQSConfig — all cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: SQSConfig
metadata:
  name: ac13-general-policy
  namespace: ac13-sqs-app-ns
spec:
  mandatory: {}
  defaults: {}
