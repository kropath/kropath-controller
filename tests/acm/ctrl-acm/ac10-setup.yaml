# AC-10: ACMConfig.mandatory.syncedLabels propagates to effCfg.mandatory.syncedLabels.
# syncedLabels come from ACMConfig only (not KropathConfig).
apiVersion: aws.kropath.run/v1alpha1
kind: ACMConfig
metadata:
  name: ac10-acm-policy
  namespace: kro-system
spec:
  mandatory:
    syncedLabels:
      app.kubernetes.io/managed-by: kropath
---
apiVersion: aws.kropath.run/v1alpha1
kind: ACMConfig
metadata:
  name: ac10-acm-policy
  namespace: payments-prod
spec: {}
