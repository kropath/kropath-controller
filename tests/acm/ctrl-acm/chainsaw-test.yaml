# ctrl-acm Chainsaw integration tests — AC-8, AC-9, AC-10.
#
# Test isolation — unique-name-per-step, no inter-step deletes:
#   Each AC owns a distinct resource name (acN-acm-policy). The controller
#   resolves a config's global counterpart by *name* — a local ACMConfig
#   payments-prod/acN-acm-policy merges only kro-system/acN-acm-policy — so a
#   per-AC name isolates each AC completely.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-acm
spec:
  description: "ACM effectiveConfig cascade — AC-8, AC-9, AC-10 (ctrl-acm)"
  steps:
    # AC-8: KropathConfig.mandatory.certificateManager.keyAlgorithm (level 1) → effCfg.mandatory.keyAlgorithm
    - name: ac8-global-kpc-mandatory-key-algorithm
      try:
        - apply:
            file: ac08-setup.yaml
        - assert:
            file: ac08-assert.yaml
            timeout: 30s

    # AC-9: ACMConfig.mandatory.tags + KropathConfig.mandatory.tags → effCfg.mandatory.tags (union)
    - name: ac9-tag-union-mandatory
      try:
        - apply:
            file: ac09-setup.yaml
        - assert:
            file: ac09-assert.yaml
            timeout: 30s

    # AC-10: ACMConfig.mandatory.syncedLabels → effCfg.mandatory.syncedLabels
    - name: ac10-synced-labels-mandatory
      try:
        - apply:
            file: ac10-setup.yaml
        - assert:
            file: ac10-assert.yaml
            timeout: 30s
