# AC-9: ACMConfig.mandatory.tags + KropathConfig.mandatory.tags → effCfg.mandatory.tags (additive union).
# KropathConfig.mandatory.tags contributes tier-level tags (not under certificateManager).
# ACMConfig.mandatory.tags contributes family-level tags.
# Both sets must appear in effCfg.mandatory.tags; on key conflict, L1 (KropathConfig) wins.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac9-acm-policy
  namespace: kro-system
spec:
  mandatory:
    tags:
      org: acme
      env: prod
---
apiVersion: aws.kropath.run/v1alpha1
kind: ACMConfig
metadata:
  name: ac9-acm-policy
  namespace: kro-system
spec:
  mandatory:
    tags:
      team: security
---
apiVersion: aws.kropath.run/v1alpha1
kind: ACMConfig
metadata:
  name: ac9-acm-policy
  namespace: payments-prod
spec: {}
