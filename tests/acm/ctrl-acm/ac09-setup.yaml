apiVersion: v1
kind: Namespace
metadata:
  name: ac09-acm-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac09-acm-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac09-acm-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
