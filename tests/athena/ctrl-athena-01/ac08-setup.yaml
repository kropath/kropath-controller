# AC-8: syncedLabels additive union from AthenaConfig levels only (levels 3 and 4).
# On key conflicts the global AthenaConfig (level 3) wins over local (level 4) because
# mergeMaps processes local first and global second — the second write wins.
apiVersion: aws.kropath.run/v1alpha1
kind: AthenaConfig
metadata:
  name: ac8-athena-policy
  namespace: kro-system
spec:
  mandatory:
    syncedLabels:
      owner: "platform-team"
      tier: "global"
---
apiVersion: aws.kropath.run/v1alpha1
kind: AthenaConfig
metadata:
  name: ac8-athena-policy
  namespace: data-platform
spec:
  mandatory:
    syncedLabels:
      app: "analytics"
      tier: "local"
