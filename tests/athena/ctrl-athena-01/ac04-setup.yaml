# AC-4: localAthenaConfig.mandatory string fields (level 4) — resultEncryptionOption and
# engineVersion — propagate to effCfg.mandatory when no global AthenaConfig is present.
apiVersion: aws.kropath.run/v1alpha1
kind: AthenaConfig
metadata:
  name: ac4-athena-policy
  namespace: data-platform
spec:
  mandatory:
    resultEncryptionOption: "SSE_S3"
    engineVersion: "Athena engine version 3"
