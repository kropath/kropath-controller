# AC-1: globalKropathConfig.mandatory.athena.enforceWorkGroupConfiguration (level 1)
# flows to effCfg.mandatory.enforceWorkGroupConfiguration.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac1-athena-policy
  namespace: kro-system
spec:
  mandatory:
    athena:
      enforceWorkGroupConfiguration: true
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: AthenaConfig
metadata:
  name: ac1-athena-policy
  namespace: data-platform
spec: {}
