# AC-7: namingTemplate is governed only at AthenaConfig levels (3 and 4) —
# KropathConfig.spec.mandatory.athena has no namingTemplate field, so the value
# from localAthenaConfig.mandatory (level 4) propagates unchanged.
apiVersion: aws.kropath.run/v1alpha1
kind: AthenaConfig
metadata:
  name: ac7-athena-policy
  namespace: data-platform
spec:
  mandatory:
    namingTemplate: "athena-wg-{{.Name}}"
