# Assert AC-9: controller reconciles with no governance sources present.
# The Reconciled condition is set to True — no panic, no error.
apiVersion: aws.kropath.run/v1alpha1
kind: AthenaConfig
metadata:
  name: ac9-athena-policy
  namespace: data-platform
status:
  conditions:
    - type: "Reconciled"
      status: "True"
