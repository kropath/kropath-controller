# AC-3: globalAthenaConfig.mandatory.bytesScannedCutoffPerQuery (level 3, integer) —
# zero is the "not set" sentinel; a non-zero value at level 3 must propagate to effCfg.mandatory
# when the local AthenaConfig carries the zero value.
apiVersion: aws.kropath.run/v1alpha1
kind: AthenaConfig
metadata:
  name: ac3-athena-policy
  namespace: kro-system
spec:
  mandatory:
    bytesScannedCutoffPerQuery: 10737418240
---
apiVersion: aws.kropath.run/v1alpha1
kind: AthenaConfig
metadata:
  name: ac3-athena-policy
  namespace: data-platform
spec:
  mandatory:
    bytesScannedCutoffPerQuery: 0
