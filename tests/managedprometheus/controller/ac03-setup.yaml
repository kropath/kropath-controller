apiVersion: v1
kind: Namespace
metadata:
  name: ac03-managedprometheus-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac03-managedprometheus-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac03-managedprometheus-global-ns
---
# AC-3: KropathConfig.mandatory.tags and MPConfig.mandatory.tags union-merged.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac03-managedprometheus-global-ns
spec:
  mandatory:
    tags:
      cost-centre: "infra"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: ManagedPrometheusConfig
metadata:
  name: ac03-amp-policy
  namespace: ac03-managedprometheus-app-ns
  labels:
    aws.kropath.run/resource-name: ac03-amp-policy
spec:
  mandatory:
    tags:
      env: "prod"
  defaults: {}
