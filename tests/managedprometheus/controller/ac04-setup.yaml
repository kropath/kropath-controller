apiVersion: v1
kind: Namespace
metadata:
  name: ac04-managedprometheus-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac04-managedprometheus-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac04-managedprometheus-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
# AC-4: no tier sets namingTemplate — defaults.namingTemplate falls back to "{namespace}-{name}".
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac04-managedprometheus-global-ns
spec: {}
---
apiVersion: aws.kropath.run/v1alpha1
kind: ManagedPrometheusConfig
metadata:
  name: ac04-amp-policy
  namespace: ac04-managedprometheus-app-ns
  labels:
    aws.kropath.run/resource-name: ac04-amp-policy
spec:
  mandatory: {}
  defaults: {}
