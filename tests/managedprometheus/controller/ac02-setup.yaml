apiVersion: v1
kind: Namespace
metadata:
  name: ac02-managedprometheus-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac02-managedprometheus-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac02-managedprometheus-global-ns
---
# AC-2: localMPConfig.defaults.logGroupARN (level 6) propagates; mandatory stays empty.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac02-managedprometheus-global-ns
spec:
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: ManagedPrometheusConfig
metadata:
  name: ac02-amp-policy
  namespace: ac02-managedprometheus-app-ns
  labels:
    aws.kropath.run/resource-name: ac02-amp-policy
spec:
  mandatory: {}
  defaults:
    logGroupARN: "arn:aws:logs:us-east-1:123:log-group/amp"
