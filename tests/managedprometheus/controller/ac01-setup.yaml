apiVersion: v1
kind: Namespace
metadata:
  name: ac01-managedprometheus-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-managedprometheus-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac01-managedprometheus-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
# AC-1: globalKropathConfig with mandatory.managedprometheus.alias (level 1).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac01-managedprometheus-global-ns
spec:
  mandatory:
    managedprometheus:
      alias: "prod-amp"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
# Empty local ManagedPrometheusConfig for ac01 — cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: ManagedPrometheusConfig
metadata:
  name: ac01-amp-policy
  namespace: ac01-managedprometheus-app-ns
  labels:
    aws.kropath.run/resource-name: ac01-amp-policy
spec:
  mandatory: {}
  defaults: {}
