# ctrl-amp-01 Chainsaw integration tests — 5 acceptance criteria.
# Requires:
#   - kind cluster with kropath-operator deployed
#   - KropathConfig CRD applied (from kropath-aws)
#   - ManagedPrometheusConfig CRD applied (from kropath-aws)
#
# Each AC step uses a unique resource name (acN-amp-policy) so that Chainsaw's
# deferred LIFO cleanup from prior steps cannot pollute later steps.
#
# Test isolation: each step owns a distinct set of resource names (ac<N>-*).
# The controller pairs a namespaced config with its kro-system counterpart by
# *name*, so a per-step name isolates each step completely — no step can shadow
# another, in either direction, regardless of order.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-amp-01-cascade
spec:
  namespace: monitoring-prod
  steps:
    # AC-1: globalKropathConfig.mandatory.managedprometheus.alias (level 1) propagates.
    - name: ac1-global-kpc-alias-level1
      try:
        - apply:
            file: ac01-setup.yaml
        - assert:
            file: ac01-assert.yaml
            timeout: 30s

    # AC-2: localMPConfig.defaults.logGroupARN (level 6) propagates; mandatory stays empty.
    - name: ac2-local-mpcfg-defaults-loggrouparn-level6
      try:
        - apply:
            file: ac02-setup.yaml
        - assert:
            file: ac02-assert.yaml
            timeout: 30s

    # AC-3: KropathConfig.mandatory.tags and MPConfig.mandatory.tags are union-merged.
    - name: ac3-tag-union-merge
      try:
        - apply:
            file: ac03-setup.yaml
        - assert:
            file: ac03-assert.yaml
            timeout: 30s

    # AC-4: when no tier sets namingTemplate, defaults.namingTemplate falls back to "{namespace}-{name}".
    - name: ac4-defaults-naming-fallback
      try:
        - apply:
            file: ac04-setup.yaml
        - assert:
            file: ac04-assert.yaml
            timeout: 30s

    # AC-5: KropathConfig.spec.aws.region and accountId propagate to effCfg.aws.
    - name: ac5-provider-identity-propagates
      try:
        - apply:
            file: ac05-setup.yaml
        - assert:
            file: ac05-assert.yaml
            timeout: 30s
