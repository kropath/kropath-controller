apiVersion: v1
kind: Namespace
metadata:
  name: ac05-managedprometheus-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac05-managedprometheus-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac05-managedprometheus-global-ns
---
# AC-5: KropathConfig.spec.aws.region and accountId propagate to effectiveConfig.aws.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac05-managedprometheus-global-ns
spec:
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: ManagedPrometheusConfig
metadata:
  name: ac05-amp-policy
  namespace: ac05-managedprometheus-app-ns
  labels:
    aws.kropath.run/resource-name: ac05-amp-policy
spec:
  mandatory: {}
  defaults: {}
