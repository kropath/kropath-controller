# AC-8: globalKropathConfig with mandatory.ecs.containerInsights=true (level 1).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: general-policy-ac8
  namespace: kro-system
spec:
  mandatory:
    ecs:
      containerInsights: true
  aws:
    accountId: "123456789012"
    region: "us-east-1"
