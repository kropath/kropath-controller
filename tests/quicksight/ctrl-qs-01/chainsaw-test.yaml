# ctrl-qs-01 Chainsaw integration tests — all 8 acceptance criteria.
#
# Test isolation — unique-name-per-step, no inter-step deletes:
#   Each AC owns a distinct resource name (acN-qs-policy). The controller
#   resolves a config's global counterpart by *name* — a local QuickSightConfig
#   payments-prod/acN-qs-policy merges only kro-system/acN-qs-policy — so a
#   per-AC name isolates each AC completely. See docs/frequent-chainsaw-errors.md.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-qs-01
spec:
  description: "QuickSight effectiveConfig cascade — all 8 acceptance criteria (ctrl-qs-01)"
  steps:
    # AC-1: KropathConfig.mandatory.quicksight.importMode (level 1) → effCfg.mandatory.importMode
    - name: ac1-kpc-mandatory-import-mode
      try:
        - apply:
            file: ac01-setup.yaml
        - assert:
            file: ac01-assert.yaml
            timeout: 30s

    # AC-2: global QuickSightConfig.mandatory.importMode (level 3) → effCfg.mandatory.importMode
    - name: ac2-global-qscfg-mandatory-import-mode
      try:
        - apply:
            file: ac02-setup.yaml
        - assert:
            file: ac02-assert.yaml
            timeout: 30s

    # AC-3: QuickSightConfig local defaults.importMode (level 6) → effCfg.defaults.importMode
    - name: ac3-local-qscfg-defaults-import-mode
      try:
        - apply:
            file: ac03-setup.yaml
        - assert:
            file: ac03-assert.yaml
            timeout: 30s

    # AC-4: global QuickSightConfig.mandatory.namingTemplate (level 3) → effCfg.mandatory.namingTemplate
    - name: ac4-global-qscfg-mandatory-naming-template
      try:
        - apply:
            file: ac04-setup.yaml
        - assert:
            file: ac04-assert.yaml
            timeout: 30s

    # AC-5: global QuickSightConfig.defaults.namingTemplate (level 7) → effCfg.defaults.namingTemplate
    - name: ac5-global-qscfg-defaults-naming-template
      try:
        - apply:
            file: ac05-setup.yaml
        - assert:
            file: ac05-assert.yaml
            timeout: 30s

    # AC-6: KropathConfig.mandatory.tags + QuickSightConfig.mandatory.tags union-merge
    - name: ac6-mandatory-tag-union-merge
      try:
        - apply:
            file: ac06-setup.yaml
        - assert:
            file: ac06-assert.yaml
            timeout: 30s

    # AC-7: QuickSightConfig.mandatory.syncedLabels → effCfg.mandatory.syncedLabels
    - name: ac7-mandatory-synced-labels
      try:
        - apply:
            file: ac07-setup.yaml
        - assert:
            file: ac07-assert.yaml
            timeout: 30s

    # AC-8: KropathConfig.spec.aws identity → effCfg.aws
    - name: ac8-provider-identity-propagates
      try:
        - apply:
            file: ac08-setup.yaml
        - assert:
            file: ac08-assert.yaml
            timeout: 30s
