#
# AC-2: global QuickSightConfig.mandatory.importMode (level 3) flows to
#        effCfg.mandatory.importMode when KropathConfig levels 1-2 are empty.
apiVersion: v1
kind: Namespace
metadata:
  name: ac02-quicksight-global-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac02-quicksight-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac02-quicksight-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac02-quicksight-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac02-quicksight-global-ns
spec: {}
---
apiVersion: aws.kropath.run/v1alpha1
kind: QuickSightConfig
metadata:
  name: ac2-qs-policy
  namespace: ac02-quicksight-global-ns
spec:
  mandatory:
    importMode: "DIRECT_QUERY"
---
apiVersion: aws.kropath.run/v1alpha1
kind: QuickSightConfig
metadata:
  name: ac2-qs-policy
  namespace: ac02-quicksight-app-ns
spec: {}
