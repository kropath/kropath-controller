#
# AC-9: local KropathConfig.mandatory.quicksight.importMode (level 2) flows to
#        effCfg.mandatory.importMode and wins over the global QuickSightConfig
#        mandatory tier (level 3).
#
# Namespace note: level 2 is looked up by the fixed name `default` in the resource
# namespace, so it is NOT isolated by the per-AC name used by every other step.
# This AC therefore runs in `data-platform` (no other suite creates a KropathConfig
# named `default` there) instead of `payments-prod`, which ctrl-s3-01 AC-11 already
# uses for its own level-2 `default` KropathConfig.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac9-qs-policy
  namespace: kro-system
spec:
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
# Level 2 — KropathConfig named `default` in the resource namespace.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: default
  namespace: data-platform
spec:
  mandatory:
    quicksight:
      importMode: "DIRECT_QUERY"
---
# Level 3 — global QuickSightConfig mandatory tier; level 2 outranks it.
apiVersion: aws.kropath.run/v1alpha1
kind: QuickSightConfig
metadata:
  name: ac9-qs-policy
  namespace: kro-system
spec:
  mandatory:
    importMode: "SPICE"
---
apiVersion: aws.kropath.run/v1alpha1
kind: QuickSightConfig
metadata:
  name: ac9-qs-policy
  namespace: data-platform
spec: {}
