#
# AC-9: local KropathConfig.mandatory.quicksight.importMode (level 2) flows to
#        effCfg.mandatory.importMode and wins over the global QuickSightConfig
#        mandatory tier (level 3).
#
# Namespace note: level 2 is looked up by the fixed name `baseline` in the resource
# namespace (singleton rule, KRO-1137) -- isolation now comes from this AC's
# dedicated ac09-quicksight-app-ns rather than from sharing `data-platform` with
# other suites.
apiVersion: v1
kind: Namespace
metadata:
  name: ac09-quicksight-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac09-quicksight-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac09-quicksight-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac09-quicksight-global-ns
spec:
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
# Level 2 — KropathConfig named `baseline` in the resource namespace.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac09-quicksight-app-ns
spec:
  mandatory:
    quicksight:
      importMode: "DIRECT_QUERY"
---
# Level 3 — global QuickSightConfig mandatory tier; level 2 outranks it.
apiVersion: aws.kropath.run/v1alpha1
kind: QuickSightConfig
metadata:
  name: ac9-qs-policy
  namespace: ac09-quicksight-global-ns
spec:
  mandatory:
    importMode: "SPICE"
---
apiVersion: aws.kropath.run/v1alpha1
kind: QuickSightConfig
metadata:
  name: ac9-qs-policy
  namespace: ac09-quicksight-app-ns
spec: {}
