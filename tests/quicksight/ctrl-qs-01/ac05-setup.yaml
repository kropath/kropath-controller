#
# AC-5: global QuickSightConfig.defaults.namingTemplate (level 7) flows to
#        effCfg.defaults.namingTemplate when no local defaults override is set.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac5-qs-policy
  namespace: kro-system
spec:
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: QuickSightConfig
metadata:
  name: ac5-qs-policy
  namespace: kro-system
spec:
  defaults:
    namingTemplate: "{namespace}-{name}"
---
apiVersion: aws.kropath.run/v1alpha1
kind: QuickSightConfig
metadata:
  name: ac5-qs-policy
  namespace: payments-prod
spec: {}
