# AC-1: KropathConfig/baseline in ac1-global-ns, designated as ac1-app-ns's
# global-config-namespace. An S3Config living in ac1-app-ns makes the
# KropathConfig resolve as the global tier.
apiVersion: v1
kind: Namespace
metadata:
  name: ac1-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac1-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac1-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac1-global-ns
spec:
  mandatory: {}
  defaults: {}
---
apiVersion: aws.kropath.run/v1alpha1
kind: S3Config
metadata:
  name: general-policy
  namespace: ac1-app-ns
spec:
  mandatory: {}
  defaults: {}
