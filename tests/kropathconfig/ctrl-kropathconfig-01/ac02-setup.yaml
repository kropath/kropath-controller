# AC-2: KropathConfig/baseline sharing a namespace with an IAMConfig. ac2-app-ns
# carries no global-config-namespace annotation of its own (it is RoleGovernanceOnly
# for placement purposes -- spec AC-12, no default fallback) and no other namespace's
# annotation points at it, so this is a local-tier-only match. The IAMConfig here
# is never asserted for effectiveConfig, so its governance-only exemption is fine.
apiVersion: v1
kind: Namespace
metadata:
  name: ac2-app-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac2-app-ns
spec:
  mandatory: {}
  defaults: {}
---
apiVersion: aws.kropath.run/v1alpha1
kind: IAMConfig
metadata:
  name: general-policy
  namespace: ac2-app-ns
spec:
  mandatory: {}
  defaults: {}
