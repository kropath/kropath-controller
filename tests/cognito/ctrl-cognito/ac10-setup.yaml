# AC-10 setup: KropathConfig.mandatory.tags and CognitoConfig.mandatory.tags must
# union-merge, with the KropathConfig tag winning on key conflict.
# Spec AC-10: Tag union merge across KropathConfig.mandatory.tags and CognitoConfig.mandatory.tags.
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac10-cognito-policy
  namespace: kro-system
spec:
  mandatory:
    tags:
      env: "production"
      team: "platform"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: CognitoConfig
metadata:
  name: ac10-cognito-policy
  namespace: payments-prod
spec:
  mandatory:
    tags:
      env: "staging"
      service: "cognito"
