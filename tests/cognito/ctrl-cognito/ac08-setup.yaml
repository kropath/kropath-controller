apiVersion: v1
kind: Namespace
metadata:
  name: ac08-cognito-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac08-cognito-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac08-cognito-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac08-cognito-global-ns
spec:
  mandatory:
    cognito:
      passwordPolicy:
        minimumLength: 14
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: CognitoConfig
metadata:
  name: ac8-cognito-policy
  namespace: ac08-cognito-app-ns
spec:
  mandatory:
    passwordPolicy:
      minimumLength: 12
