# AC-8 setup: KropathConfig.mandatory.cognito.passwordPolicy.minimumLength=14 (level 1)
# must win over CognitoConfig.mandatory.passwordPolicy.minimumLength=12 (level 4).
# Spec AC-8: global KropathConfig.mandatory.cognito.passwordPolicy.minimumLength=14
# wins over CognitoConfig.mandatory.passwordPolicy.minimumLength=12.
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac8-cognito-policy
  namespace: kro-system
spec:
  mandatory:
    cognito:
      passwordPolicy:
        minimumLength: 14
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: CognitoConfig
metadata:
  name: ac8-cognito-policy
  namespace: payments-prod
spec:
  mandatory:
    passwordPolicy:
      minimumLength: 12
