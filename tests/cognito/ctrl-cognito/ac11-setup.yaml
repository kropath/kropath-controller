apiVersion: v1
kind: Namespace
metadata:
  name: ac11-cognito-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac11-cognito-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac11-cognito-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac11-cognito-global-ns
spec:
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: CognitoConfig
metadata:
  name: ac11-cognito-policy
  namespace: ac11-cognito-app-ns
spec:
  mandatory:
    syncedLabels:
      app: "cognito"
