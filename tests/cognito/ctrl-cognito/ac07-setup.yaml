apiVersion: v1
kind: Namespace
metadata:
  name: ac07-cognito-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac07-cognito-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac07-cognito-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac07-cognito-global-ns
spec:
  mandatory:
    cognito:
      mfaConfiguration: "ON"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: CognitoConfig
metadata:
  name: ac7-cognito-policy
  namespace: ac07-cognito-app-ns
spec: {}
