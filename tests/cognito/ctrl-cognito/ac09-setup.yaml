apiVersion: v1
kind: Namespace
metadata:
  name: ac09-cognito-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac09-cognito-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac09-cognito-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac09-cognito-global-ns
spec:
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: CognitoConfig
metadata:
  name: ac9-cognito-policy
  namespace: ac09-cognito-app-ns
spec:
  defaults:
    namingTemplate: "{namespace}-{name}"
