---
# ctrl-sm-01: SageMakerConfig effectiveConfig cascade scenarios.
#
# One step per acceptance criterion. Each AC gets its own resource name
# (ac<N>-sagemaker-policy) so steps are isolated — no teardown needed
# between steps. The controller pairs a namespaced SageMakerConfig with
# its kro-system counterpart by name.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-sm-01
spec:
  timeouts:
    apply: 10s
    assert: 30s
    delete: 10s
  steps:
    # AC-T02-1: KropathConfig.mandatory.sagemaker.instanceType (L1) wins over
    # SageMakerConfig.mandatory.instanceType (L3) in effectiveConfig.mandatory.
    - name: ac01-kpc-mandatory-instance-type-wins
      try:
        - apply:
            file: ac01-setup.yaml
        - assert:
            file: ac01-assert.yaml

    # AC-T02-2: SageMakerConfig.mandatory.instanceType (L3) overrides
    # SageMakerConfig.defaults.instanceType (L7) in effectiveConfig.
    - name: ac02-mandatory-overrides-defaults-instance-type
      try:
        - apply:
            file: ac02-setup.yaml
        - assert:
            file: ac02-assert.yaml

    # AC-T02-3: mandatory.volumeSizeInGB (L3) flows to effectiveConfig.mandatory.
    - name: ac03-volume-size-mandatory
      try:
        - apply:
            file: ac03-setup.yaml
        - assert:
            file: ac03-assert.yaml

    # AC-T02-4: kmsKeyId from KropathConfig.mandatory (L1) flows to
    # effectiveConfig.mandatory.kmsKeyId.
    - name: ac04-kms-key-id-kpc-mandatory
      try:
        - apply:
            file: ac04-setup.yaml
        - assert:
            file: ac04-assert.yaml

    # AC-T02-5: enableNetworkIsolation from KropathConfig.mandatory (L1)
    # flows to effectiveConfig.mandatory.
    - name: ac05-network-isolation-kpc-mandatory
      try:
        - apply:
            file: ac05-setup.yaml
        - assert:
            file: ac05-assert.yaml

    # AC-T02-6: rootAccess from SageMakerConfig.defaults (L7)
    # flows to effectiveConfig.defaults.
    - name: ac06-root-access-defaults
      try:
        - apply:
            file: ac06-setup.yaml
        - assert:
            file: ac06-assert.yaml

    # AC-T02-7: directInternetAccess from SageMakerConfig.mandatory (L3)
    # flows to effectiveConfig.mandatory.
    - name: ac07-direct-internet-access-mandatory
      try:
        - apply:
            file: ac07-setup.yaml
        - assert:
            file: ac07-assert.yaml

    # AC-T02-8: namingTemplate from SageMakerConfig.defaults (L7)
    # flows to effectiveConfig.defaults.
    - name: ac08-naming-template-defaults
      try:
        - apply:
            file: ac08-setup.yaml
        - assert:
            file: ac08-assert.yaml

    # AC-T02-9: tag union merge — KropathConfig.mandatory.tags and
    # SageMakerConfig.mandatory.tags combine in effectiveConfig.mandatory.tags.
    - name: ac09-tag-union-merge
      try:
        - apply:
            file: ac09-setup.yaml
        - assert:
            file: ac09-assert.yaml

    # AC-T02-10: syncedLabels from SageMakerConfig.mandatory union merge.
    - name: ac10-synced-labels-union
      try:
        - apply:
            file: ac10-setup.yaml
        - assert:
            file: ac10-assert.yaml

    # AC-T02-11: Provider identity (accountId, region) from KropathConfig
    # flows to effectiveConfig.aws.
    - name: ac11-provider-identity
      try:
        - apply:
            file: ac11-setup.yaml
        - assert:
            file: ac11-assert.yaml
