# AC-T02-5: KropathConfig.mandatory.sagemaker.enableNetworkIsolation (L1) flows to
# effectiveConfig.mandatory.enableNetworkIsolation.
apiVersion: v1
kind: Namespace
metadata:
  name: ac05-sagemaker-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac05-sagemaker-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac05-sagemaker-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac05-sagemaker-global-ns
spec:
  mandatory:
    sagemaker:
      enableNetworkIsolation: true
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: SageMakerConfig
metadata:
  name: ac05-sm-policy
  namespace: ac05-sagemaker-app-ns
spec: {}
