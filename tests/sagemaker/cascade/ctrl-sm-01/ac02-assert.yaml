# Assert AC-T02-2: mandatory.instanceType wins over defaults.instanceType.
apiVersion: aws.kropath.run/v1alpha1
kind: SageMakerConfig
metadata:
  name: ac02-sm-policy
  namespace: payments-prod
status:
  effectiveConfig:
    mandatory:
      instanceType: "ml.m5.xlarge"
    defaults:
      instanceType: "ml.t3.medium"
