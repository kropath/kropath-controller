# AC-T02-1: KropathConfig.mandatory.sagemaker.instanceType (L1) flows to
# effectiveConfig.mandatory.instanceType, overriding SageMakerConfig.mandatory.
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-sagemaker-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-sagemaker-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac01-sagemaker-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac01-sagemaker-global-ns
spec:
  mandatory:
    sagemaker:
      instanceType: "ml.m5.xlarge"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: SageMakerConfig
metadata:
  name: ac01-sm-policy
  namespace: ac01-sagemaker-app-ns
spec:
  mandatory:
    instanceType: "ml.t3.medium"
