# AC-T02-2: SageMakerConfig.mandatory.instanceType (L3, global) overrides
# SageMakerConfig.defaults.instanceType (L6, local) in effectiveConfig.
# instanceType cannot be set in both spec.mandatory and spec.defaults on the
# same SageMakerConfig object (CRD mutual-exclusion CEL rule), so the two
# tiers under test must live on separate objects: global carries mandatory,
# local carries defaults.
apiVersion: aws.kropath.run/v1alpha1
kind: SageMakerConfig
metadata:
  name: ac02-sm-policy
  namespace: kro-system
spec:
  mandatory:
    instanceType: "ml.m5.xlarge"
---
apiVersion: aws.kropath.run/v1alpha1
kind: SageMakerConfig
metadata:
  name: ac02-sm-policy
  namespace: payments-prod
spec:
  defaults:
    instanceType: "ml.t3.medium"
