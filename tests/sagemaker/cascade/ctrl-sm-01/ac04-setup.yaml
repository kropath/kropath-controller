# AC-T02-4: KropathConfig.mandatory.sagemaker.kmsKeyId (L1) flows to
# effectiveConfig.mandatory.kmsKeyId.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac04-sm-policy
  namespace: kro-system
spec:
  mandatory:
    sagemaker:
      kmsKeyId: "arn:aws:kms:us-east-1:123456789012:key/kpc-key"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: SageMakerConfig
metadata:
  name: ac04-sm-policy
  namespace: payments-prod
spec: {}
