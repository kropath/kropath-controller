# AC-T02-4: KropathConfig.mandatory.sagemaker.kmsKeyId (L1) flows to
# effectiveConfig.mandatory.kmsKeyId.
apiVersion: v1
kind: Namespace
metadata:
  name: ac04-sagemaker-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac04-sagemaker-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac04-sagemaker-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac04-sagemaker-global-ns
spec:
  mandatory:
    sagemaker:
      kmsKeyId: "arn:aws:kms:us-east-1:123456789012:key/kpc-key"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: SageMakerConfig
metadata:
  name: ac04-sm-policy
  namespace: ac04-sagemaker-app-ns
spec: {}
