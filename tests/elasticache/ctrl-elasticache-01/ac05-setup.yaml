# AC-5: globalKropathConfig with defaults.elasticache.transitEncryptionEnabled=false (level 9).
# Level 7 (ECConfig defaults) must win over this level 9 value.
apiVersion: v1
kind: Namespace
metadata:
  name: ac05-elasticache-global-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac05-elasticache-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac05-elasticache-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac05-elasticache-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac05-elasticache-global-ns
spec:
  defaults:
    elasticache:
      transitEncryptionEnabled: false
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# AC-5: globalElastiCacheConfig with defaults.transitEncryptionEnabled=true (level 7).
apiVersion: aws.kropath.run/v1alpha1
kind: ElastiCacheConfig
metadata:
  name: ac5-general-policy
  namespace: ac05-elasticache-global-ns
spec:
  mandatory: {}
  defaults:
    transitEncryptionEnabled: true
---
# Shared empty local ElastiCacheConfig — all cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: ElastiCacheConfig
metadata:
  name: ac5-general-policy
  namespace: ac05-elasticache-app-ns
spec:
  mandatory: {}
  defaults: {}
