# ctrl-elasticache-01 Chainsaw integration tests — all 13 acceptance criteria.
# Requires:
#   - kind cluster with kropath-operator deployed (feature flag: --enable-elasticache-cascade)
#   - KropathConfig CRD applied (crds/kropathconfig.yaml from kropath-aws)
#   - ElastiCacheConfig CRD applied (crds/elasticacheconfig.yaml from kropath-aws, KRO-411)
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-elasticache-01-cascade
spec:
  steps:
    # AC-1: globalKropathConfig.mandatory.elasticache.atRestEncryptionEnabled=true (level 1)
    # wins over globalElastiCacheConfig.mandatory.atRestEncryptionEnabled=false.
    - name: ac1-global-kpc-atrest-level1
      try:
        - apply:
            file: 01-global-kpc-atrest-l1.yaml
        - apply:
            file: 02-elasticacheconfig.yaml
        - assert:
            file: 03-assert-ac1.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-elasticacheconfig.yaml
        - delete:
            file: 01-global-kpc-atrest-l1.yaml

    # AC-2: globalElastiCacheConfig.mandatory.atRestEncryptionEnabled=true (level 3) wins
    # when levels 1-2 are false.
    - name: ac2-global-eccfg-atrest-level3
      try:
        - apply:
            file: 04-global-eccfg-atrest-l3.yaml
        - apply:
            file: 02-elasticacheconfig.yaml
        - assert:
            file: 05-assert-ac2.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-elasticacheconfig.yaml
        - delete:
            file: 04-global-eccfg-atrest-l3.yaml

    # AC-3: All mandatory tiers false; local ElastiCacheConfig.defaults.atRestEncryptionEnabled=true
    # (level 6) propagates; mandatory stays false.
    - name: ac3-local-eccfg-defaults-atrest-level6
      try:
        - apply:
            file: 06-local-eccfg-defaults-atrest.yaml
        - assert:
            file: 07-assert-ac3.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 06-local-eccfg-defaults-atrest.yaml

    # AC-4: globalKropathConfig.mandatory.elasticache.transitEncryptionEnabled=true (level 1)
    # propagates.
    - name: ac4-global-kpc-transit-level1
      try:
        - apply:
            file: 08-global-kpc-transit-l1.yaml
        - apply:
            file: 02-elasticacheconfig.yaml
        - assert:
            file: 09-assert-ac4.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-elasticacheconfig.yaml
        - delete:
            file: 08-global-kpc-transit-l1.yaml

    # AC-5: globalElastiCacheConfig.defaults.transitEncryptionEnabled=true (level 7) wins over
    # globalKropathConfig.defaults.elasticache.transitEncryptionEnabled=false (level 9).
    # Delete any stale kro-system KropathConfig from AC-4 before applying the defaults-only one.
    - name: ac5-global-eccfg-defaults-transit-wins-over-kpc-defaults
      try:
        - delete:
            ref:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KropathConfig
              name: general-policy
              namespace: kro-system
        - apply:
            file: 11-global-kpc-defaults-transit-l9.yaml
        - apply:
            file: 10-global-eccfg-defaults-transit-l7.yaml
        - apply:
            file: 02-elasticacheconfig.yaml
        - assert:
            file: 12-assert-ac5.yaml
            timeout: 30s
        - delete:
            ref:
              apiVersion: aws.kropath.run/v1alpha1
              kind: KropathConfig
              name: general-policy
              namespace: kro-system
      cleanup:
        - delete:
            file: 02-elasticacheconfig.yaml
        - delete:
            file: 10-global-eccfg-defaults-transit-l7.yaml
        - delete:
            file: 11-global-kpc-defaults-transit-l9.yaml

    # AC-6: globalElastiCacheConfig.mandatory.automaticFailoverEnabled=true (level 3;
    # no KropathConfig.elasticache equivalent).
    - name: ac6-global-eccfg-autofailover-level3
      try:
        - apply:
            file: 13-global-eccfg-mandatory-autofailover-l3.yaml
        - apply:
            file: 02-elasticacheconfig.yaml
        - assert:
            file: 14-assert-ac6.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-elasticacheconfig.yaml
        - delete:
            file: 13-global-eccfg-mandatory-autofailover-l3.yaml

    # AC-7: globalElastiCacheConfig.mandatory.multiAZEnabled=true (level 3).
    - name: ac7-global-eccfg-multiaz-level3
      try:
        - apply:
            file: 15-global-eccfg-mandatory-multiaz-l3.yaml
        - apply:
            file: 02-elasticacheconfig.yaml
        - assert:
            file: 16-assert-ac7.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-elasticacheconfig.yaml
        - delete:
            file: 15-global-eccfg-mandatory-multiaz-l3.yaml

    # AC-8: globalElastiCacheConfig.mandatory.snapshotRetentionLimit=7 (level 3).
    - name: ac8-global-eccfg-snapshot-retention-level3
      try:
        - apply:
            file: 17-global-eccfg-mandatory-snapshot-l3.yaml
        - apply:
            file: 02-elasticacheconfig.yaml
        - assert:
            file: 18-assert-ac8.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-elasticacheconfig.yaml
        - delete:
            file: 17-global-eccfg-mandatory-snapshot-l3.yaml

    # AC-9: globalElastiCacheConfig.mandatory.engine="redis" (level 3).
    - name: ac9-global-eccfg-engine-level3
      try:
        - apply:
            file: 19-global-eccfg-mandatory-engine-l3.yaml
        - apply:
            file: 02-elasticacheconfig.yaml
        - assert:
            file: 20-assert-ac9.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-elasticacheconfig.yaml
        - delete:
            file: 19-global-eccfg-mandatory-engine-l3.yaml

    # AC-10: globalElastiCacheConfig.mandatory.blockNoPasswordUsers=true (level 3).
    - name: ac10-global-eccfg-blockpwd-level3
      try:
        - apply:
            file: 21-global-eccfg-mandatory-blockpwd-l3.yaml
        - apply:
            file: 02-elasticacheconfig.yaml
        - assert:
            file: 22-assert-ac10.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-elasticacheconfig.yaml
        - delete:
            file: 21-global-eccfg-mandatory-blockpwd-l3.yaml

    # AC-11: globalElastiCacheConfig.defaults.namingTemplate="{namespace}-{name}" (level 7;
    # no KropathConfig.elasticache.namingTemplate field exists).
    - name: ac11-global-eccfg-defaults-naming-level7
      try:
        - apply:
            file: 23-global-eccfg-defaults-naming-l7.yaml
        - apply:
            file: 02-elasticacheconfig.yaml
        - assert:
            file: 24-assert-ac11.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-elasticacheconfig.yaml
        - delete:
            file: 23-global-eccfg-defaults-naming-l7.yaml

    # AC-12: KropathConfig.mandatory.tags and ElastiCacheConfig.mandatory.tags+syncedLabels
    # are union-merged into effCfg.mandatory.tags and effCfg.mandatory.syncedLabels.
    - name: ac12-tag-label-union-merge
      try:
        - apply:
            file: 25-global-kpc-mandatory-tags.yaml
        - apply:
            file: 26-eccfg-mandatory-tags-labels.yaml
        - assert:
            file: 27-assert-ac12.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 26-eccfg-mandatory-tags-labels.yaml
        - delete:
            file: 25-global-kpc-mandatory-tags.yaml

    # AC-13: KropathConfig.spec.aws.region and .accountId propagate to
    # effCfg.aws.region and effCfg.aws.accountId.
    - name: ac13-provider-identity-propagates
      try:
        - apply:
            file: 28-global-kpc-aws-identity.yaml
        - apply:
            file: 02-elasticacheconfig.yaml
        - assert:
            file: 29-assert-ac13.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-elasticacheconfig.yaml
        - delete:
            file: 28-global-kpc-aws-identity.yaml
