# AC-13: globalKropathConfig with provider identity fields.
apiVersion: v1
kind: Namespace
metadata:
  name: ac13-elasticache-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac13-elasticache-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac13-elasticache-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "ap-southeast-2"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac13-elasticache-global-ns
spec: {}
---
# Shared empty local ElastiCacheConfig — all cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: ElastiCacheConfig
metadata:
  name: ac13-general-policy
  namespace: ac13-elasticache-app-ns
spec:
  mandatory: {}
  defaults: {}
