# AC-12: globalKropathConfig with mandatory.tags (tier-level tags, level 1).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: general-policy
  namespace: kro-system
spec:
  mandatory:
    tags:
      cost-centre: infra
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
