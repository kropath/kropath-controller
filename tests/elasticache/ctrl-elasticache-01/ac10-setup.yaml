# AC-10: globalElastiCacheConfig with mandatory.blockNoPasswordUsers=true (level 3).
apiVersion: aws.kropath.run/v1alpha1
kind: ElastiCacheConfig
metadata:
  name: ac10-general-policy
  namespace: kro-system
spec:
  mandatory:
    blockNoPasswordUsers: true
  defaults: {}
---
# Shared empty local ElastiCacheConfig — all cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: ElastiCacheConfig
metadata:
  name: ac10-general-policy
  namespace: payments-prod
spec:
  mandatory: {}
  defaults: {}
