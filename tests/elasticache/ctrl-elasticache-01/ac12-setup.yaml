# AC-12: globalKropathConfig with mandatory.tags (tier-level tags, level 1).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac12-general-policy
  namespace: kro-system
spec:
  mandatory:
    tags:
      cost-centre: infra
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# AC-12: localElastiCacheConfig with mandatory.tags and mandatory.syncedLabels (level 4).
apiVersion: aws.kropath.run/v1alpha1
kind: ElastiCacheConfig
metadata:
  name: ac12-general-policy
  namespace: payments-prod
spec:
  mandatory:
    tags:
      cache-tier: shared
    syncedLabels:
      data-class: internal
  defaults: {}
