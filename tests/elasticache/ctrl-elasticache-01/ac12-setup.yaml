# AC-12: globalKropathConfig with mandatory.tags (tier-level tags, level 1).
apiVersion: v1
kind: Namespace
metadata:
  name: ac12-elasticache-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac12-elasticache-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac12-elasticache-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac12-elasticache-global-ns
spec:
  mandatory:
    tags:
      cost-centre: infra
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# AC-12: localElastiCacheConfig with mandatory.tags and mandatory.syncedLabels (level 4).
apiVersion: aws.kropath.run/v1alpha1
kind: ElastiCacheConfig
metadata:
  name: ac12-general-policy
  namespace: ac12-elasticache-app-ns
spec:
  mandatory:
    tags:
      cache-tier: shared
    syncedLabels:
      data-class: internal
  defaults: {}
