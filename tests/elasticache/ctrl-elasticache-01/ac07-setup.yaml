# AC-7: globalElastiCacheConfig with mandatory.multiAZEnabled=true (level 3).
apiVersion: aws.kropath.run/v1alpha1
kind: ElastiCacheConfig
metadata:
  name: ac7-general-policy
  namespace: kro-system
spec:
  mandatory:
    multiAZEnabled: true
  defaults: {}
---
# Shared empty local ElastiCacheConfig — all cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: ElastiCacheConfig
metadata:
  name: ac7-general-policy
  namespace: payments-prod
spec:
  mandatory: {}
  defaults: {}
