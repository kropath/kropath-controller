# AC-1: globalKropathConfig with mandatory.elasticache.atRestEncryptionEnabled=true (level 1).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: general-policy
  namespace: kro-system
spec:
  mandatory:
    elasticache:
      atRestEncryptionEnabled: true
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
