# AC-4: globalKropathConfig with mandatory.elasticache.transitEncryptionEnabled=true (level 1).
apiVersion: v1
kind: Namespace
metadata:
  name: ac04-elasticache-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac04-elasticache-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac04-elasticache-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac04-elasticache-global-ns
spec:
  mandatory:
    elasticache:
      transitEncryptionEnabled: true
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Shared empty local ElastiCacheConfig — all cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: ElastiCacheConfig
metadata:
  name: ac4-general-policy
  namespace: ac04-elasticache-app-ns
spec:
  mandatory: {}
  defaults: {}
