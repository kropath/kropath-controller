#
# ctrl-version-01 — build-info and feature-enabled metrics (AC-1 and AC-2).
#
# Requires the controller to be running on :8080 (the default metrics address).
# Launched by `make chainsaw-start chainsaw-wait` before running this suite.
#
# These steps use script: to poll the /metrics HTTP endpoint directly. No
# Kubernetes resources are created or deleted; the test is purely read-only.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-version-01
spec:
  description: "Build-info and feature-enabled Prometheus metrics (ctrl-version-01)"
  steps:
    # AC-1: kropath_build_info must appear in /metrics with a non-empty version label.
    - name: ac1-build-info-present
      try:
        - script:
            timeout: 30s
            content: |
              set -e
              output=$(curl -fsS http://127.0.0.1:8080/metrics)
              if ! echo "$output" | grep -q 'kropath_build_info{'; then
                echo "FAIL: kropath_build_info not found in /metrics"
                exit 1
              fi
              echo "PASS: kropath_build_info found"
              echo "$output" | grep 'kropath_build_info{'

    # AC-2: kropath_feature_enabled must appear once per registered feature (25 series).
    - name: ac2-feature-enabled-series-count
      try:
        - script:
            timeout: 30s
            content: |
              set -e
              output=$(curl -fsS http://127.0.0.1:8080/metrics)
              if ! echo "$output" | grep -q 'kropath_feature_enabled{'; then
                echo "FAIL: kropath_feature_enabled not found in /metrics"
                exit 1
              fi
              count=$(echo "$output" | grep -c 'kropath_feature_enabled{' || true)
              echo "kropath_feature_enabled series count: $count"
              if [ "$count" -ne 25 ]; then
                echo "FAIL: expected 25 series, got $count"
                echo "Actual lines:"
                echo "$output" | grep 'kropath_feature_enabled{' || true
                exit 1
              fi
              echo "PASS: 25 kropath_feature_enabled series found"
