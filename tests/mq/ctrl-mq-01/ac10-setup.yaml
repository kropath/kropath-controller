# CC-10: localKropathDefaults.mq.autoMinorVersionUpgrade=true (level 8) wins over
# globalKropathDefaults.mq.autoMinorVersionUpgrade=false (level 9).
apiVersion: v1
kind: Namespace
metadata:
  name: ac10-mq-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac10-mq-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac10-mq-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac10-mq-global-ns
spec:
  mandatory: {}
  defaults:
    mq:
      autoMinorVersionUpgrade: false
---
# Local KropathConfig in resource namespace — level 8 wins.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac10-mq-app-ns
spec:
  mandatory: {}
  defaults:
    mq:
      autoMinorVersionUpgrade: true
---
apiVersion: aws.kropath.run/v1alpha1
kind: MQConfig
metadata:
  name: ac10-mq-policy
  namespace: ac10-mq-app-ns
  labels:
    aws.kropath.run/resource-name: ac10-mq-policy
spec:
  mandatory: {}
  defaults: {}
