# CC-11: Tags are union-merged across all mandatory levels.
# Level 1 wins on key conflict; unique keys from all levels appear.
apiVersion: v1
kind: Namespace
metadata:
  name: ac11-mq-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac11-mq-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac11-mq-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac11-mq-global-ns
spec:
  mandatory:
    tags:
      env: prod
      owner: platform
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
apiVersion: aws.kropath.run/v1alpha1
kind: MQConfig
metadata:
  name: ac11-mq-policy
  namespace: ac11-mq-global-ns
spec:
  mandatory:
    tags:
      cost-center: cc-001
  defaults: {}
---
apiVersion: aws.kropath.run/v1alpha1
kind: MQConfig
metadata:
  name: ac11-mq-policy
  namespace: ac11-mq-app-ns
  labels:
    aws.kropath.run/resource-name: ac11-mq-policy
spec:
  mandatory:
    tags:
      cost-center: cc-999
      app: broker
  defaults: {}
