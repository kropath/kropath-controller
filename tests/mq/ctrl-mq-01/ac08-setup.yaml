# CC-8: globalMQConfig.defaults.namingTemplate="{namespace}-{name}" (level 7) propagates
# when localMQConfig.defaults has no namingTemplate. MQConfig-only field.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac8-mq-policy
  namespace: kro-system
spec:
  mandatory: {}
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
apiVersion: aws.kropath.run/v1alpha1
kind: MQConfig
metadata:
  name: ac8-mq-policy
  namespace: kro-system
spec:
  mandatory: {}
  defaults:
    namingTemplate: "{namespace}-{name}"
---
apiVersion: aws.kropath.run/v1alpha1
kind: MQConfig
metadata:
  name: ac8-mq-policy
  namespace: mq-prod
  labels:
    aws.kropath.run/resource-name: ac8-mq-policy
spec:
  mandatory: {}
  defaults: {}
