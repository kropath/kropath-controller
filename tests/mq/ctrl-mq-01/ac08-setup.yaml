# CC-8: globalMQConfig.defaults.namingTemplate="{namespace}-{name}" (level 7) propagates
# when localMQConfig.defaults has no namingTemplate. MQConfig-only field.
apiVersion: v1
kind: Namespace
metadata:
  name: ac08-mq-global-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac08-mq-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac08-mq-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac08-mq-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac08-mq-global-ns
spec:
  mandatory: {}
---
apiVersion: aws.kropath.run/v1alpha1
kind: MQConfig
metadata:
  name: ac8-mq-policy
  namespace: ac08-mq-global-ns
spec:
  mandatory: {}
  defaults:
    namingTemplate: "{namespace}-{name}"
---
apiVersion: aws.kropath.run/v1alpha1
kind: MQConfig
metadata:
  name: ac8-mq-policy
  namespace: ac08-mq-app-ns
  labels:
    aws.kropath.run/resource-name: ac8-mq-policy
spec:
  mandatory: {}
  defaults: {}
