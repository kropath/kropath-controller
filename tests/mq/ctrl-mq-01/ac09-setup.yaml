# CC-9: globalKropathDefaults.mq.encryptionUseAWSOwnedKey=false (level 9) propagates
# when no MQConfig defaults are set.
apiVersion: v1
kind: Namespace
metadata:
  name: ac09-mq-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac09-mq-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac09-mq-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac09-mq-global-ns
spec:
  mandatory: {}
  defaults:
    mq:
      encryptionUseAWSOwnedKey: false
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
apiVersion: aws.kropath.run/v1alpha1
kind: MQConfig
metadata:
  name: ac9-mq-policy
  namespace: ac09-mq-app-ns
  labels:
    aws.kropath.run/resource-name: ac9-mq-policy
spec:
  mandatory: {}
  defaults: {}
