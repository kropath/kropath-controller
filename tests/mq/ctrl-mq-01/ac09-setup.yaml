# CC-9: globalKropathDefaults.mq.encryptionUseAWSOwnedKey=false (level 9) propagates
# when no MQConfig defaults are set.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac9-mq-policy
  namespace: kro-system
spec:
  mandatory: {}
  defaults:
    mq:
      encryptionUseAWSOwnedKey: false
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
apiVersion: aws.kropath.run/v1alpha1
kind: MQConfig
metadata:
  name: ac9-mq-policy
  namespace: mq-prod
  labels:
    aws.kropath.run/resource-name: ac9-mq-policy
spec:
  mandatory: {}
  defaults: {}
