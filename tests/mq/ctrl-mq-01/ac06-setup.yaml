# CC-6: localMQConfig.defaults.deploymentMode="SINGLE_INSTANCE" (level 6) propagates
# to effCfg.defaults. Mandatory stays empty (no mandatory level set).
apiVersion: v1
kind: Namespace
metadata:
  name: ac06-mq-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac06-mq-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac06-mq-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac06-mq-global-ns
spec:
  mandatory: {}
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
apiVersion: aws.kropath.run/v1alpha1
kind: MQConfig
metadata:
  name: ac6-mq-policy
  namespace: ac06-mq-app-ns
  labels:
    aws.kropath.run/resource-name: ac6-mq-policy
spec:
  mandatory: {}
  defaults:
    deploymentMode: SINGLE_INSTANCE
