# CC-1: globalKropathConfig with mandatory.mq.publiclyAccessible=false (level 1).
# false is a valid enforced value — nil is the only skip sentinel.
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-mq-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-mq-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac01-mq-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac01-mq-global-ns
spec:
  mandatory:
    mq:
      publiclyAccessible: false
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Empty local MQConfig for ac1 — cascade sources come from global KropathConfig.
apiVersion: aws.kropath.run/v1alpha1
kind: MQConfig
metadata:
  name: ac1-mq-policy
  namespace: ac01-mq-app-ns
  labels:
    aws.kropath.run/resource-name: ac1-mq-policy
spec:
  mandatory: {}
  defaults: {}
