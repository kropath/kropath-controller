# CC-2: globalKropathConfig.mandatory.mq.publiclyAccessible=false (level 1) wins over
# globalMQConfig.mandatory.publiclyAccessible=true (level 3).
apiVersion: v1
kind: Namespace
metadata:
  name: ac02-mq-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac02-mq-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac02-mq-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac02-mq-global-ns
spec:
  mandatory:
    mq:
      publiclyAccessible: false
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Global MQConfig with publiclyAccessible=true (level 3) — should lose to level 1.
apiVersion: aws.kropath.run/v1alpha1
kind: MQConfig
metadata:
  name: ac2-mq-policy
  namespace: ac02-mq-global-ns
spec:
  mandatory:
    publiclyAccessible: true
  defaults: {}
---
# Local MQConfig — empty, no override.
apiVersion: aws.kropath.run/v1alpha1
kind: MQConfig
metadata:
  name: ac2-mq-policy
  namespace: ac02-mq-app-ns
  labels:
    aws.kropath.run/resource-name: ac2-mq-policy
spec:
  mandatory: {}
  defaults: {}
