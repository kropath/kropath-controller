# CC-7: localMQConfig.defaults.logsGeneral=true (level 6) wins over
# globalMQConfig.defaults.logsGeneral=false (level 7).
apiVersion: v1
kind: Namespace
metadata:
  name: ac07-mq-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac07-mq-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac07-mq-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac07-mq-global-ns
spec:
  mandatory: {}
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Global MQConfig defaults: logsGeneral=false (level 7) — should lose to level 6.
apiVersion: aws.kropath.run/v1alpha1
kind: MQConfig
metadata:
  name: ac7-mq-policy
  namespace: ac07-mq-global-ns
spec:
  mandatory: {}
  defaults:
    logsGeneral: false
---
# Local MQConfig defaults: logsGeneral=true (level 6) — wins.
apiVersion: aws.kropath.run/v1alpha1
kind: MQConfig
metadata:
  name: ac7-mq-policy
  namespace: ac07-mq-app-ns
  labels:
    aws.kropath.run/resource-name: ac7-mq-policy
spec:
  mandatory: {}
  defaults:
    logsGeneral: true
