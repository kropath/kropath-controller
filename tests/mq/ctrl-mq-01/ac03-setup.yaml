# CC-3: globalMQConfig.mandatory.engineType="ACTIVEMQ" (level 3) propagates
# when KropathConfig.mandatory.mq is empty.
apiVersion: v1
kind: Namespace
metadata:
  name: ac03-mq-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac03-mq-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac03-mq-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac03-mq-global-ns
spec:
  mandatory: {}
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
apiVersion: aws.kropath.run/v1alpha1
kind: MQConfig
metadata:
  name: ac3-mq-policy
  namespace: ac03-mq-global-ns
spec:
  mandatory:
    engineType: ACTIVEMQ
  defaults: {}
---
apiVersion: aws.kropath.run/v1alpha1
kind: MQConfig
metadata:
  name: ac3-mq-policy
  namespace: ac03-mq-app-ns
  labels:
    aws.kropath.run/resource-name: ac3-mq-policy
spec:
  mandatory: {}
  defaults: {}
