# CC-4: localMQConfig.mandatory.hostInstanceType="mq.m5.large" (level 4) propagates.
# hostInstanceType is MQConfig-only — no KropathConfig.mq.hostInstanceType exists.
apiVersion: v1
kind: Namespace
metadata:
  name: ac04-mq-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac04-mq-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac04-mq-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac04-mq-global-ns
spec:
  mandatory: {}
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
apiVersion: aws.kropath.run/v1alpha1
kind: MQConfig
metadata:
  name: ac4-mq-policy
  namespace: ac04-mq-app-ns
  labels:
    aws.kropath.run/resource-name: ac4-mq-policy
spec:
  mandatory:
    hostInstanceType: mq.m5.large
  defaults: {}
