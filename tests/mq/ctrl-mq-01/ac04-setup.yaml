# CC-4: localMQConfig.mandatory.hostInstanceType="mq.m5.large" (level 4) propagates.
# hostInstanceType is MQConfig-only — no KropathConfig.mq.hostInstanceType exists.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac4-mq-policy
  namespace: kro-system
spec:
  mandatory: {}
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
apiVersion: aws.kropath.run/v1alpha1
kind: MQConfig
metadata:
  name: ac4-mq-policy
  namespace: mq-prod
  labels:
    aws.kropath.run/resource-name: ac4-mq-policy
spec:
  mandatory:
    hostInstanceType: mq.m5.large
  defaults: {}
