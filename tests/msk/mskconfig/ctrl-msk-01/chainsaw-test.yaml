# ctrl-msk-01 Chainsaw integration tests — AC-9, AC-12, AC-13.
# Requires:
#   - kind cluster with kropath-operator deployed
#   - KropathConfig CRD applied (crds/awskropathconfig.yaml)
#   - MSKConfig CRD applied (crds/awsmskconfig.yaml)
#
# Test isolation: each step uses a distinct resource name (ac<N>-msk-policy).
# The controller pairs namespaced MSKConfig with its kro-system counterpart by
# *name*, so per-step names provide complete isolation without inter-step deletes.
# skipDelete is not set — end-of-test cleanup is cheap for these plain config CRs.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-msk-01-cascade
spec:
  steps:
    # AC-9: globalKropathConfig.mandatory.msk.encryptionInTransitClientBroker="TLS"
    # propagates to effCfg.mandatory.encryptionInTransitClientBroker.
    - name: ac9-global-kpc-mandatory-msk-encryption-client-broker
      try:
        - apply:
            file: ac09-setup.yaml
        - assert:
            file: ac09-assert.yaml
            timeout: 30s

    # AC-12: KropathConfig.mandatory.tags and MSKConfig.mandatory.tags+syncedLabels
    # are union-merged into effCfg.mandatory.tags and effCfg.mandatory.syncedLabels.
    - name: ac12-tag-label-union-merge
      try:
        - apply:
            file: ac12-setup.yaml
        - assert:
            file: ac12-assert.yaml
            timeout: 30s

    # AC-13: MSKConfig.mandatory.syncedLabels propagates to effCfg.mandatory.syncedLabels.
    - name: ac13-synced-labels-from-mskconfig
      try:
        - apply:
            file: ac13-setup.yaml
        - assert:
            file: ac13-assert.yaml
            timeout: 30s
