apiVersion: v1
kind: Namespace
metadata:
  name: ac08-autoscaling-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac08-autoscaling-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac08-autoscaling-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
# AC-C8: globalKropathConfig with mandatory.tags (tier-level tags, level 1).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac08-autoscaling-global-ns
spec:
  mandatory:
    tags:
      cost-centre: platform
---
# AC-C8: localAutoScalingConfig with mandatory.tags (level 4).
# cost-centre is also set by KropathConfig; KropathConfig must win.
apiVersion: aws.kropath.run/v1alpha1
kind: AutoScalingConfig
metadata:
  name: ac8-general-policy
  namespace: ac08-autoscaling-app-ns
spec:
  mandatory:
    tags:
      cost-centre: app
      asg-type: spot
  defaults: {}
