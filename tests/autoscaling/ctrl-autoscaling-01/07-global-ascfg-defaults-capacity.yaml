# AC-C3: globalAutoScalingConfig defaults.capacityRebalance=true (level 7).
# Mandatory must stay false; only defaults gets the value.
apiVersion: aws.kropath.run/v1alpha1
kind: AutoScalingConfig
metadata:
  name: general-policy
  namespace: kro-system
spec:
  mandatory: {}
  defaults:
    capacityRebalance: true
