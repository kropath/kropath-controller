apiVersion: v1
kind: Namespace
metadata:
  name: ac02-autoscaling-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac02-autoscaling-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac02-autoscaling-global-ns
---
# AC-C2: globalKropathConfig mandatory.autoscaling.newInstancesProtectedFromScaleIn=true (level 1).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac02-autoscaling-global-ns
spec:
  mandatory:
    autoscaling:
      newInstancesProtectedFromScaleIn: true
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
# AC-C2: globalAutoScalingConfig mandatory.newInstancesProtectedFromScaleIn=false (level 3).
# Level 1 from KropathConfig must win over this.
apiVersion: aws.kropath.run/v1alpha1
kind: AutoScalingConfig
metadata:
  name: ac2-general-policy
  namespace: ac02-autoscaling-global-ns
spec:
  mandatory:
    newInstancesProtectedFromScaleIn: false
  defaults: {}
---
# Shared empty local AutoScalingConfig — all cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: AutoScalingConfig
metadata:
  name: ac2-general-policy
  namespace: ac02-autoscaling-app-ns
spec:
  mandatory: {}
  defaults: {}
