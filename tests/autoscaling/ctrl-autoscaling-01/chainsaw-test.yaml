# ctrl-autoscaling-01 Chainsaw integration tests — all 9 acceptance criteria.
# Requires:
#   - kind cluster with kropath-operator deployed
#   - KropathConfig CRD applied (crds/kropathconfig.yaml from kropath-aws)
#   - AutoScalingConfig CRD applied (crds/awsautoscalingconfig.yaml)
#
# Test isolation — unique name per step, no inter-step deletes:
#   Each step owns a distinct set of resource names (ac<N>-*). The controller
#   pairs a namespaced config with its kro-system counterpart by *name*, so a
#   per-step name isolates each step completely — no step can shadow another,
#   in either direction, regardless of order. That removes the need for the
#   per-step cleanup deletes and inline reset steps this suite used to carry.
#   See kropath-aws docs/frequent-rgd-errors.md §6 for the full rationale.
#
#   Unlike that reference, this suite does NOT set skipDelete. Chainsaw's
#   end-of-test cleanup is cheap here — these are plain config CRs with no
#   finalizers and no cloud calls, so there is no deletion queue to back up,
#   which is the only reason skipDelete is mandated there. Letting Chainsaw
#   reclaim each suite's objects keeps the shared kind cluster small; leaving
#   every suite's objects behind for a whole run puts enough reconcile load on
#   the API server to trip the test client's rate limiter in later suites.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-autoscaling-01-cascade
spec:
  steps:
    # AC-C1: globalKropathConfig.mandatory.autoscaling.newInstancesProtectedFromScaleIn=true
    # propagates to AutoScalingConfig.status.effectiveConfig.mandatory.newInstancesProtectedFromScaleIn=true.
    - name: ac-c1-global-kpc-scalein-protection-propagates
      try:
        - apply:
            file: ac01-setup.yaml
        - assert:
            file: ac01-assert.yaml
            timeout: 30s

    # AC-C2: level-1 (KropathConfig mandatory.autoscaling.newInstancesProtectedFromScaleIn=true) wins
    # over level-3 (globalAutoScalingConfig.mandatory.newInstancesProtectedFromScaleIn=false).
    - name: ac-c2-level1-wins-over-level3-scalein
      try:
        - apply:
            file: ac02-setup.yaml
        - assert:
            file: ac02-assert.yaml
            timeout: 30s

    # AC-C3: Only globalAutoScalingConfig.defaults.capacityRebalance=true set;
    # mandatory.capacityRebalance stays false.
    - name: ac-c3-defaults-only-capacity-rebalance
      try:
        - apply:
            file: ac03-setup.yaml
        - assert:
            file: ac03-assert.yaml
            timeout: 30s

    # AC-C4: globalAutoScalingConfig.mandatory.healthCheckType="EC2,ELB" (level 3) wins
    # over localAutoScalingConfig.mandatory.healthCheckType="EC2" (level 4).
    - name: ac-c4-global-healthchecktype-wins-over-local
      try:
        - apply:
            file: ac04-setup.yaml
        - assert:
            file: ac04-assert.yaml
            timeout: 30s

    # AC-C5: Only globalAutoScalingConfig.defaults.healthCheckGracePeriod=600; mandatory stays 0.
    - name: ac-c5-defaults-only-gracePeriod
      try:
        - apply:
            file: ac05-setup.yaml
        - assert:
            file: ac05-assert.yaml
            timeout: 30s

    # AC-C6: globalAutoScalingConfig.mandatory.maxInstanceLifetime=604800 propagates.
    - name: ac-c6-maxinstancelifetime-propagates
      try:
        - apply:
            file: ac06-setup.yaml
        - assert:
            file: ac06-assert.yaml
            timeout: 30s

    # AC-C7: globalAutoScalingConfig.mandatory.namingTemplate="{namespace}-{name}" propagates.
    - name: ac-c7-namingtemplate-propagates
      try:
        - apply:
            file: ac07-setup.yaml
        - assert:
            file: ac07-assert.yaml
            timeout: 30s

    # AC-C8: KropathConfig.mandatory.tags and AutoScalingConfig.mandatory.tags are
    # union-merged into effectiveConfig.mandatory.tags, with KropathConfig winning on key conflicts.
    - name: ac-c8-tag-union-merge
      try:
        - apply:
            file: ac08-setup.yaml
        - assert:
            file: ac08-assert.yaml
            timeout: 30s

    # AC-C9: globalKropathConfig.spec.aws.region and accountId propagate
    # to effectiveConfig.aws.region and effectiveConfig.aws.accountId.
    - name: ac-c9-provider-identity-propagates
      try:
        - apply:
            file: ac09-setup.yaml
        - assert:
            file: ac09-assert.yaml
            timeout: 30s
