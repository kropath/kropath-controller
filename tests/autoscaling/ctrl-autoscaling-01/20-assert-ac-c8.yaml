# Assert AC-C8: effectiveConfig.mandatory.tags is the union of KropathConfig.mandatory.tags
# and AutoScalingConfig.mandatory.tags; KropathConfig wins on key conflict (cost-centre).
apiVersion: aws.kropath.run/v1alpha1
kind: AutoScalingConfig
metadata:
  name: general-policy
  namespace: payments-prod
status:
  effectiveConfig:
    mandatory:
      tags:
        cost-centre: platform
        asg-type: spot
