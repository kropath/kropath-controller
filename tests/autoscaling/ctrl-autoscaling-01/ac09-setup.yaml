apiVersion: v1
kind: Namespace
metadata:
  name: ac09-autoscaling-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac09-autoscaling-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac09-autoscaling-global-ns
---
# AC-C9: globalKropathConfig with aws.accountId and aws.region.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac09-autoscaling-global-ns
spec:
  mandatory: {}
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
# Shared empty local AutoScalingConfig — all cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: AutoScalingConfig
metadata:
  name: ac9-general-policy
  namespace: ac09-autoscaling-app-ns
spec:
  mandatory: {}
  defaults: {}
