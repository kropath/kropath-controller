apiVersion: v1
kind: Namespace
metadata:
  name: ac01-autoscaling-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-autoscaling-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac01-autoscaling-global-ns
---
# AC-C1: globalKropathConfig with mandatory.autoscaling.newInstancesProtectedFromScaleIn=true (level 1).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac01-autoscaling-global-ns
spec:
  mandatory:
    autoscaling:
      newInstancesProtectedFromScaleIn: true
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
# Shared empty local AutoScalingConfig — all cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: AutoScalingConfig
metadata:
  name: ac1-general-policy
  namespace: ac01-autoscaling-app-ns
spec:
  mandatory: {}
  defaults: {}
