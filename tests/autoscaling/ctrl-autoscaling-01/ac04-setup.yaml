# AC-C4: globalAutoScalingConfig mandatory.healthCheckType="EC2,ELB" (level 3).
apiVersion: aws.kropath.run/v1alpha1
kind: AutoScalingConfig
metadata:
  name: ac4-general-policy
  namespace: kro-system
spec:
  mandatory:
    healthCheckType: "EC2,ELB"
  defaults: {}
---
# AC-C4: localAutoScalingConfig mandatory.healthCheckType="EC2" (level 4).
# Level 3 from globalAutoScalingConfig must win.
apiVersion: aws.kropath.run/v1alpha1
kind: AutoScalingConfig
metadata:
  name: ac4-general-policy
  namespace: payments-prod
spec:
  mandatory:
    healthCheckType: "EC2"
  defaults: {}
