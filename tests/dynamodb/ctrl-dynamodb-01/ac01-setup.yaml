apiVersion: v1
kind: Namespace
metadata:
  name: ac01-dynamodb-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-dynamodb-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac01-dynamodb-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac01-dynamodb-global-ns
spec:
  mandatory:
    dynamodb:
      encryptionEnabled: true
---
apiVersion: aws.kropath.run/v1alpha1
kind: DynamoDBConfig
metadata:
  name: ac1-general-table
  namespace: ac01-dynamodb-app-ns
spec: {}
