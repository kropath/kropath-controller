apiVersion: v1
kind: Namespace
metadata:
  name: ac10-dynamodb-global-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac10-dynamodb-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac10-dynamodb-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac10-dynamodb-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac10-dynamodb-global-ns
spec:
  mandatory:
    tags:
      cost-centre: "infra"
---
apiVersion: aws.kropath.run/v1alpha1
kind: DynamoDBConfig
metadata:
  name: ac10-general-table
  namespace: ac10-dynamodb-global-ns
spec:
  mandatory:
    tags:
      resource-type: "database"
---
apiVersion: aws.kropath.run/v1alpha1
kind: DynamoDBConfig
metadata:
  name: ac10-general-table
  namespace: ac10-dynamodb-app-ns
spec: {}
