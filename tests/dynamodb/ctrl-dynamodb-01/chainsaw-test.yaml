# ctrl-dynamodb-01 Chainsaw integration tests — all 13 acceptance criteria.
# Requires:
#   - kind cluster with kropath-operator deployed (feature flag: --enable-dynamodb-cascade)
#   - KropathConfig CRD applied (fixtures/crds/awskropathconfig.yaml)
#   - DynamoDBConfig CRD applied (fixtures/crds/awsdynamodbconfig.yaml)
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-dynamodb-01-cascade
spec:
  namespace: dynamodb
  steps:
    # Purge any stale resources from prior runs before the suite starts.
    - name: purge-stale-leftovers
      try:
        - delete:
            apiVersion: aws.kropath.run/v1alpha1
            kind: DynamoDBConfig
            name: general-table
            namespace: dynamodb
        - delete:
            apiVersion: aws.kropath.run/v1alpha1
            kind: DynamoDBConfig
            name: general-table
            namespace: kro-system
        - delete:
            apiVersion: aws.kropath.run/v1alpha1
            kind: KropathConfig
            name: general-table
            namespace: kro-system
        - delete:
            apiVersion: aws.kropath.run/v1alpha1
            kind: KropathConfig
            name: general-table
            namespace: dynamodb

    # AC-1: globalKropathConfig.mandatory.dynamodb.encryptionEnabled=true (level 1) propagates.
    - name: ac1-global-kpc-encryption-level1
      try:
        - apply:
            file: 01-global-kpc-encryption-true.yaml
        - apply:
            file: 02-dynamodbconfig.yaml
        - assert:
            file: 03-assert-ac1.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-dynamodbconfig.yaml
        - delete:
            file: 01-global-kpc-encryption-true.yaml

    # AC-2: globalDynamoDBConfig.mandatory.encryptionEnabled=true (level 3) wins when
    # levels 1-2 are absent.
    - name: ac2-global-ddbcfg-encryption-level3
      try:
        - apply:
            file: 04-global-ddbcfg-encryption-l3.yaml
        - apply:
            file: 02-dynamodbconfig.yaml
        - assert:
            file: 05-assert-ac2.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-dynamodbconfig.yaml
        - delete:
            file: 04-global-ddbcfg-encryption-l3.yaml

    # AC-3: localDynamoDBConfig.defaults.encryptionEnabled=false (level 6) propagates;
    # explicit false is preserved; mandatory.encryptionEnabled is absent.
    - name: ac3-local-ddbcfg-defaults-encryption-false
      try:
        - apply:
            file: 06-local-ddbcfg-defaults-encryption-false.yaml
        - assert:
            file: 07-assert-ac3.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 06-local-ddbcfg-defaults-encryption-false.yaml

    # AC-4: globalKropathConfig.mandatory.dynamodb.billingMode="PROVISIONED" (level 1).
    - name: ac4-global-kpc-billing-level1
      try:
        - apply:
            file: 08-global-kpc-billing-provisioned.yaml
        - apply:
            file: 02-dynamodbconfig.yaml
        - assert:
            file: 09-assert-ac4.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-dynamodbconfig.yaml
        - delete:
            file: 08-global-kpc-billing-provisioned.yaml

    # AC-5: globalDynamoDBConfig.defaults.billingMode (level 7) wins over
    # globalKropathConfig.defaults.dynamodb.billingMode (level 9).
    - name: ac5-global-ddbcfg-defaults-billing-level7-wins
      try:
        - apply:
            file: 10-global-ddbcfg-defaults-billing-l7.yaml
        - apply:
            file: 11-global-kpc-defaults-billing-l9.yaml
        - apply:
            file: 02-dynamodbconfig.yaml
        - assert:
            file: 12-assert-ac5.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-dynamodbconfig.yaml
        - delete:
            file: 11-global-kpc-defaults-billing-l9.yaml
        - delete:
            file: 10-global-ddbcfg-defaults-billing-l7.yaml

    # AC-6: globalKropathConfig.mandatory.dynamodb.deletionProtectionEnabled=true (level 1).
    - name: ac6-global-kpc-deletion-protection-level1
      try:
        - apply:
            file: 13-global-kpc-deletion-protection.yaml
        - apply:
            file: 02-dynamodbconfig.yaml
        - assert:
            file: 14-assert-ac6.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-dynamodbconfig.yaml
        - delete:
            file: 13-global-kpc-deletion-protection.yaml

    # AC-7: globalDynamoDBConfig.mandatory.pointInTimeRecoveryEnabled=true (level 3).
    - name: ac7-global-ddbcfg-pitr-level3
      try:
        - apply:
            file: 15-global-ddbcfg-pitr-l3.yaml
        - apply:
            file: 02-dynamodbconfig.yaml
        - assert:
            file: 16-assert-ac7.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-dynamodbconfig.yaml
        - delete:
            file: 15-global-ddbcfg-pitr-l3.yaml

    # AC-8: globalDynamoDBConfig.defaults.tableClass="STANDARD_INFREQUENT_ACCESS" (level 7).
    - name: ac8-global-ddbcfg-defaults-tableclass-level7
      try:
        - apply:
            file: 17-global-ddbcfg-defaults-tableclass.yaml
        - apply:
            file: 02-dynamodbconfig.yaml
        - assert:
            file: 18-assert-ac8.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-dynamodbconfig.yaml
        - delete:
            file: 17-global-ddbcfg-defaults-tableclass.yaml

    # AC-9: globalKropathConfig.mandatory.dynamodb.contributorInsights="ENABLE" (level 1).
    - name: ac9-global-kpc-contributor-insights-level1
      try:
        - apply:
            file: 19-global-kpc-contributor-insights.yaml
        - apply:
            file: 02-dynamodbconfig.yaml
        - assert:
            file: 20-assert-ac9.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-dynamodbconfig.yaml
        - delete:
            file: 19-global-kpc-contributor-insights.yaml

    # AC-10: Tags union merge across mandatory sources (KropathConfig level 1 + DynamoDBConfig level 3).
    - name: ac10-tags-union-mandatory
      try:
        - apply:
            file: 21-global-kpc-tags-mandatory.yaml
        - apply:
            file: 22-global-ddbcfg-tags-mandatory.yaml
        - apply:
            file: 02-dynamodbconfig.yaml
        - assert:
            file: 23-assert-ac10.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-dynamodbconfig.yaml
        - delete:
            file: 22-global-ddbcfg-tags-mandatory.yaml
        - delete:
            file: 21-global-kpc-tags-mandatory.yaml

    # AC-11: globalKropathConfig.mandatory.dynamodb.kmsMasterKeyId propagates (level 1).
    - name: ac11-global-kpc-kms-key-level1
      try:
        - apply:
            file: 24-global-kpc-kms-key-id.yaml
        - apply:
            file: 02-dynamodbconfig.yaml
        - assert:
            file: 25-assert-ac11.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-dynamodbconfig.yaml
        - delete:
            file: 24-global-kpc-kms-key-id.yaml

    # AC-12: globalDynamoDBConfig.defaults.namingTemplate propagates (level 7).
    - name: ac12-global-ddbcfg-defaults-naming-level7
      try:
        - apply:
            file: 26-global-ddbcfg-defaults-naming.yaml
        - apply:
            file: 02-dynamodbconfig.yaml
        - assert:
            file: 27-assert-ac12.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-dynamodbconfig.yaml
        - delete:
            file: 26-global-ddbcfg-defaults-naming.yaml

    # AC-13: globalDynamoDBConfig.mandatory.syncedLabels propagates (level 3).
    - name: ac13-global-ddbcfg-mandatory-labels-level3
      try:
        - apply:
            file: 28-global-ddbcfg-mandatory-labels.yaml
        - apply:
            file: 02-dynamodbconfig.yaml
        - assert:
            file: 29-assert-ac13.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-dynamodbconfig.yaml
        - delete:
            file: 28-global-ddbcfg-mandatory-labels.yaml
