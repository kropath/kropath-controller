# ctrl-dynamodb-01 Chainsaw integration tests — all 14 acceptance criteria.
# Requires:
#   - kind cluster with kropath-operator deployed
#   - KropathConfig CRD applied (fixtures/crds/awskropathconfig.yaml)
#   - DynamoDBConfig CRD applied (fixtures/crds/awsdynamodbconfig.yaml)
#
# Test isolation — unique name per step, no inter-step deletes:
#   Each step owns a distinct set of resource names (ac<N>-*). The controller
#   pairs a namespaced config with its kro-system counterpart by *name*, so a
#   per-step name isolates each step completely — no step can shadow another,
#   in either direction, regardless of order. That removes the need for the
#   per-step cleanup deletes and inline reset steps this suite used to carry.
#   See kropath-aws docs/frequent-rgd-errors.md §6 for the full rationale.
#
#   Unlike that reference, this suite does NOT set skipDelete. Chainsaw's
#   end-of-test cleanup is cheap here — these are plain config CRs with no
#   finalizers and no cloud calls, so there is no deletion queue to back up,
#   which is the only reason skipDelete is mandated there. Letting Chainsaw
#   reclaim each suite's objects keeps the shared kind cluster small; leaving
#   every suite's objects behind for a whole run puts enough reconcile load on
#   the API server to trip the test client's rate limiter in later suites.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-dynamodb-01-cascade
spec:
  namespace: dynamodb
  steps:
    # AC-1: globalKropathConfig.mandatory.dynamodb.encryptionEnabled=true (level 1) propagates.
    - name: ac1-global-kpc-encryption-level1
      try:
        - apply:
            file: ac01-setup.yaml
        - assert:
            file: ac01-assert.yaml
            timeout: 30s

    # AC-2: globalDynamoDBConfig.mandatory.encryptionEnabled=true (level 3) wins when
    # levels 1-2 are absent.
    - name: ac2-global-ddbcfg-encryption-level3
      try:
        - apply:
            file: ac02-setup.yaml
        - assert:
            file: ac02-assert.yaml
            timeout: 30s

    # AC-3: localDynamoDBConfig.defaults.encryptionEnabled=false (level 6) propagates;
    # explicit false is preserved; mandatory.encryptionEnabled is absent.
    - name: ac3-local-ddbcfg-defaults-encryption-false
      try:
        - apply:
            file: ac03-setup.yaml
        - assert:
            file: ac03-assert.yaml
            timeout: 30s

    # AC-4: globalKropathConfig.mandatory.dynamodb.billingMode="PROVISIONED" (level 1).
    - name: ac4-global-kpc-billing-level1
      try:
        - apply:
            file: ac04-setup.yaml
        - assert:
            file: ac04-assert.yaml
            timeout: 30s

    # AC-5: globalDynamoDBConfig.defaults.billingMode (level 7) wins over
    # globalKropathConfig.defaults.dynamodb.billingMode (level 9).
    # Purge KropathConfig first: Chainsaw defers cleanup blocks to end-of-test,
    # so AC-4's mandatory.billingMode KropathConfig is still live here. Patching
    # it with defaults.billingMode would trigger the mutual-exclusivity CEL rule.
    - name: ac5-global-ddbcfg-defaults-billing-level7-wins
      try:
        - apply:
            file: ac05-setup.yaml
        - assert:
            file: ac05-assert.yaml
            timeout: 30s

    # AC-6: globalKropathConfig.mandatory.dynamodb.deletionProtectionEnabled=true (level 1).
    - name: ac6-global-kpc-deletion-protection-level1
      try:
        - apply:
            file: ac06-setup.yaml
        - assert:
            file: ac06-assert.yaml
            timeout: 30s

    # AC-7: globalDynamoDBConfig.mandatory.pointInTimeRecoveryEnabled=true (level 3).
    - name: ac7-global-ddbcfg-pitr-level3
      try:
        - apply:
            file: ac07-setup.yaml
        - assert:
            file: ac07-assert.yaml
            timeout: 30s

    # AC-8: globalDynamoDBConfig.defaults.tableClass="STANDARD_INFREQUENT_ACCESS" (level 7).
    - name: ac8-global-ddbcfg-defaults-tableclass-level7
      try:
        - apply:
            file: ac08-setup.yaml
        - assert:
            file: ac08-assert.yaml
            timeout: 30s

    # AC-9: globalKropathConfig.mandatory.dynamodb.contributorInsights="ENABLE" (level 1).
    - name: ac9-global-kpc-contributor-insights-level1
      try:
        - apply:
            file: ac09-setup.yaml
        - assert:
            file: ac09-assert.yaml
            timeout: 30s

    # AC-10: Tags union merge across mandatory sources (KropathConfig level 1 + DynamoDBConfig level 3).
    - name: ac10-tags-union-mandatory
      try:
        - apply:
            file: ac10-setup.yaml
        - assert:
            file: ac10-assert.yaml
            timeout: 30s

    # AC-11: globalKropathConfig.mandatory.dynamodb.kmsMasterKeyId propagates (level 1).
    - name: ac11-global-kpc-kms-key-level1
      try:
        - apply:
            file: ac11-setup.yaml
        - assert:
            file: ac11-assert.yaml
            timeout: 30s

    # AC-12: globalDynamoDBConfig.defaults.namingTemplate propagates (level 7).
    - name: ac12-global-ddbcfg-defaults-naming-level7
      try:
        - apply:
            file: ac12-setup.yaml
        - assert:
            file: ac12-assert.yaml
            timeout: 30s

    # AC-13: globalDynamoDBConfig.mandatory.syncedLabels propagates (level 3).
    - name: ac13-global-ddbcfg-mandatory-labels-level3
      try:
        - apply:
            file: ac13-setup.yaml
        - assert:
            file: ac13-assert.yaml
            timeout: 30s

    # AC-14: globalKropathConfig.spec.aws.region and accountId propagate
    # to effCfg.aws.region and effCfg.aws.accountId.
    - name: ac14-provider-identity
      try:
        - apply:
            file: ac14-setup.yaml
        - assert:
            file: ac14-assert.yaml
            timeout: 30s
