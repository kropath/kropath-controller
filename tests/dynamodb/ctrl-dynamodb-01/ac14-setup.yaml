# AC-14: globalKropathConfig with aws.region and aws.accountId set.
apiVersion: v1
kind: Namespace
metadata:
  name: ac14-dynamodb-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac14-dynamodb-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac14-dynamodb-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac14-dynamodb-global-ns
spec:
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
apiVersion: aws.kropath.run/v1alpha1
kind: DynamoDBConfig
metadata:
  name: ac14-general-table
  namespace: ac14-dynamodb-app-ns
spec: {}
