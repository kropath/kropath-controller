apiVersion: v1
kind: Namespace
metadata:
  name: ac04-dynamodb-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac04-dynamodb-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac04-dynamodb-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac04-dynamodb-global-ns
spec:
  mandatory:
    dynamodb:
      billingMode: "PROVISIONED"
---
apiVersion: aws.kropath.run/v1alpha1
kind: DynamoDBConfig
metadata:
  name: ac4-general-table
  namespace: ac04-dynamodb-app-ns
spec: {}
