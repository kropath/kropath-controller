apiVersion: v1
kind: Namespace
metadata:
  name: ac11-dynamodb-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac11-dynamodb-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac11-dynamodb-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac11-dynamodb-global-ns
spec:
  mandatory:
    dynamodb:
      kmsMasterKeyId: "arn:aws:kms:us-east-1:111122223333:key/test-key"
---
apiVersion: aws.kropath.run/v1alpha1
kind: DynamoDBConfig
metadata:
  name: ac11-general-table
  namespace: ac11-dynamodb-app-ns
spec: {}
