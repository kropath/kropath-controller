apiVersion: v1
kind: Namespace
metadata:
  name: ac05-dynamodb-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac05-dynamodb-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac05-dynamodb-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: DynamoDBConfig
metadata:
  name: ac5-general-table
  namespace: ac05-dynamodb-global-ns
spec:
  defaults:
    billingMode: "PAY_PER_REQUEST"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac05-dynamodb-global-ns
spec:
  defaults:
    dynamodb:
      billingMode: "PROVISIONED"
---
apiVersion: aws.kropath.run/v1alpha1
kind: DynamoDBConfig
metadata:
  name: ac5-general-table
  namespace: ac05-dynamodb-app-ns
spec: {}
