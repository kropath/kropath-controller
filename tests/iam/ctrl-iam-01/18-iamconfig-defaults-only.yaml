# AC-5: namespaced IAMConfig used to validate defaults-only propagation.
apiVersion: aws.kropath.run/v1alpha1
kind: IAMConfig
metadata:
  name: general-policy-defaults
  namespace: payments-prod
spec:
  mandatory:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
