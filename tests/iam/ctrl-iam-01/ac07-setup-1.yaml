# AC-7: Should be rejected — permissionsBoundaryArn set in both mandatory.iam and defaults.iam.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac7-invalid-both-tiers
  namespace: kro-system
spec:
  mandatory:
    iam:
      permissionsBoundaryArn: "arn:aws:iam::123456789012:policy/MandatoryBoundary"
  defaults:
    iam:
      permissionsBoundaryArn: "arn:aws:iam::123456789012:policy/DefaultBoundary"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
