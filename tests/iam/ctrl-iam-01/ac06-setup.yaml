# AC-6: global namespace (kro-system) KropathConfig mandatory boundary — level 1.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac6-general-policy
  namespace: kro-system
spec:
  mandatory:
    iam:
      permissionsBoundaryArn: "arn:aws:iam::123456789012:policy/GlobalBlanket"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
# AC-6: local namespace (payments-prod) KropathConfig mandatory boundary — level 2.
# Should lose to the global (level 1) value.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac6-general-policy
  namespace: payments-prod
spec:
  mandatory:
    iam:
      permissionsBoundaryArn: "arn:aws:iam::123456789012:policy/NsBlanket"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
# IAMConfig used across multiple AC tests as the namespaced config.
apiVersion: aws.kropath.run/v1alpha1
kind: IAMConfig
metadata:
  name: ac6-general-policy
  namespace: payments-prod
spec:
  mandatory:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
