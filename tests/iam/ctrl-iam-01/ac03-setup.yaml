# AC-3: globalKropathConfig with mandatory.iam.blockIamUserAccessKeys=true.
apiVersion: v1
kind: Namespace
metadata:
  name: ac03-iam-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac03-iam-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac03-iam-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac03-iam-global-ns
spec:
  mandatory:
    iam:
      blockIamUserAccessKeys: true
---
# IAMConfig used across multiple AC tests as the namespaced config.
apiVersion: aws.kropath.run/v1alpha1
kind: IAMConfig
metadata:
  name: ac3-general-policy
  namespace: ac03-iam-app-ns
spec:
  mandatory:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
