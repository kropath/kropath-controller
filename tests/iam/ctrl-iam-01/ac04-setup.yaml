# AC-4: level-1 globalKropathConfig mandatory maxSessionDurationSeconds=3600.
apiVersion: v1
kind: Namespace
metadata:
  name: ac04-iam-global-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac04-iam-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac04-iam-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac04-iam-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac04-iam-global-ns
spec:
  mandatory:
    iam:
      maxSessionDurationSeconds: 3600
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
# AC-4: level-3 globalIAMConfig mandatory maxSessionDurationSeconds=7200 (should lose).
apiVersion: aws.kropath.run/v1alpha1
kind: IAMConfig
metadata:
  name: ac4-general-policy
  namespace: ac04-iam-global-ns
spec:
  mandatory:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 7200
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
---
# IAMConfig used across multiple AC tests as the namespaced config.
apiVersion: aws.kropath.run/v1alpha1
kind: IAMConfig
metadata:
  name: ac4-general-policy
  namespace: ac04-iam-app-ns
spec:
  mandatory:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
