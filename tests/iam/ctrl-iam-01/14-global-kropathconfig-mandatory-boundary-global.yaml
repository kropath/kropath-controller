# AC-6: global namespace (kro-system) KropathConfig mandatory boundary — level 1.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: general-policy
  namespace: kro-system
spec:
  mandatory:
    iam:
      permissionsBoundaryArn: "arn:aws:iam::123456789012:policy/GlobalBlanket"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
