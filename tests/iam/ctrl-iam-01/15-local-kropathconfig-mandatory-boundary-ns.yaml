# AC-6: local namespace (payments-prod) KropathConfig mandatory boundary — level 2.
# Should lose to the global (level 1) value.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: general-policy
  namespace: payments-prod
spec:
  mandatory:
    iam:
      permissionsBoundaryArn: "arn:aws:iam::123456789012:policy/NsBlanket"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
