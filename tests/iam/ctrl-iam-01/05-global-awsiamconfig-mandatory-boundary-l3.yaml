# AC-2: level-3 globalAWSIAMConfig mandatory boundary (should lose to level 1).
apiVersion: aws.kropath.run/v1alpha1
kind: AWSIAMConfig
metadata:
  name: general-policy
  namespace: kro-system
spec:
  mandatory:
    permissionsBoundaryArn: "arn:aws:iam::123456789012:policy/IAMConfigLevel3"
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
