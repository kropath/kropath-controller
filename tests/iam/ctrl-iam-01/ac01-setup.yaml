# AC-1: globalKropathConfig with mandatory.iam.permissionsBoundaryArn set (level 1).
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-iam-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-iam-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac01-iam-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac01-iam-global-ns
spec:
  mandatory:
    iam:
      permissionsBoundaryArn: "arn:aws:iam::123456789012:policy/GlobalBlanket"
---
# IAMConfig used across multiple AC tests as the namespaced config.
apiVersion: aws.kropath.run/v1alpha1
kind: IAMConfig
metadata:
  name: ac1-general-policy
  namespace: ac01-iam-app-ns
spec:
  mandatory:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
