# AC-2: level-1 globalKropathConfig mandatory boundary (should win).
apiVersion: v1
kind: Namespace
metadata:
  name: ac02-iam-global-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac02-iam-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac02-iam-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac02-iam-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac02-iam-global-ns
spec:
  mandatory:
    iam:
      permissionsBoundaryArn: "arn:aws:iam::123456789012:policy/KropathConfigWins"
---
# AC-2: level-3 globalIAMConfig mandatory boundary (should lose to level 1).
apiVersion: aws.kropath.run/v1alpha1
kind: IAMConfig
metadata:
  name: ac2-general-policy
  namespace: ac02-iam-global-ns
spec:
  mandatory:
    permissionsBoundaryArn: "arn:aws:iam::123456789012:policy/IAMConfigLevel3"
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
---
# IAMConfig used across multiple AC tests as the namespaced config.
apiVersion: aws.kropath.run/v1alpha1
kind: IAMConfig
metadata:
  name: ac2-general-policy
  namespace: ac02-iam-app-ns
spec:
  mandatory:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
  defaults:
    permissionsBoundaryArn: ""
    blockIamUserAccessKeys: false
    maxSessionDurationSeconds: 0
    tags: {}
    syncedLabels: {}
    syncedAnnotations: {}
