# Assert: level-1 KropathConfig mandatory boundary wins over level-3 IAMConfig.
apiVersion: aws.kropath.run/v1alpha1
kind: IAMConfig
metadata:
  name: ac2-general-policy
  namespace: payments-prod
status:
  effectiveConfig:
    mandatory:
      permissionsBoundaryArn: "arn:aws:iam::123456789012:policy/KropathConfigWins"
