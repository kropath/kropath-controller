# ctrl-iam-01 Chainsaw integration tests — all 7 acceptance criteria.
# Requires:
#   - kind cluster with kropath-operator deployed
#   - KropathConfig CRD applied (crds/kropathconfig.yaml from kropath-aws)
#   - IAMConfig CRD applied (crds/iamconfig.yaml from kropath-aws)
#
# Test isolation — unique name per step, no inter-step deletes:
#   Each step owns a distinct set of resource names (ac<N>-*). The controller
#   pairs a namespaced config with its kro-system counterpart by *name*, so a
#   per-step name isolates each step completely — no step can shadow another,
#   in either direction, regardless of order. That removes the need for the
#   per-step cleanup deletes and inline reset steps this suite used to carry.
#   See kropath-aws docs/frequent-rgd-errors.md §6 for the full rationale.
#
#   skipDelete is not set per-suite; the whole run instead passes --skip-delete
#   via CHAINSAW_FLAGS in the Makefile, matching the reference pattern. Chainsaw
#   otherwise deletes each step's resources at step end and blocks on it, and
#   since every AC now creates its own Namespace pair that cost dominated the
#   job -- 310 namespace deletions, 27.4 of 32 minutes (KRO-1154). Deletion is
#   not what isolates suites here; the unique-name-per-AC rule above is.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-iam-01-cascade
spec:
  steps:
    # AC-1: globalKropathConfig.mandatory.iam.permissionsBoundaryArn set at level 1
    # propagates to IAMConfig.status.effectiveConfig.mandatory.permissionsBoundaryArn.
    - name: ac1-global-mandatory-boundary-propagates
      try:
        - apply:
            file: ac01-setup.yaml
        - assert:
            file: ac01-assert.yaml
            timeout: 30s

    # AC-2: level-1 (KropathConfig mandatory) wins over level-3 (IAMConfig mandatory).
    - name: ac2-level1-wins-over-level3
      try:
        - apply:
            file: ac02-setup.yaml
        - assert:
            file: ac02-assert.yaml
            timeout: 30s

    # AC-3: globalKropathConfig.mandatory.iam.blockIamUserAccessKeys=true propagates.
    - name: ac3-block-access-keys-propagates
      try:
        - apply:
            file: ac03-setup.yaml
        - assert:
            file: ac03-assert.yaml
            timeout: 30s

    # AC-4: level-1 maxSessionDurationSeconds=3600 wins over level-3 value of 7200.
    - name: ac4-max-session-level1-wins
      try:
        - apply:
            file: ac04-setup.yaml
        - assert:
            file: ac04-assert.yaml
            timeout: 30s

    # AC-5: only globalIAMConfig.defaults.maxSessionDurationSeconds set;
    # mandatory must be 0, defaults must be 3600.
    - name: ac5-defaults-only-no-mandatory-bleed
      try:
        - apply:
            file: ac05-setup.yaml
        - assert:
            file: ac05-assert.yaml
            timeout: 30s

    # AC-6: global mandatory (level 1) wins over local namespace mandatory (level 2).
    - name: ac6-global-mandatory-wins-over-local
      try:
        - apply:
            file: ac06-setup.yaml
        - assert:
            file: ac06-assert.yaml
            timeout: 30s

    # AC-7: KropathConfig with both mandatory.iam.permissionsBoundaryArn and
    # defaults.iam.permissionsBoundaryArn non-empty is rejected at admission.
    # This is a pure CRD validation test — does not require a running controller.
    - name: ac7-mutual-exclusivity-validation
      try:
        - apply:
            file: ac07-setup-1.yaml
            expect:
            - match:
                apiVersion: aws.kropath.run/v1alpha1
                kind: KropathConfig
              check:
                ($error != null): true
