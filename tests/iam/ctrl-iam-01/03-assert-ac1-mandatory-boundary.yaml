# Assert: mandatory.permissionsBoundaryArn from level-1 globalKropathConfig
# must appear in status.effectiveConfig of namespaced AWSIAMConfig.
apiVersion: kropath.run/v1alpha1
kind: AWSIAMConfig
metadata:
  name: general-policy
  namespace: payments-prod
status:
  effectiveConfig:
    mandatory:
      permissionsBoundaryArn: "arn:aws:iam::123456789012:policy/GlobalBlanket"
