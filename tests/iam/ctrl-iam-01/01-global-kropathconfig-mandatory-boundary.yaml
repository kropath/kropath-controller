# AC-1: globalAWSKropathConfig with mandatory.iam.permissionsBoundaryArn set (level 1).
apiVersion: aws.kropath.run/v1alpha1
kind: AWSKropathConfig
metadata:
  name: general-policy
  namespace: kro-system
spec:
  mandatory:
    iam:
      permissionsBoundaryArn: "arn:aws:iam::123456789012:policy/GlobalBlanket"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
