apiVersion: v1
kind: Namespace
metadata:
  name: ac08-memorydb-global-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac08-memorydb-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac08-memorydb-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac08-memorydb-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
# AC-8: globalMemoryDBConfig.defaults.snapshotRetentionLimit=3 (level 7) wins over
# globalKropathConfig.defaults.memorydb.snapshotRetentionLimit=1 (level 9).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac08-memorydb-global-ns
spec:
  defaults:
    memorydb:
      snapshotRetentionLimit: 1
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# globalMemoryDBConfig provides level-7 default — stronger than level-9 KPC default.
apiVersion: aws.kropath.run/v1alpha1
kind: MemoryDBConfig
metadata:
  name: ac8-mdb-policy
  namespace: ac08-memorydb-global-ns
spec:
  mandatory: {}
  defaults:
    snapshotRetentionLimit: 3
---
apiVersion: aws.kropath.run/v1alpha1
kind: MemoryDBConfig
metadata:
  name: ac8-mdb-policy
  namespace: ac08-memorydb-app-ns
spec:
  mandatory: {}
  defaults: {}
