apiVersion: v1
kind: Namespace
metadata:
  name: ac04-memorydb-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac04-memorydb-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac04-memorydb-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
# AC-4: globalKropathConfig.mandatory.memorydb.allowedNodeTypes set (level 1).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac04-memorydb-global-ns
spec:
  mandatory:
    memorydb:
      allowedNodeTypes:
      - "db.r7g.large"
      - "db.r7g.xlarge"
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
apiVersion: aws.kropath.run/v1alpha1
kind: MemoryDBConfig
metadata:
  name: ac4-mdb-policy
  namespace: ac04-memorydb-app-ns
spec:
  mandatory: {}
  defaults: {}
