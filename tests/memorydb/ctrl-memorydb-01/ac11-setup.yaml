# AC-11: globalMemoryDBConfig.defaults.namingTemplate="{namespace}-{name}" (level 7).
# No KropathConfig.memorydb.namingTemplate field exists.
apiVersion: aws.kropath.run/v1alpha1
kind: MemoryDBConfig
metadata:
  name: ac11-mdb-policy
  namespace: kro-system
spec:
  mandatory: {}
  defaults:
    namingTemplate: "{namespace}-{name}"
---
apiVersion: aws.kropath.run/v1alpha1
kind: MemoryDBConfig
metadata:
  name: ac11-mdb-policy
  namespace: payments-prod
spec:
  mandatory: {}
  defaults: {}
