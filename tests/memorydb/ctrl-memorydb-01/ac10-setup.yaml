apiVersion: v1
kind: Namespace
metadata:
  name: ac10-memorydb-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac10-memorydb-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac10-memorydb-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
# AC-10: Union merge of KropathConfig.mandatory.tags + MemoryDBConfig.mandatory.tags+syncedLabels.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac10-memorydb-global-ns
spec:
  mandatory:
    tags:
      org: kropath
      env: prod
---
apiVersion: aws.kropath.run/v1alpha1
kind: MemoryDBConfig
metadata:
  name: ac10-mdb-policy
  namespace: ac10-memorydb-app-ns
spec:
  mandatory:
    tags:
      team: payments
    syncedLabels:
      app.kubernetes.io/managed-by: kropath
  defaults: {}
