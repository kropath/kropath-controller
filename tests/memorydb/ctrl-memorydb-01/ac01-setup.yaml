apiVersion: v1
kind: Namespace
metadata:
  name: ac01-memorydb-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-memorydb-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac01-memorydb-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
# AC-1: globalKropathConfig with mandatory.memorydb.tlsEnabled=true (level 1).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac01-memorydb-global-ns
spec:
  mandatory:
    memorydb:
      tlsEnabled: true
---
# Shared empty local MemoryDBConfig — cascade source is globalKropathConfig only.
apiVersion: aws.kropath.run/v1alpha1
kind: MemoryDBConfig
metadata:
  name: ac1-mdb-policy
  namespace: ac01-memorydb-app-ns
spec:
  mandatory: {}
  defaults: {}
