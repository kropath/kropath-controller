# AC-1: globalKropathConfig with mandatory.memorydb.tlsEnabled=true (level 1).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac1-mdb-policy
  namespace: kro-system
spec:
  mandatory:
    memorydb:
      tlsEnabled: true
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Shared empty local MemoryDBConfig — cascade source is globalKropathConfig only.
apiVersion: aws.kropath.run/v1alpha1
kind: MemoryDBConfig
metadata:
  name: ac1-mdb-policy
  namespace: payments-prod
spec:
  mandatory: {}
  defaults: {}
