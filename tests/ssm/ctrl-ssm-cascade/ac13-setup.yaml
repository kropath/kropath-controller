#
# AC-13: KropathConfig.mandatory.tags (level 1) + SSMConfig.mandatory.tags (level 3)
# are union-merged into effCfg.mandatory.tags (closer-to-instance wins on key conflict).
# globalKropathConfig sets env=prod, org=kropath.
# globalSSMConfig sets env=staging (overridden by KPC), team=platform.
# Expected effCfg.mandatory.tags: env=prod, org=kropath, team=platform.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac13-ssm-global-ns
spec:
  mandatory:
    tags:
      env: prod
      org: kropath
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: SSMConfig
metadata:
  name: ac13-ssm-policy
  namespace: ac13-ssm-global-ns
spec:
  mandatory:
    tags:
      env: staging
      team: platform
---
apiVersion: aws.kropath.run/v1alpha1
kind: SSMConfig
metadata:
  name: ac13-ssm-policy
  namespace: ac13-ssm-app-ns
spec: {}
