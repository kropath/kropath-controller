apiVersion: v1
kind: Namespace
metadata:
  name: ac13-ssm-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac13-ssm-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac13-ssm-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
