# AC-11: KropathConfig.mandatory.ssm.parameterType=SecureString (level 1)
# flows to effCfg.mandatory.type=SecureString.
# SSMConfig spec is empty — value demonstrably comes from L1.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac11-ssm-policy
  namespace: kro-system
spec:
  mandatory:
    ssm:
      parameterType: SecureString
---
apiVersion: aws.kropath.run/v1alpha1
kind: SSMConfig
metadata:
  name: ac11-ssm-policy
  namespace: ssm-prod
spec: {}
