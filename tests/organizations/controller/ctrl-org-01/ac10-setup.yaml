apiVersion: v1
kind: Namespace
metadata:
  name: ac10-org-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac10-org-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac10-org-global-ns
---
# AC-10: globalKropathConfig with mandatory.tags (tier-level tags, level 1).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac10-org-global-ns
spec:
  mandatory:
    tags:
      cost-centre: infra
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# AC-10: local OrganizationsConfig with mandatory.tags (OrganizationsConfig-level tags, level 4).
apiVersion: aws.kropath.run/v1alpha1
kind: OrganizationsConfig
metadata:
  name: ac10-org-policy
  namespace: ac10-org-app-ns
  labels:
    aws.kropath.run/resource-name: ac10-org-policy
spec:
  mandatory:
    tags:
      team: platform
  defaults: {}
