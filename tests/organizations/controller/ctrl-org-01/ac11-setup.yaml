apiVersion: v1
kind: Namespace
metadata:
  name: ac11-org-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac11-org-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac11-org-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
# AC-11: OrganizationsConfig.mandatory.syncedLabels propagates to effectiveConfig.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac11-org-global-ns
spec:
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# AC-11: localOrganizationsConfig with mandatory.syncedLabels (level 4).
apiVersion: aws.kropath.run/v1alpha1
kind: OrganizationsConfig
metadata:
  name: ac11-org-policy
  namespace: ac11-org-app-ns
  labels:
    aws.kropath.run/resource-name: ac11-org-policy
spec:
  mandatory:
    syncedLabels:
      data-class: restricted
  defaults: {}
