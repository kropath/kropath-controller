# AC-11: OrganizationsConfig.mandatory.syncedLabels propagates to effectiveConfig.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac11-org-policy
  namespace: kro-system
spec:
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# AC-11: localOrganizationsConfig with mandatory.syncedLabels (level 4).
apiVersion: aws.kropath.run/v1alpha1
kind: OrganizationsConfig
metadata:
  name: ac11-org-policy
  namespace: org-prod
  labels:
    aws.kropath.run/resource-name: ac11-org-policy
spec:
  mandatory:
    syncedLabels:
      data-class: restricted
  defaults: {}
