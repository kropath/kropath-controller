# CC-03: localKeyspacesConfig.defaults.throughputMode=PAY_PER_REQUEST (level 6, strongest default)
# flows to effectiveConfig.defaults.throughputMode=PAY_PER_REQUEST,
# overriding globalKeyspacesConfig.defaults.throughputMode=PROVISIONED (level 7).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac3-keyspaces-policy
  namespace: kro-system
spec:
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KeyspacesConfig
metadata:
  name: ac3-keyspaces-policy
  namespace: kro-system
spec:
  defaults:
    throughputMode: PROVISIONED
---
apiVersion: aws.kropath.run/v1alpha1
kind: KeyspacesConfig
metadata:
  name: ac3-keyspaces-policy
  namespace: payments-prod
spec:
  defaults:
    throughputMode: PAY_PER_REQUEST
