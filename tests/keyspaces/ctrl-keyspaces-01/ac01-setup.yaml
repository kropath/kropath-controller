# CC-01: globalKropathConfig.mandatory.keyspaces.replicationStrategy=SINGLE_REGION (level 1)
# flows to effectiveConfig.mandatory.replicationStrategy=SINGLE_REGION.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac1-keyspaces-policy
  namespace: kro-system
spec:
  mandatory:
    keyspaces:
      replicationStrategy: SINGLE_REGION
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KeyspacesConfig
metadata:
  name: ac1-keyspaces-policy
  namespace: payments-prod
spec: {}
