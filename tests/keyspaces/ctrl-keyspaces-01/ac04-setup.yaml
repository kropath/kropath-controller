# CC-04: globalKropathConfig.defaults.keyspaces.ttlEnabled=true (level 9, weakest default)
# flows to effectiveConfig.defaults.ttlEnabled=true when no stronger default is set.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac4-keyspaces-policy
  namespace: kro-system
spec:
  defaults:
    keyspaces:
      ttlEnabled: true
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KeyspacesConfig
metadata:
  name: ac4-keyspaces-policy
  namespace: payments-prod
spec: {}
