# CC-05: KropathConfig.mandatory.tags and KeyspacesConfig.mandatory.tags are union-merged.
# KropathConfig.mandatory.tags: env=prod, owner=platform (lower level number wins on conflict).
# KeyspacesConfig.mandatory.tags: team=data.
# effectiveConfig.mandatory.tags must contain all three keys.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac5-keyspaces-policy
  namespace: kro-system
spec:
  mandatory:
    tags:
      env: prod
      owner: platform
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KeyspacesConfig
metadata:
  name: ac5-keyspaces-policy
  namespace: payments-prod
spec:
  mandatory:
    tags:
      team: data
