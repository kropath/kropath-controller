# AC-11: globalKropathConfig with aws.region and aws.accountId set.
apiVersion: v1
kind: Namespace
metadata:
  name: ac11-cloudwatchlogs-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac11-cloudwatchlogs-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac11-cloudwatchlogs-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "ap-southeast-2"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac11-cloudwatchlogs-global-ns
spec: {}
---
# Empty local CloudWatchLogsConfig for ac11 — cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchLogsConfig
metadata:
  name: ac11-ac11-cwl-policy
  namespace: ac11-cloudwatchlogs-app-ns
  labels:
    aws.kropath.run/resource-name: ac11-ac11-cwl-policy
spec:
  mandatory: {}
  defaults: {}
