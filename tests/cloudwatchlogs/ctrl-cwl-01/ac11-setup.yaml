# AC-11: globalKropathConfig with aws.region and aws.accountId set.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac11-ac11-cwl-policy
  namespace: kro-system
spec:
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Empty local CloudWatchLogsConfig for ac11 — cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchLogsConfig
metadata:
  name: ac11-ac11-cwl-policy
  namespace: logging-prod
  labels:
    aws.kropath.run/resource-name: ac11-ac11-cwl-policy
spec:
  mandatory: {}
  defaults: {}
