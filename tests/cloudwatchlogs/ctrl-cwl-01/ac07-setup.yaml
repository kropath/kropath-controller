# AC-7: globalCloudWatchLogsConfig with defaults.namingTemplate="{namespace}-{name}" (level 7).
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchLogsConfig
metadata:
  name: ac7-ac7-cwl-policy
  namespace: kro-system
  labels:
    aws.kropath.run/resource-name: ac7-ac7-cwl-policy
spec:
  mandatory: {}
  defaults:
    namingTemplate: "{namespace}-{name}"
---
# Empty local CloudWatchLogsConfig for ac7 — cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchLogsConfig
metadata:
  name: ac7-ac7-cwl-policy
  namespace: logging-prod
  labels:
    aws.kropath.run/resource-name: ac7-ac7-cwl-policy
spec:
  mandatory: {}
  defaults: {}
