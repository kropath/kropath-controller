# ctrl-cwl-01 Chainsaw integration tests — all 11 acceptance criteria.
# Requires:
#   - kind cluster with kropath-operator deployed (feature flag: --enable-cloudwatchlogs-cascade)
#   - KropathConfig CRD applied (crds/kropathconfig.yaml from kropath-aws)
#   - CloudWatchLogsConfig CRD applied (crds/cloudwatchlogsconfig.yaml from kropath-aws)
#
# Each AC step uses a unique resource name (acN-cwl-policy) so that Chainsaw's
# deferred LIFO cleanup from prior steps cannot pollute later steps.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-cwl-01-cascade
spec:
  namespace: logging-prod
  steps:
    # AC-1: globalKropathConfig.mandatory.cloudwatchlogs.kmsKeyId (level 1) propagates.
    - name: ac1-global-kpc-kms-level1
      try:
        - apply:
            file: 01-global-kpc-kms-l1.yaml
        - apply:
            file: 02-cwlconfig-ac1.yaml
        - assert:
            file: 03-assert-ac1.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-cwlconfig-ac1.yaml
        - delete:
            file: 01-global-kpc-kms-l1.yaml

    # AC-2: globalCWLConfig.mandatory.kmsKeyId (level 3) wins when levels 1-2 are empty.
    - name: ac2-global-cwlcfg-kms-level3
      try:
        - apply:
            file: 04-global-cwlcfg-kms-l3.yaml
        - apply:
            file: 02-cwlconfig-ac2.yaml
        - assert:
            file: 05-assert-ac2.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-cwlconfig-ac2.yaml
        - delete:
            file: 04-global-cwlcfg-kms-l3.yaml

    # AC-3: localCWLConfig.defaults.kmsKeyId (level 6) propagates; mandatory stays empty.
    - name: ac3-local-cwlcfg-defaults-kms-level6
      try:
        - apply:
            file: 06-local-cwlcfg-defaults-kms-l6.yaml
        - assert:
            file: 07-assert-ac3.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 06-local-cwlcfg-defaults-kms-l6.yaml

    # AC-4: globalKropathConfig.mandatory.cloudwatchlogs.retentionDays=365 (level 1) propagates.
    - name: ac4-global-kpc-retention-level1
      try:
        - apply:
            file: 08-global-kpc-retention-l1.yaml
        - apply:
            file: 02-cwlconfig-ac4.yaml
        - assert:
            file: 09-assert-ac4.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-cwlconfig-ac4.yaml
        - delete:
            file: 08-global-kpc-retention-l1.yaml

    # AC-5: globalCWLConfig.mandatory.retentionDays=2557 (level 3) wins when levels 1-2 are 0.
    - name: ac5-global-cwlcfg-retention-level3
      try:
        - apply:
            file: 10-global-cwlcfg-retention-l3.yaml
        - apply:
            file: 02-cwlconfig-ac5.yaml
        - assert:
            file: 11-assert-ac5.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-cwlconfig-ac5.yaml
        - delete:
            file: 10-global-cwlcfg-retention-l3.yaml

    # AC-6: localCWLConfig.defaults.retentionDays=90 (level 6) propagates; mandatory stays 0.
    - name: ac6-local-cwlcfg-defaults-retention-level6
      try:
        - apply:
            file: 12-local-cwlcfg-defaults-retention-l6.yaml
        - assert:
            file: 13-assert-ac6.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 12-local-cwlcfg-defaults-retention-l6.yaml

    # AC-7: globalCWLConfig.defaults.namingTemplate="{namespace}-{name}" (level 7) propagates.
    # KropathConfig.cloudwatchlogs has no namingTemplate field.
    - name: ac7-global-cwlcfg-defaults-naming-level7
      try:
        - apply:
            file: 14-global-cwlcfg-defaults-naming-l7.yaml
        - apply:
            file: 02-cwlconfig-ac7.yaml
        - assert:
            file: 15-assert-ac7.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-cwlconfig-ac7.yaml
        - delete:
            file: 14-global-cwlcfg-defaults-naming-l7.yaml

    # AC-8: globalCWLConfig.mandatory.namingTemplate="corp-{namespace}-{name}" (level 3)
    # propagates to effCfg.mandatory.namingTemplate.
    - name: ac8-global-cwlcfg-mandatory-naming-level3
      try:
        - apply:
            file: 16-global-cwlcfg-mandatory-naming-l3.yaml
        - apply:
            file: 02-cwlconfig-ac8.yaml
        - assert:
            file: 17-assert-ac8.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-cwlconfig-ac8.yaml
        - delete:
            file: 16-global-cwlcfg-mandatory-naming-l3.yaml

    # AC-9: KropathConfig.mandatory.tags and CloudWatchLogsConfig.mandatory.tags are
    # union-merged into effCfg.mandatory.tags.
    - name: ac9-tag-union-merge
      try:
        - apply:
            file: 18-global-kpc-mandatory-tags.yaml
        - apply:
            file: 19-cwlconfig-mandatory-tags.yaml
        - assert:
            file: 20-assert-ac9.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 19-cwlconfig-mandatory-tags.yaml
        - delete:
            file: 18-global-kpc-mandatory-tags.yaml

    # AC-10: globalCWLConfig.mandatory.syncedLabels={data-class: internal} (level 3) propagates.
    - name: ac10-global-cwlcfg-synced-labels
      try:
        - apply:
            file: 21-global-cwlcfg-synced-labels.yaml
        - apply:
            file: 02-cwlconfig-ac10.yaml
        - assert:
            file: 22-assert-ac10.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-cwlconfig-ac10.yaml
        - delete:
            file: 21-global-cwlcfg-synced-labels.yaml

    # AC-11: globalKropathConfig.spec.aws.region and accountId propagate to
    # effCfg.aws.region and effCfg.aws.accountId.
    - name: ac11-provider-identity-propagates
      try:
        - apply:
            file: 23-global-kpc-aws-identity.yaml
        - apply:
            file: 02-cwlconfig-ac11.yaml
        - assert:
            file: 24-assert-ac11.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-cwlconfig-ac11.yaml
        - delete:
            file: 23-global-kpc-aws-identity.yaml
