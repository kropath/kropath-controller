# AC-2: globalCloudWatchLogsConfig with mandatory.kmsKeyId (level 3).
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchLogsConfig
metadata:
  name: general-policy
  namespace: kro-system
  labels:
    aws.kropath.run/resource-name: general-policy
spec:
  mandatory:
    kmsKeyId: "arn:aws:kms:ap-southeast-2:123:key/rc-key"
  defaults: {}
