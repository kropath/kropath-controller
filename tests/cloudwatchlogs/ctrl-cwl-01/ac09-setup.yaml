# AC-9: globalKropathConfig with mandatory.tags (tier-level tags, level 1).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac9-ac9-cwl-policy
  namespace: kro-system
spec:
  mandatory:
    tags:
      cost-centre: infra
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# AC-9: localCloudWatchLogsConfig with mandatory.tags (CloudWatch Logs config-level tags, level 4).
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchLogsConfig
metadata:
  name: ac9-ac9-cwl-policy
  namespace: logging-prod
  labels:
    aws.kropath.run/resource-name: ac9-ac9-cwl-policy
spec:
  mandatory:
    tags:
      log-class: production
  defaults: {}
