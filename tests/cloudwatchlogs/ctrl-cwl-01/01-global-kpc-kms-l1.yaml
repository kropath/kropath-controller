# AC-1: globalKropathConfig with mandatory.cloudwatchlogs.kmsKeyId (level 1).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac1-cwl-policy
  namespace: kro-system
spec:
  mandatory:
    cloudwatchlogs:
      kmsKeyId: "arn:aws:kms:ap-southeast-2:123:key/org-key"
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
