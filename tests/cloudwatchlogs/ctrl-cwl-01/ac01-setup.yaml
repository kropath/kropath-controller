# AC-1: globalKropathConfig with mandatory.cloudwatchlogs.kmsKeyId (level 1).
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-cloudwatchlogs-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-cloudwatchlogs-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac01-cloudwatchlogs-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac01-cloudwatchlogs-global-ns
spec:
  mandatory:
    cloudwatchlogs:
      kmsKeyId: "arn:aws:kms:ap-southeast-2:123:key/org-key"
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Empty local CloudWatchLogsConfig for ac1 — cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchLogsConfig
metadata:
  name: ac1-ac1-cwl-policy
  namespace: ac01-cloudwatchlogs-app-ns
  labels:
    aws.kropath.run/resource-name: ac1-ac1-cwl-policy
spec:
  mandatory: {}
  defaults: {}
