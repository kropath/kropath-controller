# AC-10: globalCloudWatchLogsConfig with mandatory.syncedLabels (level 3).
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchLogsConfig
metadata:
  name: general-policy
  namespace: kro-system
  labels:
    aws.kropath.run/resource-name: general-policy
spec:
  mandatory:
    syncedLabels:
      data-class: internal
  defaults: {}
