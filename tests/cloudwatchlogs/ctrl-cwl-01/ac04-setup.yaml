# AC-4: globalKropathConfig with mandatory.cloudwatchlogs.retentionDays=365 (level 1).
apiVersion: v1
kind: Namespace
metadata:
  name: ac04-cloudwatchlogs-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac04-cloudwatchlogs-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac04-cloudwatchlogs-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac04-cloudwatchlogs-global-ns
spec:
  mandatory:
    cloudwatchlogs:
      retentionDays: 365
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Empty local CloudWatchLogsConfig for ac4 — cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchLogsConfig
metadata:
  name: ac4-ac4-cwl-policy
  namespace: ac04-cloudwatchlogs-app-ns
  labels:
    aws.kropath.run/resource-name: ac4-ac4-cwl-policy
spec:
  mandatory: {}
  defaults: {}
