# AC-3: globalEMRConfig.mandatory.autoStopIdleTimeoutMinutes (level 3) — integer cascade.
# Zero is the "not set" sentinel; a non-zero value at level 3 must propagate to effCfg.mandatory.
apiVersion: aws.kropath.run/v1alpha1
kind: EMRConfig
metadata:
  name: ac3-emr-policy
  namespace: kro-system
spec:
  mandatory:
    autoStopIdleTimeoutMinutes: 30
---
apiVersion: aws.kropath.run/v1alpha1
kind: EMRConfig
metadata:
  name: ac3-emr-policy
  namespace: data-platform
spec:
  mandatory:
    autoStopIdleTimeoutMinutes: 0
