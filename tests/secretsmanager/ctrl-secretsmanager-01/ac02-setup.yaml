# AC-1: globalKropathConfig with mandatory.secretsManager.kmsKeyID (level 1).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac2-general-policy
  namespace: kro-system
spec:
  mandatory:
    secretsManager:
      kmsKeyID: "arn:aws:kms:ap-southeast-2:123456789012:key/mrk-org-mandatory"
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# AC-2: globalSecretsManagerConfig with mandatory.kmsKeyID (level 3).
# Used alongside 01-global-kpc to verify L1 wins over L3.
apiVersion: aws.kropath.run/v1alpha1
kind: SecretsManagerConfig
metadata:
  name: ac2-general-policy
  namespace: kro-system
spec:
  mandatory:
    kmsKeyID: "arn:aws:kms:ap-southeast-2:123456789012:key/mrk-smcfg-l3"
  defaults: {}
---
# Shared empty local SecretsManagerConfig — governance comes from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: SecretsManagerConfig
metadata:
  name: ac2-general-policy
  namespace: secrets-prod
spec:
  mandatory: {}
  defaults: {}
