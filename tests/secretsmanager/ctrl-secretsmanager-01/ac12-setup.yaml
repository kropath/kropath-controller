# AC-12 (KPC tags): globalKropathConfig.mandatory.tags for union-merge test.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac12-general-policy
  namespace: kro-system
spec:
  mandatory:
    tags:
      cost-centre: "security"
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# AC-12 (SMCfg tags): globalSecretsManagerConfig.mandatory.tags for union-merge.
apiVersion: aws.kropath.run/v1alpha1
kind: SecretsManagerConfig
metadata:
  name: ac12-general-policy
  namespace: kro-system
spec:
  mandatory:
    tags:
      resource-type: "secret"
  defaults: {}
---
# Shared empty local SecretsManagerConfig — governance comes from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: SecretsManagerConfig
metadata:
  name: ac12-general-policy
  namespace: secrets-prod
spec:
  mandatory: {}
  defaults: {}
