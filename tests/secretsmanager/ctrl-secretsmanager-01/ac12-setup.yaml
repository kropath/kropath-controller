# AC-12 (KPC tags): globalKropathConfig.mandatory.tags for union-merge test.
apiVersion: v1
kind: Namespace
metadata:
  name: ac12-secretsmanager-global-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac12-secretsmanager-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac12-secretsmanager-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac12-secretsmanager-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac12-secretsmanager-global-ns
spec:
  mandatory:
    tags:
      cost-centre: "security"
---
# AC-12 (SMCfg tags): globalSecretsManagerConfig.mandatory.tags for union-merge.
apiVersion: aws.kropath.run/v1alpha1
kind: SecretsManagerConfig
metadata:
  name: ac12-general-policy
  namespace: ac12-secretsmanager-global-ns
spec:
  mandatory:
    tags:
      resource-type: "secret"
  defaults: {}
---
# Shared empty local SecretsManagerConfig — governance comes from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: SecretsManagerConfig
metadata:
  name: ac12-general-policy
  namespace: ac12-secretsmanager-app-ns
spec:
  mandatory: {}
  defaults: {}
