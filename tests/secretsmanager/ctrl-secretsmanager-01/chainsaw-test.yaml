# ctrl-secretsmanager-01 Chainsaw integration tests — all 15 acceptance criteria.
# Requires:
#   - kind cluster with kropath-operator deployed
#   - KropathConfig CRD applied (crds/kropathconfig.yaml from kropath-aws)
#   - SecretsManagerConfig CRD applied (from kropath-aws/crds/secretsmanagerconfig.yaml, KRO-250)
#   - Run: cd tests && make setup && make test-secretsmanager
#
# Test isolation — unique name per step, no inter-step deletes:
#   Each step owns a distinct set of resource names (ac<N>-*). The controller
#   pairs a namespaced config with its kro-system counterpart by *name*, so a
#   per-step name isolates each step completely — no step can shadow another,
#   in either direction, regardless of order. That removes the need for the
#   per-step cleanup deletes and inline reset steps this suite used to carry.
#   See kropath-aws docs/frequent-rgd-errors.md §6 for the full rationale.
#
#   Unlike that reference, this suite does NOT set skipDelete. Chainsaw's
#   end-of-test cleanup is cheap here — these are plain config CRs with no
#   finalizers and no cloud calls, so there is no deletion queue to back up,
#   which is the only reason skipDelete is mandated there. Letting Chainsaw
#   reclaim each suite's objects keeps the shared kind cluster small; leaving
#   every suite's objects behind for a whole run puts enough reconcile load on
#   the API server to trip the test client's rate limiter in later suites.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-secretsmanager-01-cascade
spec:
  namespace: secrets-prod
  steps:
    # AC-1: globalKropathConfig.mandatory.secretsManager.kmsKeyID (level 1) propagates.
    - name: ac1-global-kpc-mandatory-kmskey-level1
      try:
        - apply:
            file: ac01-setup.yaml
        - assert:
            file: ac01-assert.yaml
            timeout: 30s

    # AC-2: KropathConfig.mandatory.kmsKeyID (L1) wins over
    # globalSecretsManagerConfig.mandatory.kmsKeyID (L3).
    - name: ac2-kpc-L1-wins-smcfg-L3
      try:
        - apply:
            file: ac02-setup.yaml
        - assert:
            file: ac02-assert.yaml
            timeout: 30s

    # AC-3: globalSecretsManagerConfig.defaults.kmsKeyID (level 7) propagates;
    # mandatory.kmsKeyID stays empty.
    - name: ac3-global-smcfg-defaults-kmskey-level7
      try:
        - apply:
            file: ac03-setup.yaml
        - assert:
            file: ac03-assert.yaml
            timeout: 30s

    # AC-4: globalSecretsManagerConfig.mandatory.kmsKeyID (L3) wins over
    # localSecretsManagerConfig.mandatory.kmsKeyID (L4).
    # Delete the KropathConfig first: Chainsaw defers all cleanups to end-of-test,
    # so the AC-2 KropathConfig (L1, highest priority) is still present here.
    # Without deleting it, L1 wins and the L3-vs-L4 assertion fails.
    - name: ac4-global-smcfg-L3-wins-local-L4
      try:
        - apply:
            file: ac04-setup.yaml
        - assert:
            file: ac04-assert.yaml
            timeout: 30s

    # AC-5: globalSecretsManagerConfig.mandatory.replicaRegions (level 3) propagates.
    - name: ac5-global-smcfg-mandatory-replicaregions-level3
      try:
        - apply:
            file: ac05-setup.yaml
        - assert:
            file: ac05-assert.yaml
            timeout: 30s

    # AC-6: replicaRegions uses PRIORITY REPLACEMENT. L3 wins over L4; arrays are
    # NOT merged additively. Result must be [{us-west-2}] only.
    - name: ac6-replicaregions-priority-replacement-not-additive
      try:
        - apply:
            file: ac06-setup.yaml
        - assert:
            file: ac06-assert.yaml
            timeout: 30s

    # AC-7: globalSecretsManagerConfig.defaults.replicaRegions (level 7) propagates;
    # mandatory.replicaRegions stays empty.
    - name: ac7-global-smcfg-defaults-replicaregions-level7
      try:
        - apply:
            file: ac07-setup.yaml
        - assert:
            file: ac07-assert.yaml
            timeout: 30s

    # AC-8: globalSecretsManagerConfig.mandatory.forceOverwriteReplicaSecret=true
    # (level 3) propagates to effectiveConfig.mandatory.
    - name: ac8-global-smcfg-mandatory-forceoverwrite-level3
      try:
        - apply:
            file: ac08-setup.yaml
        - assert:
            file: ac08-assert.yaml
            timeout: 30s

    # AC-9: globalKropathConfig.defaults.secretsManager.kmsKeyID (level 9) propagates.
    # Delete the KropathConfig in try to prevent defaults.secretsManager.kmsKeyID
    # leaking into later ACs (follows the SQS AC-5 pattern).
    - name: ac9-global-kpc-defaults-kmskey-level9
      try:
        - apply:
            file: ac09-setup.yaml
        - assert:
            file: ac09-assert.yaml
            timeout: 30s

    # AC-10: globalSecretsManagerConfig.defaults.namingTemplate (level 7) propagates.
    - name: ac10-global-smcfg-defaults-naming-level7
      try:
        - apply:
            file: ac10-setup.yaml
        - assert:
            file: ac10-assert.yaml
            timeout: 30s

    # AC-11: globalSecretsManagerConfig.mandatory.namingTemplate (level 3) propagates.
    - name: ac11-global-smcfg-mandatory-naming-level3
      try:
        - apply:
            file: ac11-setup.yaml
        - assert:
            file: ac11-assert.yaml
            timeout: 30s

    # AC-12: KropathConfig.mandatory.tags and SecretsManagerConfig.mandatory.tags
    # are union-merged into effCfg.mandatory.tags.
    - name: ac12-tag-union-merge
      try:
        - apply:
            file: ac12-setup.yaml
        - assert:
            file: ac12-assert.yaml
            timeout: 30s

    # AC-13: globalSecretsManagerConfig.mandatory.syncedLabels (level 3) propagates.
    - name: ac13-global-smcfg-synced-labels
      try:
        - apply:
            file: ac13-setup.yaml
        - assert:
            file: ac13-assert.yaml
            timeout: 30s

    # AC-14: globalKropathConfig.spec.aws.region and accountId propagate to
    # effCfg.aws.region and effCfg.aws.accountId.
    - name: ac14-provider-identity-propagates
      try:
        - apply:
            file: ac14-setup.yaml
        - assert:
            file: ac14-assert.yaml
            timeout: 30s

    # AC-15 (negative): KropathConfig with BOTH mandatory.secretsManager.kmsKeyID AND
    # defaults.secretsManager.kmsKeyID set must be rejected by the CEL
    # x-kubernetes-validations rule on the KropathConfig CRD.
    - name: ac15-cel-mutual-exclusivity-rejects-both-tiers
      try:
        - script:
            content: "OUTPUT=$(kubectl apply -f \"$(dirname \"$0\")/33-kpc-mutual-exclusivity-invalid.yaml\"\
              \ 2>&1)\nEXIT_CODE=$?\nif [ $EXIT_CODE -ne 0 ]; then\n  echo \"PASS: API server\
              \ correctly rejected the resource.\"\n  echo \"$OUTPUT\"\n  exit 0\nfi\necho \"\
              FAIL: resource was accepted when CEL validation should have rejected it.\"\necho\
              \ \"$OUTPUT\"\nkubectl delete -f \"$(dirname \"$0\")/33-kpc-mutual-exclusivity-invalid.yaml\"\
              \ 2>/dev/null || true\nexit 1\n"
