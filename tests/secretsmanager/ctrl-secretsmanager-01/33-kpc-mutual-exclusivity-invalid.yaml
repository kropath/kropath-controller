# AC-15 (negative): KropathConfig with BOTH mandatory and defaults secretsManager.kmsKeyID
# set. The CEL x-kubernetes-validations rule must reject this.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: invalid-policy
  namespace: kro-system
spec:
  mandatory:
    secretsManager:
      kmsKeyID: "arn:aws:kms:ap-southeast-2:123456789012:key/mrk-mandatory"
  defaults:
    secretsManager:
      kmsKeyID: "arn:aws:kms:ap-southeast-2:123456789012:key/mrk-defaults"
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
