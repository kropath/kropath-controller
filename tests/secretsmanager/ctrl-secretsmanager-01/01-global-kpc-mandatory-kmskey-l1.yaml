# AC-1: globalKropathConfig with mandatory.secretsManager.kmsKeyID (level 1).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: general-policy
  namespace: kro-system
spec:
  mandatory:
    secretsManager:
      kmsKeyID: "arn:aws:kms:ap-southeast-2:123456789012:key/mrk-org-mandatory"
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
