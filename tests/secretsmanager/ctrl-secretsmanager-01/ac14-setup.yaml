# AC-14: globalKropathConfig.spec.aws.accountId and .region propagate to effCfg.aws.*.
apiVersion: v1
kind: Namespace
metadata:
  name: ac14-secretsmanager-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac14-secretsmanager-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac14-secretsmanager-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac14-secretsmanager-global-ns
spec:
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Shared empty local SecretsManagerConfig — governance comes from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: SecretsManagerConfig
metadata:
  name: ac14-general-policy
  namespace: ac14-secretsmanager-app-ns
spec:
  mandatory: {}
  defaults: {}
