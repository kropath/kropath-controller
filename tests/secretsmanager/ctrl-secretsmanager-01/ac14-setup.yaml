# AC-14: globalKropathConfig.spec.aws.accountId and .region propagate to effCfg.aws.*.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac14-general-policy
  namespace: kro-system
spec:
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Shared empty local SecretsManagerConfig — governance comes from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: SecretsManagerConfig
metadata:
  name: ac14-general-policy
  namespace: secrets-prod
spec:
  mandatory: {}
  defaults: {}
