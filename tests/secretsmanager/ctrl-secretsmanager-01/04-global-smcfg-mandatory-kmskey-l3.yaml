# AC-2: globalSecretsManagerConfig with mandatory.kmsKeyID (level 3).
# Used alongside 01-global-kpc to verify L1 wins over L3.
apiVersion: aws.kropath.run/v1alpha1
kind: SecretsManagerConfig
metadata:
  name: general-policy
  namespace: kro-system
spec:
  mandatory:
    kmsKeyID: "arn:aws:kms:ap-southeast-2:123456789012:key/mrk-smcfg-l3"
  defaults: {}
