# AC-3: globalSecretsManagerConfig with defaults.kmsKeyID only (level 7).
# Explicitly zero mandatory.kmsKeyID so SSA claims ownership and clears any
# value left by a prior apply (prevents CEL mutual-exclusivity false-positive
# when AC-2 cleanup has a timing race with AC-3 start).
apiVersion: aws.kropath.run/v1alpha1
kind: SecretsManagerConfig
metadata:
  name: ac3-general-policy
  namespace: kro-system
spec:
  mandatory:
    kmsKeyID: ""
  defaults:
    kmsKeyID: "alias/sm-default-key"
---
# Shared empty local SecretsManagerConfig — governance comes from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: SecretsManagerConfig
metadata:
  name: ac3-general-policy
  namespace: secrets-prod
spec:
  mandatory: {}
  defaults: {}
