# AC-9: globalKropathConfig.defaults.secretsManager.kmsKeyID (level 9) propagates.
apiVersion: v1
kind: Namespace
metadata:
  name: ac09-secretsmanager-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac09-secretsmanager-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac09-secretsmanager-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac09-secretsmanager-global-ns
spec:
  defaults:
    secretsManager:
      kmsKeyID: "alias/org-default-key"
---
# Shared empty local SecretsManagerConfig — governance comes from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: SecretsManagerConfig
metadata:
  name: ac9-general-policy
  namespace: ac09-secretsmanager-app-ns
spec:
  mandatory: {}
  defaults: {}
