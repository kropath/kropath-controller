# AC-1: globalKropathConfig with mandatory.secretsManager.kmsKeyID (level 1).
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-secretsmanager-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-secretsmanager-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac01-secretsmanager-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac01-secretsmanager-global-ns
spec:
  mandatory:
    secretsManager:
      kmsKeyID: "arn:aws:kms:ap-southeast-2:123456789012:key/mrk-org-mandatory"
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Shared empty local SecretsManagerConfig — governance comes from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: SecretsManagerConfig
metadata:
  name: ac1-general-policy
  namespace: ac01-secretsmanager-app-ns
spec:
  mandatory: {}
  defaults: {}
