# AC-10: globalSecretsManagerConfig.defaults.namingTemplate (level 7) propagates.
apiVersion: aws.kropath.run/v1alpha1
kind: SecretsManagerConfig
metadata:
  name: ac10-general-policy
  namespace: kro-system
spec:
  mandatory: {}
  defaults:
    namingTemplate: "{namespace}-{name}"
---
# Shared empty local SecretsManagerConfig — governance comes from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: SecretsManagerConfig
metadata:
  name: ac10-general-policy
  namespace: secrets-prod
spec:
  mandatory: {}
  defaults: {}
