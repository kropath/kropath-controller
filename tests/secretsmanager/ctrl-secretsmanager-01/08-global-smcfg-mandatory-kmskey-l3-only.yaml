# AC-4: globalSecretsManagerConfig.mandatory.kmsKeyID (L3) wins over local (L4).
# Explicitly zero defaults.kmsKeyID so SSA claims and clears any residual value
# from AC-3's defaults-only fixture (prevents CEL mutual-exclusivity race).
apiVersion: aws.kropath.run/v1alpha1
kind: SecretsManagerConfig
metadata:
  name: general-policy
  namespace: kro-system
spec:
  mandatory:
    kmsKeyID: "arn:aws:kms:ap-southeast-2:123456789012:key/mrk-global-l3"
  defaults:
    kmsKeyID: ""
