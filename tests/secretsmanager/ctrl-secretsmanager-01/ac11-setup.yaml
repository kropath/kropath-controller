# AC-11: globalSecretsManagerConfig.mandatory.namingTemplate (level 3) propagates.
apiVersion: aws.kropath.run/v1alpha1
kind: SecretsManagerConfig
metadata:
  name: ac11-general-policy
  namespace: kro-system
spec:
  mandatory:
    namingTemplate: "{namespace}-{configRef}-{name}"
  defaults: {}
---
# Shared empty local SecretsManagerConfig — governance comes from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: SecretsManagerConfig
metadata:
  name: ac11-general-policy
  namespace: secrets-prod
spec:
  mandatory: {}
  defaults: {}
