# AC-9: globalKropathConfig.defaults.secretsManager.kmsKeyID (level 9) propagates.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: general-policy
  namespace: kro-system
spec:
  defaults:
    secretsManager:
      kmsKeyID: "alias/org-default-key"
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
