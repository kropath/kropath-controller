# AC-6 (global L3): replicaRegions for priority-replacement test.
# L3 = [{us-west-2}]; L4 = [{eu-west-1}] — result must be [{us-west-2}], NOT both.
apiVersion: aws.kropath.run/v1alpha1
kind: SecretsManagerConfig
metadata:
  name: general-policy
  namespace: kro-system
spec:
  mandatory:
    replicaRegions:
      - region: "us-west-2"
  defaults: {}
