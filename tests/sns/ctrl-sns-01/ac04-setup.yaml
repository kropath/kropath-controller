# AC-4: globalKropathConfig with mandatory.sns.signatureVersion="2" (level 1).
apiVersion: v1
kind: Namespace
metadata:
  name: ac04-sns-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac04-sns-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac04-sns-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac04-sns-global-ns
spec:
  mandatory:
    sns:
      signatureVersion: "2"
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Base local SNSConfig in events-prod — empty mandatory and defaults.
# Reused across multiple AC steps as the namespaced resource under test.
apiVersion: aws.kropath.run/v1alpha1
kind: SNSConfig
metadata:
  name: ac4-general-policy
  namespace: ac04-sns-app-ns
spec:
  mandatory: {}
  defaults: {}
