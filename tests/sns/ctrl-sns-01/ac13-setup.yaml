# AC-13: globalKropathConfig with aws.region and aws.accountId set.
apiVersion: v1
kind: Namespace
metadata:
  name: ac13-sns-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac13-sns-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac13-sns-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac13-sns-global-ns
spec:
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Base local SNSConfig in events-prod — empty mandatory and defaults.
# Reused across multiple AC steps as the namespaced resource under test.
apiVersion: aws.kropath.run/v1alpha1
kind: SNSConfig
metadata:
  name: ac13-general-policy
  namespace: ac13-sns-app-ns
spec:
  mandatory: {}
  defaults: {}
