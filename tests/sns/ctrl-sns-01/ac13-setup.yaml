# AC-13: globalKropathConfig with aws.region and aws.accountId set.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac13-general-policy
  namespace: kro-system
spec:
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Base local SNSConfig in events-prod — empty mandatory and defaults.
# Reused across multiple AC steps as the namespaced resource under test.
apiVersion: aws.kropath.run/v1alpha1
kind: SNSConfig
metadata:
  name: ac13-general-policy
  namespace: events-prod
spec:
  mandatory: {}
  defaults: {}
