# Assert AC-2: mandatory.kmsMasterKeyId from level-3 globalSNSConfig.
apiVersion: aws.kropath.run/v1alpha1
kind: SNSConfig
metadata:
  name: ac2-general-policy
  namespace: events-prod
status:
  effectiveConfig:
    mandatory:
      kmsMasterKeyId: "arn:aws:kms:ap-southeast-2:123456789012:key/org-key"
