# AC-7: globalSNSConfig with mandatory.dataProtectionPolicy (level 3).
apiVersion: aws.kropath.run/v1alpha1
kind: SNSConfig
metadata:
  name: ac7-general-policy
  namespace: kro-system
spec:
  mandatory:
    dataProtectionPolicy: '{"Name":"org-policy","Statements":[]}'
  defaults: {}
---
# Base local SNSConfig in events-prod — empty mandatory and defaults.
# Reused across multiple AC steps as the namespaced resource under test.
apiVersion: aws.kropath.run/v1alpha1
kind: SNSConfig
metadata:
  name: ac7-general-policy
  namespace: events-prod
spec:
  mandatory: {}
  defaults: {}
