# AC-5: globalKropathConfig with defaults.sns.signatureVersion="1" (level 9).
# Level 7 (globalSNSConfig.defaults) should win over level 9.
apiVersion: v1
kind: Namespace
metadata:
  name: ac05-sns-global-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac05-sns-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac05-sns-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac05-sns-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac05-sns-global-ns
spec:
  defaults:
    sns:
      signatureVersion: "1"
---
# AC-5: globalSNSConfig with defaults.signatureVersion="2" (level 7).
apiVersion: aws.kropath.run/v1alpha1
kind: SNSConfig
metadata:
  name: ac5-general-policy
  namespace: ac05-sns-global-ns
spec:
  mandatory: {}
  defaults:
    signatureVersion: "2"
---
# Base local SNSConfig in events-prod — empty mandatory and defaults.
# Reused across multiple AC steps as the namespaced resource under test.
apiVersion: aws.kropath.run/v1alpha1
kind: SNSConfig
metadata:
  name: ac5-general-policy
  namespace: ac05-sns-app-ns
spec:
  mandatory: {}
  defaults: {}
