# AC-4: globalKropathConfig with mandatory.sns.signatureVersion="2" (level 1).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: general-policy
  namespace: kro-system
spec:
  mandatory:
    sns:
      signatureVersion: "2"
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
