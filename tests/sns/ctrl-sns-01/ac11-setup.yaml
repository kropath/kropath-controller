# AC-11: globalKropathConfig with mandatory.tags (tier-level tags, level 1).
apiVersion: v1
kind: Namespace
metadata:
  name: ac11-sns-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac11-sns-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac11-sns-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac11-sns-global-ns
spec:
  mandatory:
    tags:
      cost-centre: infra
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# AC-11: localSNSConfig with mandatory.tags (SNSConfig config-level tags, level 4).
apiVersion: aws.kropath.run/v1alpha1
kind: SNSConfig
metadata:
  name: ac11-general-policy
  namespace: ac11-sns-app-ns
spec:
  mandatory:
    tags:
      topic-type: messaging
  defaults: {}
