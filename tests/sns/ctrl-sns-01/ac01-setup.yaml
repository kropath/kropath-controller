# AC-1: globalKropathConfig with mandatory.sns.kmsMasterKeyId (level 1).
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-sns-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-sns-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac01-sns-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac01-sns-global-ns
spec:
  mandatory:
    sns:
      kmsMasterKeyId: "arn:aws:kms:ap-southeast-2:123456789012:key/org-key"
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Base local SNSConfig in events-prod — empty mandatory and defaults.
# Reused across multiple AC steps as the namespaced resource under test.
apiVersion: aws.kropath.run/v1alpha1
kind: SNSConfig
metadata:
  name: ac1-general-policy
  namespace: ac01-sns-app-ns
spec:
  mandatory: {}
  defaults: {}
