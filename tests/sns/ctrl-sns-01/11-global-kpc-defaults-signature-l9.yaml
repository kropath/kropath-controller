# AC-5: globalKropathConfig with defaults.sns.signatureVersion="1" (level 9).
# Level 7 (globalSNSConfig.defaults) should win over level 9.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: general-policy
  namespace: kro-system
spec:
  defaults:
    sns:
      signatureVersion: "1"
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
