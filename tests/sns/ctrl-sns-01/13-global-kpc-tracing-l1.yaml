# AC-6: globalKropathConfig with mandatory.sns.tracingConfig="Active" (level 1).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: general-policy
  namespace: kro-system
spec:
  mandatory:
    sns:
      tracingConfig: "Active"
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
