# Assert AC-8: mandatory.deliveryFeedback.http from level-3 globalSNSConfig.
apiVersion: aws.kropath.run/v1alpha1
kind: SNSConfig
metadata:
  name: ac8-general-policy
  namespace: events-prod
status:
  effectiveConfig:
    mandatory:
      deliveryFeedback:
        http:
          successFeedbackRoleArn: "arn:aws:iam::123456789012:role/http-success"
          failureFeedbackRoleArn: "arn:aws:iam::123456789012:role/http-failure"
          successFeedbackSampleRate: "100"
