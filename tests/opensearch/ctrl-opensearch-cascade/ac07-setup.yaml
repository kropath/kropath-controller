apiVersion: v1
kind: Namespace
metadata:
  name: ac07-opensearch-global-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac07-opensearch-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac07-opensearch-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac07-opensearch-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
# AC-7: Tags union-merged from KropathConfig.mandatory.tags (level 1) and
# OpenSearchConfig.mandatory.tags (level 3) into effectiveConfig.mandatory.tags.
# Level-1 wins on key conflict.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac07-opensearch-global-ns
spec:
  mandatory:
    tags:
      cost-centre: infra
      owner: platform
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Global OpenSearchConfig: tags at level 3 add "team" and contest "cost-centre".
apiVersion: aws.kropath.run/v1alpha1
kind: OpenSearchConfig
metadata:
  name: ac7-os-policy
  namespace: ac07-opensearch-global-ns
spec:
  mandatory:
    tags:
      cost-centre: payments
      team: search
---
# Local OpenSearchConfig — mandatory empty.
apiVersion: aws.kropath.run/v1alpha1
kind: OpenSearchConfig
metadata:
  name: ac7-os-policy
  namespace: ac07-opensearch-app-ns
spec:
  mandatory: {}
  defaults: {}
