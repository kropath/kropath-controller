apiVersion: v1
kind: Namespace
metadata:
  name: ac06-opensearch-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac06-opensearch-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac06-opensearch-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
# AC-6: No KropathConfig.opensearch section; global OpenSearchConfig.mandatory.engineVersion
# (level 3; profile-only — no KropathConfig equivalent) propagates.
# KropathConfig exists only to provide AWS identity.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac06-opensearch-global-ns
spec:
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Global OpenSearchConfig in kro-system with engineVersion (level 3).
apiVersion: aws.kropath.run/v1alpha1
kind: OpenSearchConfig
metadata:
  name: ac6-os-policy
  namespace: ac06-opensearch-global-ns
spec:
  mandatory:
    engineVersion: "OpenSearch_2.9"
---
# Local OpenSearchConfig — mandatory empty, triggering reconcile.
apiVersion: aws.kropath.run/v1alpha1
kind: OpenSearchConfig
metadata:
  name: ac6-os-policy
  namespace: ac06-opensearch-app-ns
spec:
  mandatory: {}
  defaults: {}
