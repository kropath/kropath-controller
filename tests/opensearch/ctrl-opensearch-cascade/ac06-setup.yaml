# AC-6: No KropathConfig.opensearch section; global OpenSearchConfig.mandatory.engineVersion
# (level 3; profile-only — no KropathConfig equivalent) propagates.
# KropathConfig exists only to provide AWS identity.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac6-os-policy
  namespace: kro-system
spec:
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Global OpenSearchConfig in kro-system with engineVersion (level 3).
apiVersion: aws.kropath.run/v1alpha1
kind: OpenSearchConfig
metadata:
  name: ac6-os-policy
  namespace: kro-system
spec:
  mandatory:
    engineVersion: "OpenSearch_2.9"
---
# Local OpenSearchConfig — mandatory empty, triggering reconcile.
apiVersion: aws.kropath.run/v1alpha1
kind: OpenSearchConfig
metadata:
  name: ac6-os-policy
  namespace: payments-prod
spec:
  mandatory: {}
  defaults: {}
