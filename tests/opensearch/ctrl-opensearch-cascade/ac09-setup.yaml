apiVersion: v1
kind: Namespace
metadata:
  name: ac09-opensearch-global-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac09-opensearch-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac09-opensearch-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac09-opensearch-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
# AC-9: syncedLabels union-merged from OSCfg levels only (no KropathConfig.opensearch equivalent).
# Global OSCfg.mandatory.syncedLabels (level 3) and local OSCfg.mandatory.syncedLabels (level 4)
# are union-merged; level 3 wins on key conflict.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac09-opensearch-global-ns
spec: {}
---
# Global OpenSearchConfig: syncedLabels at level 3. "data-class" wins over local level 4.
apiVersion: aws.kropath.run/v1alpha1
kind: OpenSearchConfig
metadata:
  name: ac9-os-policy
  namespace: ac09-opensearch-global-ns
spec:
  mandatory:
    syncedLabels:
      team: platform
      data-class: public
---
# Local OpenSearchConfig: syncedLabels at level 4.
# "region" is additive; "data-class" loses to level 3.
apiVersion: aws.kropath.run/v1alpha1
kind: OpenSearchConfig
metadata:
  name: ac9-os-policy
  namespace: ac09-opensearch-app-ns
spec:
  mandatory:
    syncedLabels:
      data-class: internal
      region: ap-se-2
  defaults: {}
