apiVersion: v1
kind: Namespace
metadata:
  name: ac08-opensearch-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac08-opensearch-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac08-opensearch-global-ns
---
# AC-8: Two OpenSearchConfig CRs exist — global (kro-system) and local (payments-prod).
# Controller pairs local CR with same-name global CR by name.
# Global mandatory has encryptionAtRestEnabled=true (level 3),
# local defaults has enforceHTTPS=true (level 6).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac08-opensearch-global-ns
spec:
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Global OpenSearchConfig (level 3 mandatory).
apiVersion: aws.kropath.run/v1alpha1
kind: OpenSearchConfig
metadata:
  name: ac8-os-policy
  namespace: ac08-opensearch-global-ns
spec:
  mandatory:
    encryptionAtRestEnabled: true
    nodeToNodeEncryptionEnabled: true
---
# Local OpenSearchConfig (level 4 mandatory, level 6 defaults).
apiVersion: aws.kropath.run/v1alpha1
kind: OpenSearchConfig
metadata:
  name: ac8-os-policy
  namespace: ac08-opensearch-app-ns
spec:
  mandatory: {}
  defaults:
    enforceHTTPS: true
    tlsSecurityPolicy: "Policy-Min-TLS-1-2-2019-07"
