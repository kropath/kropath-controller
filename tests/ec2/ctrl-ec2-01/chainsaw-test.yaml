# ctrl-ec2-01 Chainsaw integration tests — all 15 acceptance criteria.
# Requires:
#   - kind cluster with kropath-operator deployed
#   - KropathConfig CRD applied (crds/kropathconfig.yaml from kropath-aws)
#   - EC2Config CRD applied (crds/ec2config.yaml from kropath-aws)
#
# Test isolation — unique name per step, no inter-step deletes:
#   Each step owns a distinct set of resource names (ac<N>-*). The controller
#   pairs a namespaced config with its kro-system counterpart by *name*, so a
#   per-step name isolates each step completely — no step can shadow another,
#   in either direction, regardless of order. That removes the need for the
#   per-step cleanup deletes and inline reset steps this suite used to carry.
#   See kropath-aws docs/frequent-rgd-errors.md §6 for the full rationale.
#
#   Unlike that reference, this suite does NOT set skipDelete. Chainsaw's
#   end-of-test cleanup is cheap here — these are plain config CRs with no
#   finalizers and no cloud calls, so there is no deletion queue to back up,
#   which is the only reason skipDelete is mandated there. Letting Chainsaw
#   reclaim each suite's objects keeps the shared kind cluster small; leaving
#   every suite's objects behind for a whole run puts enough reconcile load on
#   the API server to trip the test client's rate limiter in later suites.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-ec2-01-cascade
spec:
  steps:
    # AC-1: globalKropathConfig.mandatory.ec2.flowLogsRequired=true propagates
    # to EC2Config.status.effectiveConfig.mandatory.flowLogsRequired=true.
    - name: ac1-kc-mandatory-flowlogs
      try:
        - apply:
            file: ac01-setup.yaml
        - assert:
            file: ac01-assert.yaml
            timeout: 30s

    # AC-2: globalKropathConfig.mandatory.ec2.imdsv2Required=true propagates.
    - name: ac2-kc-mandatory-imdsv2
      try:
        - apply:
            file: ac02-setup.yaml
        - assert:
            file: ac02-assert.yaml
            timeout: 30s

    # AC-3: globalKropathConfig.mandatory.ec2.ebsEncryptionRequired=true propagates.
    - name: ac3-kc-mandatory-ebs-encryption
      try:
        - apply:
            file: ac03-setup.yaml
        - assert:
            file: ac03-assert.yaml
            timeout: 30s

    # AC-4: KropathConfig.mandatory.ec2.flowLogsRequired=true (L1) wins over
    # globalEC2Config.mandatory.flowLogsRequired=false (L3).
    - name: ac4-kc-wins-over-ec2config
      try:
        - apply:
            file: ac04-setup.yaml
        - assert:
            file: ac04-assert.yaml
            timeout: 30s

    # AC-5: KropathConfig.mandatory.ec2.imdsv2Required=true (L1) wins over
    # globalEC2Config.mandatory.imdsv2Required=false (L3).
    - name: ac5-kc-wins-imdsv2
      try:
        - apply:
            file: ac05-setup.yaml
        - assert:
            file: ac05-assert.yaml
            timeout: 30s

    # AC-6: globalEC2Config.mandatory.restrictPublicIpOnLaunch=true propagates (EC2Config-only field).
    - name: ac6-ec2config-only-field
      try:
        - apply:
            file: ac06-setup.yaml
        - assert:
            file: ac06-assert.yaml
            timeout: 30s

    # AC-7: globalEC2Config.mandatory.ebsDefaultKmsKeyId propagates.
    - name: ac7-ec2config-kms-key
      try:
        - apply:
            file: ac07-setup.yaml
        - assert:
            file: ac07-assert.yaml
            timeout: 30s

    # AC-8: globalEC2Config.defaults.allowSourceDestCheckDisable=true propagates.
    - name: ac8-ec2config-defaults-sourcedest
      try:
        - apply:
            file: ac08-setup.yaml
        - assert:
            file: ac08-assert.yaml
            timeout: 30s

    # AC-9: Only EC2Config.defaults.imdsv2Required=true set; mandatory stays false.
    # Delete the KropathConfig first — cleanup is deferred to test end so the stale
    # KropathConfig from ac5 (mandatory.ec2.imdsv2Required=true) would otherwise make
    # mandatory.imdsv2Required appear true when only defaults are set.
    - name: ac9-defaults-only
      try:
        - apply:
            file: ac09-setup.yaml
        - assert:
            file: ac09-assert.yaml
            timeout: 30s

    # AC-10: globalEC2Config.defaults.flowLogsRequired=true (L7) wins over
    # globalKropathConfig.defaults.ec2.flowLogsRequired=true (L9) — more specific wins.
    - name: ac10-defaults-priority
      try:
        - apply:
            file: ac10-setup.yaml
        - assert:
            file: ac10-assert.yaml
            timeout: 30s

    # AC-11: globalKropathConfig.mandatory.ec2.flowLogsRequired=true (L1) wins even
    # when localKropathConfig.mandatory.ec2.flowLogsRequired=false (L2, zero).
    # Cleanup is deferred to test end, so the KropathConfig from ac10 (with
    # defaults.ec2.flowLogsRequired=true) is still alive here. Delete it explicitly
    # before applying the mandatory version to avoid a mutual-exclusivity violation.
    - name: ac11-global-mandatory-wins
      try:
        - apply:
            file: ac11-setup.yaml
        - assert:
            file: ac11-assert.yaml
            timeout: 30s

    # AC-12: KropathConfig.mandatory.tags and EC2Config.mandatory.tags are union-merged.
    - name: ac12-tag-merge
      try:
        - apply:
            file: ac12-setup.yaml
        - assert:
            file: ac12-assert.yaml
            timeout: 30s

    # AC-13: KropathConfig.mandatory.syncedLabels propagates to effCfg.mandatory.syncedLabels;
    # EC2Config.defaults.syncedLabels propagates to effCfg.defaults.syncedLabels.
    - name: ac13-synced-labels-merge
      try:
        - apply:
            file: ac13-setup.yaml
        - assert:
            file: ac13-assert.yaml
            timeout: 30s

    # AC-14: KropathConfig with both mandatory.ec2.flowLogsRequired=true and
    # defaults.ec2.flowLogsRequired=true is rejected at admission.
    - name: ac14-kc-mutual-exclusivity
      try:
        - apply:
            file: ac14-setup-1.yaml
            expect:
            - match:
                apiVersion: aws.kropath.run/v1alpha1
                kind: KropathConfig
              check:
                ($error != null): true

    # AC-15: globalKropathConfig.spec.aws.region and accountId propagate
    # to effCfg.aws.region and effCfg.aws.accountId.
    - name: ac15-aws-metadata
      try:
        - apply:
            file: ac15-setup.yaml
        - assert:
            file: ac15-assert.yaml
            timeout: 30s
