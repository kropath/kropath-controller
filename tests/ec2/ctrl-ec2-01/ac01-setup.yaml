apiVersion: v1
kind: Namespace
metadata:
  name: ac01-ec2-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-ec2-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac01-ec2-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac01-ec2-global-ns
spec:
  mandatory:
    ec2:
      flowLogsRequired: true
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: EC2Config
metadata:
  name: ac1-general-policy
  namespace: ac01-ec2-app-ns
  labels:
    aws.kropath.run/resource-name: ac1-general-policy
spec:
  mandatory: {}
  defaults: {}
