apiVersion: v1
kind: Namespace
metadata:
  name: ac13-ec2-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac13-ec2-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac13-ec2-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac13-ec2-global-ns
spec:
  mandatory:
    syncedLabels:
      environment: prod
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: EC2Config
metadata:
  name: ac13-general-policy
  namespace: ac13-ec2-app-ns
  labels:
    aws.kropath.run/resource-name: ac13-general-policy
spec:
  mandatory: {}
  defaults:
    syncedLabels:
      team: networking
