apiVersion: v1
kind: Namespace
metadata:
  name: ac12-ec2-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac12-ec2-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac12-ec2-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac12-ec2-global-ns
spec:
  mandatory:
    tags:
      cost-centre: platform
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: EC2Config
metadata:
  name: ac12-general-policy
  namespace: ac12-ec2-app-ns
  labels:
    aws.kropath.run/resource-name: ac12-general-policy
spec:
  mandatory:
    tags:
      resource-type: networking
  defaults: {}
