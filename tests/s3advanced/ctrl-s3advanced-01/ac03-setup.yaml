# AC-C3: KropathConfig.mandatory.s3Advanced.accessPointVpcOnly=true (level 1)
# wins — local S3AdvancedConfig has no mandatory setting for this field.
apiVersion: v1
kind: Namespace
metadata:
  name: ac03-s3advanced-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac03-s3advanced-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac03-s3advanced-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac03-s3advanced-global-ns
spec:
  mandatory:
    s3Advanced:
      accessPointVpcOnly: true
---
apiVersion: aws.kropath.run/v1alpha1
kind: S3AdvancedConfig
metadata:
  name: ac3-s3adv-policy
  namespace: ac03-s3advanced-app-ns
spec:
  mandatory: {}
  defaults: {}
