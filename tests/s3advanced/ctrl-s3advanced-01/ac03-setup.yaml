# AC-C3: KropathConfig.mandatory.s3Advanced.accessPointVpcOnly=true (level 1)
# wins — local S3AdvancedConfig has no mandatory setting for this field.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac3-s3adv-policy
  namespace: kro-system
spec:
  mandatory:
    s3Advanced:
      accessPointVpcOnly: true
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: S3AdvancedConfig
metadata:
  name: ac3-s3adv-policy
  namespace: payments-prod
spec:
  mandatory: {}
  defaults: {}
