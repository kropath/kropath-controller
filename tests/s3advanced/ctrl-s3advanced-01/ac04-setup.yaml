# AC-C4: S3AdvancedConfig.mandatory.filesEncryption.kmsKeyID="alias/my-key" (level 4).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac4-s3adv-policy
  namespace: kro-system
spec:
  mandatory: {}
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: S3AdvancedConfig
metadata:
  name: ac4-s3adv-policy
  namespace: payments-prod
spec:
  mandatory:
    filesEncryption:
      kmsKeyID: "alias/my-key"
  defaults: {}
