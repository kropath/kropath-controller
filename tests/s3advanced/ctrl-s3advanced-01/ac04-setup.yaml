# AC-C4: S3AdvancedConfig.mandatory.filesEncryption.kmsKeyID="alias/my-key" (level 4).
apiVersion: v1
kind: Namespace
metadata:
  name: ac04-s3advanced-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac04-s3advanced-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac04-s3advanced-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac04-s3advanced-global-ns
spec:
  mandatory: {}
---
apiVersion: aws.kropath.run/v1alpha1
kind: S3AdvancedConfig
metadata:
  name: ac4-s3adv-policy
  namespace: ac04-s3advanced-app-ns
spec:
  mandatory:
    filesEncryption:
      kmsKeyID: "alias/my-key"
  defaults: {}
