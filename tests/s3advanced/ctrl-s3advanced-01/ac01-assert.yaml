# Assert AC-C1: defaults.tableBucketEncryption.sseAlgorithm from level-6 local S3AdvancedConfig.
apiVersion: aws.kropath.run/v1alpha1
kind: S3AdvancedConfig
metadata:
  name: ac1-s3adv-policy
  namespace: payments-prod
status:
  effectiveConfig:
    defaults:
      tableBucketEncryption:
        sseAlgorithm: "aws:kms"
