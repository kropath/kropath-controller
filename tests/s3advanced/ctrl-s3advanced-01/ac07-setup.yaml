# AC-C7: KropathConfig.mandatory.s3Advanced.accessPointPublicAccessBlock.blockPublicACLs=true
# (level 1) propagates.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac7-s3adv-policy
  namespace: kro-system
spec:
  mandatory:
    s3Advanced:
      accessPointPublicAccessBlock:
        blockPublicACLs: true
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: S3AdvancedConfig
metadata:
  name: ac7-s3adv-policy
  namespace: payments-prod
spec:
  mandatory: {}
  defaults: {}
