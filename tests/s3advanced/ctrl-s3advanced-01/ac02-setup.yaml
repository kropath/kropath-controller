# AC-C2: S3AdvancedConfig.mandatory.tableBucketEncryption.sseAlgorithm="AES256" (level 4).
apiVersion: v1
kind: Namespace
metadata:
  name: ac02-s3advanced-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac02-s3advanced-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac02-s3advanced-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac02-s3advanced-global-ns
spec:
  mandatory: {}
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: S3AdvancedConfig
metadata:
  name: ac2-s3adv-policy
  namespace: ac02-s3advanced-app-ns
spec:
  mandatory:
    tableBucketEncryption:
      sseAlgorithm: "AES256"
  defaults: {}
