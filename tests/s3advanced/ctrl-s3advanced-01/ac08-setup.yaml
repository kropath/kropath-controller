# AC-C8: Provider identity from globalKropathConfig.spec.aws.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac8-s3adv-policy
  namespace: kro-system
spec:
  mandatory: {}
  aws:
    accountId: "123456789012"
    region: "eu-west-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: S3AdvancedConfig
metadata:
  name: ac8-s3adv-policy
  namespace: payments-prod
spec:
  mandatory: {}
  defaults: {}
