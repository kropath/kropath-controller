# AC-C8: Provider identity from globalKropathConfig.spec.aws.
apiVersion: v1
kind: Namespace
metadata:
  name: ac08-s3advanced-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac08-s3advanced-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac08-s3advanced-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "eu-west-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac08-s3advanced-global-ns
spec:
  mandatory: {}
---
apiVersion: aws.kropath.run/v1alpha1
kind: S3AdvancedConfig
metadata:
  name: ac8-s3adv-policy
  namespace: ac08-s3advanced-app-ns
spec:
  mandatory: {}
  defaults: {}
