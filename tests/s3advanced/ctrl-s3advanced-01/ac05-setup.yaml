# AC-C5: S3AdvancedConfig.defaults.vectorBucketEncryption.sseType="aws:kms" (level 6).
apiVersion: v1
kind: Namespace
metadata:
  name: ac05-s3advanced-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac05-s3advanced-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac05-s3advanced-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac05-s3advanced-global-ns
spec:
  mandatory: {}
---
apiVersion: aws.kropath.run/v1alpha1
kind: S3AdvancedConfig
metadata:
  name: ac5-s3adv-policy
  namespace: ac05-s3advanced-app-ns
spec:
  mandatory: {}
  defaults:
    vectorBucketEncryption:
      sseType: "aws:kms"
