# AC-C1: S3AdvancedConfig.defaults.tableBucketEncryption.sseAlgorithm="aws:kms" (level 6).
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-s3advanced-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-s3advanced-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac01-s3advanced-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac01-s3advanced-global-ns
spec:
  mandatory: {}
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: S3AdvancedConfig
metadata:
  name: ac1-s3adv-policy
  namespace: ac01-s3advanced-app-ns
spec:
  mandatory: {}
  defaults:
    tableBucketEncryption:
      sseAlgorithm: "aws:kms"
