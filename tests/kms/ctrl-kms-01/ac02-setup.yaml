# AC-2: globalKropathConfig mandatory.kms.enableKeyRotation=true (level 1).
apiVersion: v1
kind: Namespace
metadata:
  name: ac02-kms-global-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac02-kms-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac02-kms-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac02-kms-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac02-kms-global-ns
spec:
  mandatory:
    kms:
      enableKeyRotation: true
---
# AC-2: globalKMSConfig mandatory.enableKeyRotation=false (zero value = not enforced, level 3).
apiVersion: aws.kropath.run/v1alpha1
kind: KMSConfig
metadata:
  name: ac2-general-policy
  namespace: ac02-kms-global-ns
spec:
  mandatory:
    enableKeyRotation: false
  defaults:
    enableKeyRotation: false
---
# Shared empty local KMSConfig — all cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: KMSConfig
metadata:
  name: ac2-general-policy
  namespace: ac02-kms-app-ns
spec:
  mandatory: {}
  defaults: {}
