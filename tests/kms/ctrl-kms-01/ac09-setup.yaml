# AC-9: KMSConfig with mandatory.keySpec NOT in mandatory.allowedKeySpecs.
# Controller must set Valid=False and NOT write effectiveConfig.
apiVersion: aws.kropath.run/v1alpha1
kind: KMSConfig
metadata:
  name: ac9-general-policy
  namespace: payments-prod
spec:
  mandatory:
    keySpec: "RSA_2048"
    allowedKeySpecs:
      - "SYMMETRIC_DEFAULT"
  defaults: {}
