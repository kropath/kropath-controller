# AC-7: globalKropathConfig mandatory.kms.allowedKeySpecs (level 1).
apiVersion: v1
kind: Namespace
metadata:
  name: ac07-kms-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac07-kms-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac07-kms-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac07-kms-global-ns
spec:
  mandatory:
    kms:
      allowedKeySpecs:
      - "SYMMETRIC_DEFAULT"
      - "RSA_4096"
---
# Shared empty local KMSConfig — all cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: KMSConfig
metadata:
  name: ac7-general-policy
  namespace: ac07-kms-app-ns
spec:
  mandatory: {}
  defaults: {}
