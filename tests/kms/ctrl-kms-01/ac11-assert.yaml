# Assert AC-11: effectiveConfig written normally when allowedKeySpecs is empty.
apiVersion: aws.kropath.run/v1alpha1
kind: KMSConfig
metadata:
  name: ac11-general-policy
  namespace: payments-prod
status:
  conditions:
    - type: Valid
      status: "True"
      reason: ValidationPassed
    - type: PlacementResolved
      status: "True"
      reason: ResolvedFromNamespace
    - type: GlobalProfileResolved
      status: "False"
      reason: ProfileUnresolved
  effectiveConfig:
    mandatory:
      keySpec: "RSA_4096"
