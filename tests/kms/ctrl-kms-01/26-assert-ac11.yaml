# Assert AC-11: effectiveConfig written normally when allowedKeySpecs is empty.
apiVersion: aws.kropath.run/v1alpha1
kind: AWSKMSConfig
metadata:
  name: general-policy
  namespace: payments-prod
status:
  conditions:
    - type: Valid
      status: "True"
      reason: ValidationPassed
  effectiveConfig:
    mandatory:
      keySpec: "RSA_4096"
