# AC-10: KMSConfig with mandatory.keySpec IN mandatory.allowedKeySpecs.
# Controller must set Valid=True and write effectiveConfig.
apiVersion: aws.kropath.run/v1alpha1
kind: KMSConfig
metadata:
  name: ac10-general-policy
  namespace: payments-prod
spec:
  mandatory:
    keySpec: "SYMMETRIC_DEFAULT"
    allowedKeySpecs:
      - "SYMMETRIC_DEFAULT"
      - "RSA_4096"
  defaults: {}
