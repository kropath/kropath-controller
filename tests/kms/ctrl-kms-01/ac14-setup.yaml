# AC-14: globalKropathConfig with aws.region and aws.accountId set.
apiVersion: v1
kind: Namespace
metadata:
  name: ac14-kms-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac14-kms-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac14-kms-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac14-kms-global-ns
spec:
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Shared empty local KMSConfig — all cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: KMSConfig
metadata:
  name: ac14-general-policy
  namespace: ac14-kms-app-ns
spec:
  mandatory: {}
  defaults: {}
