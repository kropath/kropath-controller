# AC-15: globalAWSKropathConfig with mandatory.tags (tier-level tags, level 1).
apiVersion: aws.kropath.run/v1alpha1
kind: AWSKropathConfig
metadata:
  name: general-policy
  namespace: kro-system
spec:
  mandatory:
    tags:
      cost-centre: security
  aws:
    accountId: "123456789012"
    region: "us-east-1"
