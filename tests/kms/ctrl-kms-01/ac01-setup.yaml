# AC-1: globalKropathConfig with mandatory.kms.enableKeyRotation=true (level 1).
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-kms-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-kms-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac01-kms-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac01-kms-global-ns
spec:
  mandatory:
    kms:
      enableKeyRotation: true
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
# Shared empty local KMSConfig — all cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: KMSConfig
metadata:
  name: ac1-general-policy
  namespace: ac01-kms-app-ns
spec:
  mandatory: {}
  defaults: {}
