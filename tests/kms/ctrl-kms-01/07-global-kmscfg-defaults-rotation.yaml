# AC-3: globalKMSConfig with defaults.enableKeyRotation=true (level 7).
# mandatory.enableKeyRotation is not set (false = permissive sentinel).
apiVersion: aws.kropath.run/v1alpha1
kind: KMSConfig
metadata:
  name: general-policy
  namespace: kro-system
spec:
  mandatory:
    enableKeyRotation: false
  defaults:
    enableKeyRotation: true
