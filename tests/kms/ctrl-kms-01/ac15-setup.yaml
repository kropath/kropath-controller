# AC-15: globalKropathConfig with mandatory.tags (tier-level tags, level 1).
apiVersion: v1
kind: Namespace
metadata:
  name: ac15-kms-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac15-kms-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac15-kms-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac15-kms-global-ns
spec:
  mandatory:
    tags:
      cost-centre: security
---
# AC-15: KMSConfig with mandatory.tags (KMS config-level tags, level 4).
apiVersion: aws.kropath.run/v1alpha1
kind: KMSConfig
metadata:
  name: ac15-general-policy
  namespace: ac15-kms-app-ns
spec:
  mandatory:
    tags:
      key-type: encryption
  defaults: {}
