# ctrl-kms-01 Chainsaw integration tests — all 15 acceptance criteria.
# Requires:
#   - kind cluster with kropath-operator deployed
#   - KropathConfig CRD applied (crds/kropathconfig.yaml from kropath-aws)
#   - KMSConfig CRD applied (crds/kmsconfig.yaml from kropath-aws)
#
# Test isolation — unique name per step, no inter-step deletes:
#   Each step owns a distinct set of resource names (ac<N>-*). The controller
#   pairs a namespaced config with its kro-system counterpart by *name*, so a
#   per-step name isolates each step completely — no step can shadow another,
#   in either direction, regardless of order. That removes the need for the
#   per-step cleanup deletes and inline reset steps this suite used to carry.
#   See kropath-aws docs/frequent-rgd-errors.md §6 for the full rationale.
#
#   Unlike that reference, this suite does NOT set skipDelete. Chainsaw's
#   end-of-test cleanup is cheap here — these are plain config CRs with no
#   finalizers and no cloud calls, so there is no deletion queue to back up,
#   which is the only reason skipDelete is mandated there. Letting Chainsaw
#   reclaim each suite's objects keeps the shared kind cluster small; leaving
#   every suite's objects behind for a whole run puts enough reconcile load on
#   the API server to trip the test client's rate limiter in later suites.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-kms-01-cascade
spec:
  steps:
    # AC-1: globalKropathConfig.mandatory.kms.enableKeyRotation=true propagates
    # to KMSConfig.status.effectiveConfig.mandatory.enableKeyRotation=true.
    - name: ac1-global-enable-rotation-propagates
      try:
        - apply:
            file: ac01-setup.yaml
        - assert:
            file: ac01-assert.yaml
            timeout: 30s

    # AC-2: level-1 (KropathConfig mandatory.kms.enableKeyRotation=true) wins over
    # level-3 (globalKMSConfig.mandatory.enableKeyRotation=false).
    - name: ac2-level1-wins-over-level3-rotation
      try:
        - apply:
            file: ac02-setup.yaml
        - assert:
            file: ac02-assert.yaml
            timeout: 30s

    # AC-3: Only globalKMSConfig.defaults.enableKeyRotation=true set; mandatory stays false.
    - name: ac3-defaults-only-rotation
      try:
        - apply:
            file: ac03-setup.yaml
        - assert:
            file: ac03-assert.yaml
            timeout: 30s

    # AC-4: globalKMSConfig.mandatory.keySpec="SYMMETRIC_DEFAULT" (level 3) wins
    # over localKMSConfig.mandatory.keySpec="RSA_4096" (level 4).
    - name: ac4-global-keyspec-wins-over-local
      try:
        - apply:
            file: ac04-setup.yaml
        - assert:
            file: ac04-assert.yaml
            timeout: 30s

    # AC-5: Only globalKMSConfig.defaults.keySpec="SYMMETRIC_DEFAULT" set; mandatory empty.
    - name: ac5-defaults-only-keyspec
      try:
        - apply:
            file: ac05-setup.yaml
        - assert:
            file: ac05-assert.yaml
            timeout: 30s

    # AC-6: globalKMSConfig.mandatory.keyUsage="ENCRYPT_DECRYPT" propagates.
    - name: ac6-keyusage-propagates
      try:
        - apply:
            file: ac06-setup.yaml
        - assert:
            file: ac06-assert.yaml
            timeout: 30s

    # AC-7: globalKropathConfig.mandatory.kms.allowedKeySpecs propagates
    # to effCfg.mandatory.allowedKeySpecs across all profiles.
    - name: ac7-allowed-keyspecs-propagates
      try:
        - apply:
            file: ac07-setup.yaml
        - assert:
            file: ac07-assert.yaml
            timeout: 30s

    # AC-8: level-1 allowedKeySpecs wins over level-3 allowedKeySpecs.
    # Chainsaw defers all cleanup blocks to test end, so stale SSA field-manager state
    # from earlier ACs accumulates. Specifically, AC-4's field manager owns
    # payments-prod keySpec="RSA_4096" which blocks ValidateKMSKeySpec when
    # allowedKeySpecs is narrowed to ["SYMMETRIC_DEFAULT"] by fixture 18.
    # Fix: (1) delete both KMSConfigs first to clear stale state, (2) explicitly
    # delete fixture 18's KropathConfig after the assert to prevent the narrow
    # allowedKeySpecs from leaking into AC-9+ (AC-11 in particular sets keySpec=RSA_4096
    # expecting no restriction).
    - name: ac8-level1-allowedkeyspecs-wins
      try:
        - apply:
            file: ac08-setup.yaml
        - assert:
            file: ac08-assert.yaml
            timeout: 30s

    # AC-9: keySpec not in allowedKeySpecs → Valid=False, effectiveConfig NOT written.
    - name: ac9-invalid-keyspec-not-in-allowlist
      try:
        - apply:
            file: ac09-setup.yaml
        - assert:
            file: ac09-assert.yaml
            timeout: 30s

    # AC-10: keySpec IN allowedKeySpecs → Valid=True, effectiveConfig written.
    - name: ac10-valid-keyspec-in-allowlist
      try:
        - apply:
            file: ac10-setup.yaml
        - assert:
            file: ac10-assert.yaml
            timeout: 30s

    # AC-11: keySpec set with empty allowedKeySpecs → no restriction, effectiveConfig written.
    - name: ac11-keyspec-with-empty-allowlist
      try:
        - apply:
            file: ac11-setup.yaml
        - assert:
            file: ac11-assert.yaml
            timeout: 30s

    # AC-12: KropathConfig with both mandatory.kms.enableKeyRotation=true and
    # defaults.kms.enableKeyRotation=true is rejected at admission.
    - name: ac12-mutual-exclusivity-rotation
      try:
        - apply:
            file: ac12-setup-1.yaml
            expect:
            - match:
                apiVersion: aws.kropath.run/v1alpha1
                kind: KropathConfig
              check:
                ($error != null): true

    # AC-13: KropathConfig with both mandatory.kms.allowedKeySpecs and
    # defaults.kms.allowedKeySpecs non-empty is rejected at admission.
    - name: ac13-mutual-exclusivity-allowedkeyspecs
      try:
        - apply:
            file: ac13-setup-1.yaml
            expect:
            - match:
                apiVersion: aws.kropath.run/v1alpha1
                kind: KropathConfig
              check:
                ($error != null): true

    # AC-14: globalKropathConfig.spec.aws.region and accountId propagate
    # to effCfg.aws.region and effCfg.aws.accountId.
    - name: ac14-provider-identity-propagates
      try:
        - apply:
            file: ac14-setup.yaml
        - assert:
            file: ac14-assert.yaml
            timeout: 30s

    # AC-15: KropathConfig.mandatory.tags and KMSConfig.mandatory.tags are
    # union-merged into effCfg.mandatory.tags.
    - name: ac15-tag-union-merge
      try:
        - apply:
            file: ac15-setup.yaml
        - assert:
            file: ac15-assert.yaml
            timeout: 30s
