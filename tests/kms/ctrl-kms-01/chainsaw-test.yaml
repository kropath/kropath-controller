# ctrl-kms-01 Chainsaw integration tests — all 15 acceptance criteria.
# Requires:
#   - kind cluster with kropath-operator deployed (feature flag: --enable-kms-cascade)
#   - AWSKropathConfig CRD applied (crds/awskropathconfig.yaml from kropath-aws)
#   - AWSKMSConfig CRD applied (crds/awskmsconfig.yaml from kropath-aws)
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-kms-01-cascade
spec:
  steps:
    # AC-1: globalAWSKropathConfig.mandatory.kms.enableKeyRotation=true propagates
    # to AWSKMSConfig.status.effectiveConfig.mandatory.enableKeyRotation=true.
    - name: ac1-global-enable-rotation-propagates
      try:
        - apply:
            file: 01-global-kpc-enable-rotation.yaml
        - apply:
            file: 02-awskmsconfig.yaml
        - assert:
            file: 03-assert-ac1.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-awskmsconfig.yaml
        - delete:
            file: 01-global-kpc-enable-rotation.yaml

    # AC-2: level-1 (KropathConfig mandatory.kms.enableKeyRotation=true) wins over
    # level-3 (globalAWSKMSConfig.mandatory.enableKeyRotation=false).
    - name: ac2-level1-wins-over-level3-rotation
      try:
        - apply:
            file: 04-global-kpc-rotation-l1.yaml
        - apply:
            file: 05-global-kmscfg-rotation-l3.yaml
        - apply:
            file: 02-awskmsconfig.yaml
        - assert:
            file: 06-assert-ac2.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-awskmsconfig.yaml
        - delete:
            file: 05-global-kmscfg-rotation-l3.yaml
        - delete:
            file: 04-global-kpc-rotation-l1.yaml

    # AC-3: Only globalAWSKMSConfig.defaults.enableKeyRotation=true set; mandatory stays false.
    - name: ac3-defaults-only-rotation
      try:
        - apply:
            file: 07-global-kmscfg-defaults-rotation.yaml
        - apply:
            file: 02-awskmsconfig.yaml
        - assert:
            file: 08-assert-ac3.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-awskmsconfig.yaml
        - delete:
            file: 07-global-kmscfg-defaults-rotation.yaml

    # AC-4: globalAWSKMSConfig.mandatory.keySpec="SYMMETRIC_DEFAULT" (level 3) wins
    # over localAWSKMSConfig.mandatory.keySpec="RSA_4096" (level 4).
    - name: ac4-global-keyspec-wins-over-local
      try:
        - apply:
            file: 09-global-kmscfg-keyspec-l3.yaml
        - apply:
            file: 10-awskmsconfig-keyspec-l4.yaml
        - assert:
            file: 11-assert-ac4.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 10-awskmsconfig-keyspec-l4.yaml
        - delete:
            file: 09-global-kmscfg-keyspec-l3.yaml

    # AC-5: Only globalAWSKMSConfig.defaults.keySpec="SYMMETRIC_DEFAULT" set; mandatory empty.
    - name: ac5-defaults-only-keyspec
      try:
        - apply:
            file: 12-global-kmscfg-defaults-keyspec.yaml
        - apply:
            file: 02-awskmsconfig.yaml
        - assert:
            file: 13-assert-ac5.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-awskmsconfig.yaml
        - delete:
            file: 12-global-kmscfg-defaults-keyspec.yaml

    # AC-6: globalAWSKMSConfig.mandatory.keyUsage="ENCRYPT_DECRYPT" propagates.
    - name: ac6-keyusage-propagates
      try:
        - apply:
            file: 14-global-kmscfg-keyusage.yaml
        - apply:
            file: 02-awskmsconfig.yaml
        - assert:
            file: 15-assert-ac6.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-awskmsconfig.yaml
        - delete:
            file: 14-global-kmscfg-keyusage.yaml

    # AC-7: globalAWSKropathConfig.mandatory.kms.allowedKeySpecs propagates
    # to effCfg.mandatory.allowedKeySpecs across all profiles.
    - name: ac7-allowed-keyspecs-propagates
      try:
        - apply:
            file: 16-global-kpc-allowedkeyspecs.yaml
        - apply:
            file: 02-awskmsconfig.yaml
        - assert:
            file: 17-assert-ac7.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-awskmsconfig.yaml
        - delete:
            file: 16-global-kpc-allowedkeyspecs.yaml

    # AC-8: level-1 allowedKeySpecs wins over level-3 allowedKeySpecs.
    - name: ac8-level1-allowedkeyspecs-wins
      try:
        - apply:
            file: 18-global-kpc-allowedkeyspecs-l1.yaml
        - apply:
            file: 19-global-kmscfg-allowedkeyspecs-l3.yaml
        - apply:
            file: 02-awskmsconfig.yaml
        - assert:
            file: 20-assert-ac8.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-awskmsconfig.yaml
        - delete:
            file: 19-global-kmscfg-allowedkeyspecs-l3.yaml
        - delete:
            file: 18-global-kpc-allowedkeyspecs-l1.yaml

    # AC-9: keySpec not in allowedKeySpecs → Valid=False, effectiveConfig NOT written.
    - name: ac9-invalid-keyspec-not-in-allowlist
      try:
        - apply:
            file: 21-awskmsconfig-invalid-keyspec.yaml
        - assert:
            file: 22-assert-ac9.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 21-awskmsconfig-invalid-keyspec.yaml

    # AC-10: keySpec IN allowedKeySpecs → Valid=True, effectiveConfig written.
    - name: ac10-valid-keyspec-in-allowlist
      try:
        - apply:
            file: 23-awskmsconfig-valid-keyspec.yaml
        - assert:
            file: 24-assert-ac10.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 23-awskmsconfig-valid-keyspec.yaml

    # AC-11: keySpec set with empty allowedKeySpecs → no restriction, effectiveConfig written.
    - name: ac11-keyspec-with-empty-allowlist
      try:
        - apply:
            file: 25-awskmsconfig-keyspec-no-restriction.yaml
        - assert:
            file: 26-assert-ac11.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 25-awskmsconfig-keyspec-no-restriction.yaml

    # AC-12: AWSKropathConfig with both mandatory.kms.enableKeyRotation=true and
    # defaults.kms.enableKeyRotation=true is rejected at admission.
    - name: ac12-mutual-exclusivity-rotation
      try:
        - apply:
            file: 27-awskropathconfig-both-rotation.yaml
            expect:
              - match:
                  apiVersion: kropath.run/v1alpha1
                  kind: AWSKropathConfig
                check:
                  ($error != null): true

    # AC-13: AWSKropathConfig with both mandatory.kms.allowedKeySpecs and
    # defaults.kms.allowedKeySpecs non-empty is rejected at admission.
    - name: ac13-mutual-exclusivity-allowedkeyspecs
      try:
        - apply:
            file: 28-awskropathconfig-both-allowedkeyspecs.yaml
            expect:
              - match:
                  apiVersion: kropath.run/v1alpha1
                  kind: AWSKropathConfig
                check:
                  ($error != null): true

    # AC-14: globalAWSKropathConfig.spec.aws.region and accountId propagate
    # to effCfg.aws.region and effCfg.aws.accountId.
    - name: ac14-provider-identity-propagates
      try:
        - apply:
            file: 29-global-kpc-aws-identity.yaml
        - apply:
            file: 02-awskmsconfig.yaml
        - assert:
            file: 30-assert-ac14.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 02-awskmsconfig.yaml
        - delete:
            file: 29-global-kpc-aws-identity.yaml

    # AC-15: AWSKropathConfig.mandatory.tags and AWSKMSConfig.mandatory.tags are
    # union-merged into effCfg.mandatory.tags.
    - name: ac15-tag-union-merge
      try:
        - apply:
            file: 31-global-kpc-mandatory-tags.yaml
        - apply:
            file: 32-awskmsconfig-mandatory-tags.yaml
        - assert:
            file: 33-assert-ac15.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: 32-awskmsconfig-mandatory-tags.yaml
        - delete:
            file: 31-global-kpc-mandatory-tags.yaml
