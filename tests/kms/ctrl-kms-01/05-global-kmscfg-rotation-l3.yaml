# AC-2: globalAWSKMSConfig mandatory.enableKeyRotation=false (zero value = not enforced, level 3).
apiVersion: aws.kropath.run/v1alpha1
kind: AWSKMSConfig
metadata:
  name: general-policy
  namespace: kro-system
spec:
  mandatory:
    enableKeyRotation: false
  defaults:
    enableKeyRotation: false
