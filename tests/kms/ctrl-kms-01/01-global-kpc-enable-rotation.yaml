# AC-1: globalAWSKropathConfig with mandatory.kms.enableKeyRotation=true (level 1).
apiVersion: kropath.run/v1alpha1
kind: AWSKropathConfig
metadata:
  name: general-policy
  namespace: kro-system
spec:
  mandatory:
    kms:
      enableKeyRotation: true
  aws:
    accountId: "123456789012"
    region: "us-east-1"
