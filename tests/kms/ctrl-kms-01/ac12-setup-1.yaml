# AC-12: Should be rejected — enableKeyRotation set to true in both mandatory and defaults kms.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: kro-system
spec:
  mandatory:
    kms:
      enableKeyRotation: true
  defaults:
    kms:
      enableKeyRotation: true
