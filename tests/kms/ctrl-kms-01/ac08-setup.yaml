# AC-8: globalKropathConfig mandatory.kms.allowedKeySpecs=["SYMMETRIC_DEFAULT"] (level 1).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac8-general-policy
  namespace: kro-system
spec:
  mandatory:
    kms:
      allowedKeySpecs:
        - "SYMMETRIC_DEFAULT"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
# Shared empty local KMSConfig — all cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: KMSConfig
metadata:
  name: ac8-general-policy
  namespace: payments-prod
spec:
  mandatory: {}
  defaults: {}
---
# AC-8: globalKMSConfig mandatory.allowedKeySpecs (level 3, should lose to level 1).
apiVersion: aws.kropath.run/v1alpha1
kind: KMSConfig
metadata:
  name: ac8-general-policy
  namespace: kro-system
spec:
  mandatory:
    allowedKeySpecs:
      - "RSA_4096"
      - "ECC_NIST_P256"
  defaults: {}
