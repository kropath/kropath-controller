# AC-11: AWSKMSConfig with mandatory.keySpec set but no allowedKeySpecs restriction.
# Empty allowedKeySpecs = no restriction; effectiveConfig must be written.
apiVersion: aws.kropath.run/v1alpha1
kind: AWSKMSConfig
metadata:
  name: general-policy
  namespace: payments-prod
spec:
  mandatory:
    keySpec: "RSA_4096"
  defaults: {}
