---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: awspolicydocument-phase3-merge
spec:
  steps:
    - name: ac-pd3-1-source-statements-merge-before-own
      try:
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              metadata:
                name: base
                namespace: default
              spec:
                statements:
                  - sid: BaseAllow
                    effect: Allow
                    actions: ["s3:GetObject"]
                    resources:
                      - arn: arn:aws:s3:::base-bucket
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              metadata:
                name: base
                namespace: default
              status:
                conditions:
                  - type: Ready
                    status: "True"
                  - type: SourceNotReady
                    status: "False"
                  - type: SidConflict
                    status: "False"
                resolvedDocumentJSON: '{"Statement":[{"Sid":"BaseAllow","Effect":"Allow","Action":"s3:GetObject","Resource":"arn:aws:s3:::base-bucket"}],"Version":"2012-10-17"}'
            timeout: 30s
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              metadata:
                name: child
                namespace: default
              spec:
                sources:
                  - name: base
                statements:
                  - sid: ChildAllow
                    effect: Allow
                    actions: ["s3:PutObject"]
                    resources:
                      - arn: arn:aws:s3:::child-bucket
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              metadata:
                name: child
                namespace: default
              status:
                conditions:
                  - type: Ready
                    status: "True"
                  - type: SourceNotReady
                    status: "False"
                  - type: SidConflict
                    status: "False"
                resolvedDocumentJSON: '{"Statement":[{"Sid":"BaseAllow","Effect":"Allow","Action":"s3:GetObject","Resource":"arn:aws:s3:::base-bucket"},{"Sid":"ChildAllow","Effect":"Allow","Action":"s3:PutObject","Resource":"arn:aws:s3:::child-bucket"}],"Version":"2012-10-17"}'
            timeout: 30s
      cleanup:
        - delete:
            ref:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              name: child
              namespace: default
        - delete:
            ref:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              name: base
              namespace: default

    - name: ac-pd3-2-raw-source-is-rejected
      try:
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              metadata:
                name: raw-source
                namespace: default
              spec:
                documentJSON: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:GetObject","Resource":"*"}]}'
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              metadata:
                name: merge-attempt
                namespace: default
              spec:
                sources:
                  - name: raw-source
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              metadata:
                name: merge-attempt
                namespace: default
              status:
                conditions:
                  - type: Ready
                    status: "False"
                    reason: MergeFromRawNotSupported
                  - type: SourceNotReady
                    status: "False"
                    reason: MergeFromRawNotSupported
                  - type: SidConflict
                    status: "False"
                    reason: MergeFromRawNotSupported
            timeout: 30s
      cleanup:
        - delete:
            ref:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              name: merge-attempt
              namespace: default
        - delete:
            ref:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              name: raw-source
              namespace: default

    - name: ac-pd3-3-sid-conflict-blocks-update
      try:
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              metadata:
                name: base
                namespace: default
              spec:
                statements:
                  - sid: AllowS3Read
                    effect: Allow
                    actions: ["s3:GetObject"]
                    resources:
                      - arn: arn:aws:s3:::base-bucket
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              metadata:
                name: child
                namespace: default
              spec:
                sources:
                  - name: base
                statements:
                  - sid: AllowS3Read
                    effect: Allow
                    actions: ["s3:PutObject"]
                    resources:
                      - arn: arn:aws:s3:::child-bucket
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              metadata:
                name: child
                namespace: default
              status:
                conditions:
                  - type: Ready
                    status: "False"
                    reason: SidConflict
                  - type: SourceNotReady
                    status: "False"
                    reason: SidConflict
                  - type: SidConflict
                    status: "True"
                    reason: SidConflict
                    message: Sid "AllowS3Read" appears more than once across merged statements
            timeout: 30s
      cleanup:
        - delete:
            ref:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              name: child
              namespace: default
        - delete:
            ref:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              name: base
              namespace: default

    - name: ac-pd3-4-sid-conflict-clears-after-rename
      try:
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              metadata:
                name: base
                namespace: default
              spec:
                statements:
                  - sid: AllowS3Read
                    effect: Allow
                    actions: ["s3:GetObject"]
                    resources:
                      - arn: arn:aws:s3:::base-bucket
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              metadata:
                name: child
                namespace: default
              spec:
                sources:
                  - name: base
                statements:
                  - sid: AllowS3Read
                    effect: Allow
                    actions: ["s3:PutObject"]
                    resources:
                      - arn: arn:aws:s3:::child-bucket
        - patch:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              metadata:
                name: child
                namespace: default
              spec:
                statements:
                  - sid: AllowS3Write
                    effect: Allow
                    actions: ["s3:PutObject"]
                    resources:
                      - arn: arn:aws:s3:::child-bucket
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              metadata:
                name: child
                namespace: default
              status:
                conditions:
                  - type: Ready
                    status: "True"
                  - type: SourceNotReady
                    status: "False"
                  - type: SidConflict
                    status: "False"
                resolvedDocumentJSON: '{"Statement":[{"Sid":"AllowS3Read","Effect":"Allow","Action":"s3:GetObject","Resource":"arn:aws:s3:::base-bucket"},{"Sid":"AllowS3Write","Effect":"Allow","Action":"s3:PutObject","Resource":"arn:aws:s3:::child-bucket"}],"Version":"2012-10-17"}'
            timeout: 30s
      cleanup:
        - delete:
            ref:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              name: child
              namespace: default
        - delete:
            ref:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              name: base
              namespace: default

    - name: ac-pd3-5-transitive-source-chain
      try:
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              metadata:
                name: base
                namespace: default
              spec:
                statements:
                  - sid: BaseAllow
                    effect: Allow
                    actions: ["s3:GetObject"]
                    resources:
                      - arn: arn:aws:s3:::base-bucket
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              metadata:
                name: mid
                namespace: default
              spec:
                sources:
                  - name: base
                statements:
                  - sid: MidAllow
                    effect: Allow
                    actions: ["s3:PutObject"]
                    resources:
                      - arn: arn:aws:s3:::mid-bucket
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              metadata:
                name: leaf
                namespace: default
              spec:
                sources:
                  - name: mid
                statements:
                  - sid: LeafAllow
                    effect: Allow
                    actions: ["s3:DeleteObject"]
                    resources:
                      - arn: arn:aws:s3:::leaf-bucket
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              metadata:
                name: leaf
                namespace: default
              status:
                conditions:
                  - type: Ready
                    status: "True"
                  - type: SourceNotReady
                    status: "False"
                  - type: SidConflict
                    status: "False"
                resolvedDocumentJSON: '{"Statement":[{"Sid":"BaseAllow","Effect":"Allow","Action":"s3:GetObject","Resource":"arn:aws:s3:::base-bucket"},{"Sid":"MidAllow","Effect":"Allow","Action":"s3:PutObject","Resource":"arn:aws:s3:::mid-bucket"},{"Sid":"LeafAllow","Effect":"Allow","Action":"s3:DeleteObject","Resource":"arn:aws:s3:::leaf-bucket"}],"Version":"2012-10-17"}'
            timeout: 30s
      cleanup:
        - delete:
            ref:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              name: leaf
              namespace: default
        - delete:
            ref:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              name: mid
              namespace: default
        - delete:
            ref:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              name: base
              namespace: default

    - name: ac-pd3-6-missing-source-requeues
      try:
        - apply:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              metadata:
                name: missing-source-child
                namespace: default
              spec:
                sources:
                  - name: does-not-exist
        - assert:
            resource:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              metadata:
                name: missing-source-child
                namespace: default
              status:
                conditions:
                  - type: Ready
                    status: "False"
                    reason: SourceMissing
                  - type: SourceNotReady
                    status: "True"
                    reason: SourceMissing
                  - type: SidConflict
                    status: "False"
                    reason: SourceMissing
            timeout: 30s
        - script:
            timeout: 45s
            content: |
              set -eu

              # The kropath-operator runs as a local process during chainsaw runs
              # (see Makefile chainsaw-start), not as an in-cluster Deployment, so
              # its metrics endpoint is reachable directly on localhost.
              for _ in $(seq 1 30); do
                if curl -sf localhost:8080/metrics >/tmp/kropath-metrics.prom; then
                  break
                fi
                sleep 1
              done

              baseline=$(curl -sf localhost:8080/metrics | awk '/^controller_runtime_reconcile_total\{.*result="requeue_after".*\}/ { sum += $2 } END { print sum + 0 }')
              sleep 11
              after=$(curl -sf localhost:8080/metrics | awk '/^controller_runtime_reconcile_total\{.*result="requeue_after".*\}/ { sum += $2 } END { print sum + 0 }')

              if [ "$after" -le "$baseline" ]; then
                echo "expected controller_runtime_reconcile_total{result=\"requeue_after\"} to increase after 10s backoff"
                echo "baseline=$baseline after=$after"
                exit 1
              fi
      cleanup:
        - delete:
            ref:
              apiVersion: kropath.run/v1alpha1
              kind: AWSPolicyDocument
              name: missing-source-child
              namespace: default
