apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: policydocument-phase2-refs
spec:
  steps:
    - name: ac-pd2-1-document-json-pass-through
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: PolicyDocument
              metadata:
                name: raw-form
                namespace: default
              spec:
                documentJSON: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:GetObject","Resource":"*"}]}'
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: PolicyDocument
              metadata:
                name: raw-form
                namespace: default
              status:
                resolvedDocumentJSON: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:GetObject","Resource":"*"}]}'
                conditions:
                  - type: Ready
                    status: "True"
                  - type: SourceNotReady
                    status: "False"
                  - type: SidConflict
                    status: "False"
      cleanup:
        - delete:
            ref:
              apiVersion: aws.kropath.run/v1alpha1
              kind: PolicyDocument
              name: raw-form
              namespace: default

    - name: ac-pd2-2-resource-ref-resolution
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSIAMRole
              metadata:
                name: lambda-exec-2
                namespace: default
        - patch:
            subresource: status
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSIAMRole
              metadata:
                name: lambda-exec-2
                namespace: default
              status:
                predictedArn: arn:aws:iam::123456789012:role/lambda-exec-2
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: PolicyDocument
              metadata:
                name: role-ref
                namespace: default
              spec:
                statements:
                  - effect: Allow
                    actions: ["lambda:InvokeFunction"]
                    resources:
                      - ref:
                          kind: AWSIAMRole
                          name: lambda-exec-2
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: PolicyDocument
              metadata:
                name: role-ref
                namespace: default
              status:
                conditions:
                  - type: Ready
                    status: "True"
                  - type: SourceNotReady
                    status: "False"
                  - type: SidConflict
                    status: "False"
                resolvedDocumentJSON:
                  (contains(@, 'arn:aws:iam::123456789012:role/lambda-exec-2')): true
      cleanup:
        - delete:
            ref:
              apiVersion: aws.kropath.run/v1alpha1
              kind: PolicyDocument
              name: role-ref
              namespace: default
        - delete:
            ref:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSIAMRole
              name: lambda-exec-2
              namespace: default

    - name: ac-pd2-3-pending-ref
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: PolicyDocument
              metadata:
                name: pending-ref
                namespace: default
              spec:
                statements:
                  - effect: Allow
                    actions: ["lambda:InvokeFunction"]
                    resources:
                      - ref:
                          kind: AWSIAMRole
                          name: lambda-exec
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: PolicyDocument
              metadata:
                name: pending-ref
                namespace: default
              status:
                conditions:
                  - type: Ready
                    status: "False"
                  - type: SourceNotReady
                    status: "True"
                  - type: SidConflict
                    status: "False"

    - name: ac-pd2-4-ref-becomes-ready
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSIAMRole
              metadata:
                name: lambda-exec
                namespace: default
        - patch:
            subresource: status
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSIAMRole
              metadata:
                name: lambda-exec
                namespace: default
              status:
                predictedArn: arn:aws:iam::123456789012:role/lambda-exec
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: PolicyDocument
              metadata:
                name: pending-ref
                namespace: default
              status:
                conditions:
                  - type: Ready
                    status: "True"
                  - type: SourceNotReady
                    status: "False"
                  - type: SidConflict
                    status: "False"
                resolvedDocumentJSON:
                  (contains(@, 'arn:aws:iam::123456789012:role/lambda-exec')): true
      cleanup:
        - delete:
            ref:
              apiVersion: aws.kropath.run/v1alpha1
              kind: PolicyDocument
              name: pending-ref
              namespace: default
        - delete:
            ref:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSIAMRole
              name: lambda-exec
              namespace: default

    - name: ac-pd2-5-principal-ref-resolution
      try:
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSS3Bucket
              metadata:
                name: my-bucket
                namespace: default
        - patch:
            subresource: status
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSS3Bucket
              metadata:
                name: my-bucket
                namespace: default
              status:
                predictedArn: arn:aws:s3:::my-bucket
        - apply:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: PolicyDocument
              metadata:
                name: bucket-policy
                namespace: default
              spec:
                statements:
                  - effect: Allow
                    actions: ["s3:GetObject"]
                    principals:
                      - type: AWS
                        ref:
                          kind: AWSS3Bucket
                          name: my-bucket
        - assert:
            resource:
              apiVersion: aws.kropath.run/v1alpha1
              kind: PolicyDocument
              metadata:
                name: bucket-policy
                namespace: default
              status:
                conditions:
                  - type: Ready
                    status: "True"
                  - type: SourceNotReady
                    status: "False"
                  - type: SidConflict
                    status: "False"
                resolvedDocumentJSON:
                  (contains(@, '"Principal":{"AWS":"arn:aws:s3:::my-bucket"}')): true
      cleanup:
        - delete:
            ref:
              apiVersion: aws.kropath.run/v1alpha1
              kind: PolicyDocument
              name: bucket-policy
              namespace: default
        - delete:
            ref:
              apiVersion: aws.kropath.run/v1alpha1
              kind: AWSS3Bucket
              name: my-bucket
              namespace: default
