# ctrl-backup-01 Chainsaw integration tests — AC-12 and AC-13.
#
# Requires a kind cluster with kropath-operator running and the fixture CRDs
# applied (`make chainsaw-start chainsaw-wait`, or just `make test-backup`
# against an already-running controller).
#
# Test isolation — unique-name-per-step, no inter-step deletes:
#   Each AC owns a distinct resource name (acN-backup-policy). The controller
#   resolves a config's global counterpart by *name* — a local BackupConfig
#   payments-prod/acN-backup-policy merges only kro-system/acN-backup-policy —
#   so a per-AC name isolates each AC completely.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-backup-01
spec:
  description: "Backup effectiveConfig cascade — AC-12 and AC-13 (ctrl-backup-01)"
  steps:
    # AC-12: KropathConfig.mandatory.backup.encryptionKeyARN (level 1) → effCfg.mandatory.encryptionKeyARN
    - name: ac12-global-kpc-mandatory-encryption-key-arn
      try:
        - apply:
            file: ac12-setup.yaml
        - assert:
            file: ac12-assert.yaml
            timeout: 30s

    # AC-13: BackupConfig.defaults.tags + KropathConfig.defaults.tags merge → effCfg.defaults.tags
    - name: ac13-defaults-tags-merge
      try:
        - apply:
            file: ac13-setup.yaml
        - assert:
            file: ac13-assert.yaml
            timeout: 30s
