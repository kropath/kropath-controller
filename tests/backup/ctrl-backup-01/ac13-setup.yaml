#
# AC-13: BackupConfig.defaults.tags={"team":"backup"} (level 6) +
# KropathConfig.defaults.tags={"env":"prod"} (level 9) merge into
# effCfg.defaults.tags containing both entries.
#
# KropathConfig is a per-namespace singleton named "baseline" (ADR-018 D-1/D-2,
# ADR-015 §5.7) — renamed out of kro-system into a per-AC global-ns/app-ns pair
# so this suite's global-tier config cannot collide with any other suite's
# singleton "baseline" once every suite shares the cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: ac13-backup-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac13-backup-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac13-backup-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac13-backup-global-ns
spec:
  defaults:
    tags:
      env: "prod"
  aws:
    accountId: "111122223333"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: BackupConfig
metadata:
  name: ac13-backup-policy
  namespace: ac13-backup-app-ns
spec:
  defaults:
    tags:
      team: "backup"
