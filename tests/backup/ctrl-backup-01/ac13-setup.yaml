#
# AC-13: BackupConfig.defaults.tags={"team":"backup"} (level 6) +
# KropathConfig.defaults.tags={"env":"prod"} (level 9) merge into
# effCfg.defaults.tags containing both entries.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac13-backup-policy
  namespace: kro-system
spec:
  defaults:
    tags:
      env: "prod"
  aws:
    accountId: "111122223333"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: BackupConfig
metadata:
  name: ac13-backup-policy
  namespace: payments-prod
spec:
  defaults:
    tags:
      team: "backup"
