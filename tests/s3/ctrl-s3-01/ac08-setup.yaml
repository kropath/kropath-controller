apiVersion: v1
kind: Namespace
metadata:
  name: ac08-s3-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac08-s3-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac08-s3-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac08-s3-global-ns
spec:
  mandatory:
    s3:
      loggingEnabled: true
      logDeliveryBucket: org-access-logs
---
apiVersion: aws.kropath.run/v1alpha1
kind: S3Config
metadata:
  name: ac8-ac8-general-policy
  namespace: ac08-s3-app-ns
spec:
  mandatory: {}
  defaults: {}
