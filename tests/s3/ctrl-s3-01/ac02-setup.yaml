# AC-2: both the global KropathConfig and the global-tier S3Config it overrides
# live in the same isolated namespace (no separate local/app tier for this AC) --
# renamed out of kro-system to avoid colliding with every other AC's singleton
# baseline KropathConfig once every suite shares the cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: ac02-s3-global-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac02-s3-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac02-s3-global-ns
spec:
  mandatory:
    s3:
      encryptionAlgorithm: aws:kms
---
apiVersion: aws.kropath.run/v1alpha1
kind: S3Config
metadata:
  name: ac2-ac2-general-policy
  namespace: ac02-s3-global-ns
spec:
  mandatory:
    encryptionAlgorithm: AES256
    enforceHttpsOnly: false
  defaults: {}
