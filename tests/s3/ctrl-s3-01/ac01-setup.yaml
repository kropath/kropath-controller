apiVersion: v1
kind: Namespace
metadata:
  name: ac01-s3-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-s3-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac01-s3-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac01-s3-global-ns
spec:
  mandatory:
    s3:
      encryptionAlgorithm: aws:kms
---
apiVersion: aws.kropath.run/v1alpha1
kind: S3Config
metadata:
  name: ac1-ac1-general-policy
  namespace: ac01-s3-app-ns
spec:
  mandatory: {}
  defaults: {}
