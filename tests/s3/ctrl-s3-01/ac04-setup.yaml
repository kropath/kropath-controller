apiVersion: v1
kind: Namespace
metadata:
  name: ac04-s3-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac04-s3-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac04-s3-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac04-s3-global-ns
spec:
  mandatory:
    s3:
      enforceHttpsOnly: true
---
apiVersion: aws.kropath.run/v1alpha1
kind: S3Config
metadata:
  name: ac4-ac4-general-policy
  namespace: ac04-s3-app-ns
spec:
  mandatory: {}
  defaults: {}
