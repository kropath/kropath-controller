# Gap 3 — NamingTemplate from S3Config mandatory tier propagates into effectiveConfig.
# NamingTemplate is governed at S3Config levels (3-4 mandatory, 6-7 defaults) only;
# KropathConfig tiers do not carry this field.
apiVersion: aws.kropath.run/v1alpha1
kind: S3Config
metadata:
  name: ac12-ac12-general-policy
  namespace: payments-prod
spec:
  mandatory:
    namingTemplate: "{account_id}-{namespace}-{name}"
  defaults: {}
