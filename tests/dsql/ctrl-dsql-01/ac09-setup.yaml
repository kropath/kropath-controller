# C-9: Should be rejected — deletionProtectionEnabled set to true in both mandatory and defaults.
apiVersion: aws.kropath.run/v1alpha1
kind: DSQLConfig
metadata:
  name: ac9-invalid-both-deletion-protection
  namespace: payments-prod
spec:
  mandatory:
    deletionProtectionEnabled: true
  defaults:
    deletionProtectionEnabled: true
