# C-8: KropathConfig.mandatory.tags and DSQLConfig.mandatory.tags are
# union-merged into effCfg.mandatory.tags. Level-1 value wins on key conflicts.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac8-dsql-policy
  namespace: kro-system
spec:
  mandatory:
    tags:
      owner: "platform-team"
      shared-key: "from-global-kropath"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: DSQLConfig
metadata:
  name: ac8-dsql-policy
  namespace: payments-prod
spec:
  mandatory:
    tags:
      team: "payments"
      shared-key: "from-local-dsqlconfig"
