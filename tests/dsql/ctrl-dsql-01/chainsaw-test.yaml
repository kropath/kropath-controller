# ctrl-dsql-01 Chainsaw integration tests — Aurora DSQL effectiveConfig cascade.
#
# Covers acceptance criteria: C-1, C-5, C-8, C-9.
#
# Test isolation — unique-name-per-step, no inter-step deletes:
#   Each AC owns a distinct resource name (acN-dsql-policy). The controller
#   resolves a config's global counterpart by *name* — a local DSQLConfig
#   payments-prod/acN-dsql-policy merges only kro-system/acN-dsql-policy — so a
#   per-AC name isolates each AC completely.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-dsql-01
spec:
  description: "Aurora DSQL effectiveConfig cascade — acceptance criteria C-1, C-5, C-8, C-9 (ctrl-dsql-01)"
  steps:
    # C-1: globalKropathConfig.mandatory.dsql.deletionProtectionEnabled=true (level 1) → effCfg.mandatory.deletionProtectionEnabled=true
    - name: ac1-global-kpc-mandatory-deletion-protection
      try:
        - apply:
            file: ac01-setup.yaml
        - assert:
            file: ac01-assert.yaml
            timeout: 30s

    # C-5: globalDSQLConfig.mandatory.kmsEncryptionKey (level 3) → effCfg.mandatory.kmsEncryptionKey
    - name: ac5-global-dsqlcfg-mandatory-kms-key
      try:
        - apply:
            file: ac05-setup.yaml
        - assert:
            file: ac05-assert.yaml
            timeout: 30s

    # C-8: KropathConfig.mandatory.tags and DSQLConfig.mandatory.tags are union-merged into effCfg.mandatory.tags.
    - name: ac8-tag-union-merge
      try:
        - apply:
            file: ac08-setup.yaml
        - assert:
            file: ac08-assert.yaml
            timeout: 30s

    # C-9: KropathConfig with deletionProtectionEnabled=true in both mandatory.dsql and defaults.dsql
    # is rejected at admission by the KropathConfig CRD's CEL mutual-exclusion rule.
    - name: ac9-mutual-exclusivity-deletion-protection
      try:
        - apply:
            file: ac09-setup.yaml
            expect:
            - match:
                apiVersion: aws.kropath.run/v1alpha1
                kind: KropathConfig
              check:
                ($error != null): true
