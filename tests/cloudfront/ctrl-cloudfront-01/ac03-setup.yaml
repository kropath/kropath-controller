# AC-C3: CloudFrontConfig mandatory priceClass="PriceClass_100" (level 4)
# propagates to effectiveConfig.mandatory.priceClass.
apiVersion: v1
kind: Namespace
metadata:
  name: ac03-cloudfront-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac03-cloudfront-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac03-cloudfront-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac03-cloudfront-global-ns
spec:
  mandatory: {}
---
apiVersion: aws.kropath.run/v1alpha1
kind: CloudFrontConfig
metadata:
  name: ac3-cfcfg-policy
  namespace: ac03-cloudfront-app-ns
spec:
  mandatory:
    priceClass: "PriceClass_100"
  defaults: {}
