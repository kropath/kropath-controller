# AC-C2: KropathConfig mandatory cloudfront.viewerProtocolPolicy="redirect-to-https" (level 1)
# propagates to effectiveConfig.mandatory.viewerProtocolPolicy.
apiVersion: v1
kind: Namespace
metadata:
  name: ac02-cloudfront-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac02-cloudfront-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac02-cloudfront-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac02-cloudfront-global-ns
spec:
  mandatory:
    cloudfront:
      viewerProtocolPolicy: "redirect-to-https"
---
apiVersion: aws.kropath.run/v1alpha1
kind: CloudFrontConfig
metadata:
  name: ac2-cfcfg-policy
  namespace: ac02-cloudfront-app-ns
spec:
  mandatory: {}
  defaults: {}
