# AC-C7: Tags union-merge across mandatory levels 3+4; level-3 (global CloudFrontConfig) wins on conflict.
apiVersion: v1
kind: Namespace
metadata:
  name: ac07-cloudfront-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac07-cloudfront-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac07-cloudfront-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac07-cloudfront-global-ns
spec:
  mandatory: {}
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
# Level-3: global CloudFrontConfig (kro-system) — wins on "cost-centre" conflict.
apiVersion: aws.kropath.run/v1alpha1
kind: CloudFrontConfig
metadata:
  name: ac7-cfcfg-policy
  namespace: ac07-cloudfront-global-ns
spec:
  mandatory:
    tags:
      cost-centre: platform
  defaults: {}
---
# Level-4: local CloudFrontConfig (payments-prod).
apiVersion: aws.kropath.run/v1alpha1
kind: CloudFrontConfig
metadata:
  name: ac7-cfcfg-policy
  namespace: ac07-cloudfront-app-ns
spec:
  mandatory:
    tags:
      cost-centre: app
      cf-tier: distribution
  defaults: {}
