# AC-C4: CloudFrontConfig mandatory webACLRequired=true (level 4)
# propagates to effectiveConfig.mandatory.webACLRequired.
apiVersion: v1
kind: Namespace
metadata:
  name: ac04-cloudfront-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac04-cloudfront-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac04-cloudfront-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac04-cloudfront-global-ns
spec:
  mandatory: {}
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: CloudFrontConfig
metadata:
  name: ac4-cfcfg-policy
  namespace: ac04-cloudfront-app-ns
spec:
  mandatory:
    webACLRequired: true
  defaults: {}
