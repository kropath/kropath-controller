# AC-C4: CloudFrontConfig mandatory webACLRequired=true (level 4)
# propagates to effectiveConfig.mandatory.webACLRequired.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac4-cfcfg-policy
  namespace: kro-system
spec:
  mandatory: {}
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: CloudFrontConfig
metadata:
  name: ac4-cfcfg-policy
  namespace: payments-prod
spec:
  mandatory:
    webACLRequired: true
  defaults: {}
