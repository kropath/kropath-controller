# AC-C6: Provider identity (aws.accountId, aws.region) from globalKropathConfig
# propagates to effectiveConfig.aws.
apiVersion: v1
kind: Namespace
metadata:
  name: ac06-cloudfront-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac06-cloudfront-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac06-cloudfront-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac06-cloudfront-global-ns
spec:
  mandatory: {}
  aws:
    accountId: "123456789012"
    region: "ap-northeast-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: CloudFrontConfig
metadata:
  name: ac6-cfcfg-policy
  namespace: ac06-cloudfront-app-ns
spec:
  mandatory: {}
  defaults: {}
