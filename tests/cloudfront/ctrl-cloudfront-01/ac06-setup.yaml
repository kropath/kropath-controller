# AC-C6: Provider identity (aws.accountId, aws.region) from globalKropathConfig
# propagates to effectiveConfig.aws.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac6-cfcfg-policy
  namespace: kro-system
spec:
  mandatory: {}
  aws:
    accountId: "123456789012"
    region: "ap-northeast-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: CloudFrontConfig
metadata:
  name: ac6-cfcfg-policy
  namespace: payments-prod
spec:
  mandatory: {}
  defaults: {}
