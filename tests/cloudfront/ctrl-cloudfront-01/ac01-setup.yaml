# AC-C1: CloudFrontConfig with empty spec — defaults viewerProtocolPolicy from level-6 local config.
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-cloudfront-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-cloudfront-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac01-cloudfront-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac01-cloudfront-global-ns
spec:
  mandatory: {}
---
apiVersion: aws.kropath.run/v1alpha1
kind: CloudFrontConfig
metadata:
  name: ac1-cfcfg-policy
  namespace: ac01-cloudfront-app-ns
spec:
  mandatory: {}
  defaults:
    viewerProtocolPolicy: "https-only"
