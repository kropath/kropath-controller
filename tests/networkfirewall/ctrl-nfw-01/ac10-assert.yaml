# Assert AC-10: mandatory.tags union-merge: env=prod (level 1 wins), owner=platform (level 1),
# team=security (level 3 unique key added).
apiVersion: aws.kropath.run/v1alpha1
kind: NetworkFirewallConfig
metadata:
  name: ac10-nfw-policy
  namespace: networkfirewall
status:
  effectiveConfig:
    mandatory:
      tags:
        env: "prod"
        owner: "platform"
        team: "security"
