# AC-3: KropathConfig.mandatory.networkfirewall.deleteProtection: true (level 1)
# flows to effCfg.mandatory.deleteProtection.
apiVersion: v1
kind: Namespace
metadata:
  name: ac3-nfw-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac3-nfw-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac3-nfw-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac3-nfw-global-ns
spec:
  mandatory:
    networkfirewall:
      deleteProtection: true
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: NetworkFirewallConfig
metadata:
  name: ac3-nfw-policy
  namespace: ac3-nfw-app-ns
spec: {}
