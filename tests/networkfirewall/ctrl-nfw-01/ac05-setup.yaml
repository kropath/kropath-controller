# AC-5: KropathConfig.mandatory.networkfirewall.statefulDefaultActions (level 1)
# flows to effCfg.mandatory.statefulDefaultActions.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac5-nfw-policy
  namespace: kro-system
spec:
  mandatory:
    networkfirewall:
      statefulDefaultActions:
        - "aws:drop_strict"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: NetworkFirewallConfig
metadata:
  name: ac5-nfw-policy
  namespace: networkfirewall
spec: {}
