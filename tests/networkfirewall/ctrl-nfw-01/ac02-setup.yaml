# AC-2: globalNFWConfig.mandatory.encryptionType (level 3) flows to effCfg.mandatory.encryptionType
# when KropathConfig has no networkfirewall settings.
apiVersion: v1
kind: Namespace
metadata:
  name: ac2-nfw-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac2-nfw-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac2-nfw-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac2-nfw-global-ns
spec:
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: NetworkFirewallConfig
metadata:
  name: ac2-nfw-policy
  namespace: ac2-nfw-global-ns
spec:
  mandatory:
    encryptionType: "CUSTOMER_KMS"
---
apiVersion: aws.kropath.run/v1alpha1
kind: NetworkFirewallConfig
metadata:
  name: ac2-nfw-policy
  namespace: ac2-nfw-app-ns
spec: {}
