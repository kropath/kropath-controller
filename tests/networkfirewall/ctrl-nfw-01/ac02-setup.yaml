# AC-2: globalNFWConfig.mandatory.encryptionType (level 3) flows to effCfg.mandatory.encryptionType
# when KropathConfig has no networkfirewall settings.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac2-nfw-policy
  namespace: kro-system
spec:
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: NetworkFirewallConfig
metadata:
  name: ac2-nfw-policy
  namespace: kro-system
spec:
  mandatory:
    encryptionType: "CUSTOMER_KMS"
---
apiVersion: aws.kropath.run/v1alpha1
kind: NetworkFirewallConfig
metadata:
  name: ac2-nfw-policy
  namespace: networkfirewall
spec: {}
