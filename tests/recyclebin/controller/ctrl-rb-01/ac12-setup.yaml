apiVersion: v1
kind: Namespace
metadata:
  name: ac12-rb-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac12-rb-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac12-rb-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac12-rb-global-ns
spec:
  mandatory:
    ebsrecyclebin:
      lockRule: true
---
apiVersion: aws.kropath.run/v1alpha1
kind: RecycleBinConfig
metadata:
  name: ac12-rb-config
  namespace: ac12-rb-app-ns
spec:
  mandatory:
    retentionPeriodValue: 14
    retentionPeriodUnit: DAYS
