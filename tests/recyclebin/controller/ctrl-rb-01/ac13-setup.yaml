apiVersion: v1
kind: Namespace
metadata:
  name: ac13-rb-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac13-rb-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac13-rb-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac13-rb-global-ns
spec:
  mandatory:
    tags:
      env: prod
      cost-center: kpc
---
apiVersion: aws.kropath.run/v1alpha1
kind: RecycleBinConfig
metadata:
  name: ac13-rb-config
  namespace: ac13-rb-app-ns
spec:
  mandatory:
    tags:
      env: staging
      service: recyclebin
