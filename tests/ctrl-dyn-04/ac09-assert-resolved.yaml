apiVersion: aws.kropath.run/v1alpha1
kind: PolicyDocument
metadata:
  name: ac09-lambda-policy
  namespace: default
status:
  conditions:
    - type: Ready
      status: "True"
    - type: SourceNotReady
      status: "False"
    - type: SidConflict
      status: "False"
  resolvedDocumentJSON:
    (contains(@, 'arn:aws:lambda:us-east-1:123456789012:function:ac09-lambda-fn')): true
