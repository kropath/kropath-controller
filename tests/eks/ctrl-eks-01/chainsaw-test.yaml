        - assert:
            file: ac07-assert.yaml
            timeout: 30s

    # AC-8: global EKSConfig.defaults.endpointPublicAccess (level 7) → effCfg.defaults
    - name: ac8-global-ekscfg-endpoint-public
      try:
        - apply:
