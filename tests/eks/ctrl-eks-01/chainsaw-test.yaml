            timeout: 30s

    # AC-15: KropathConfig.mandatory (level 1) wins over global EKSConfig.mandatory (level 3)
    - name: ac15-level1-wins-over-level3
      try:
        - apply:
            file: ac15-setup.yaml
        - assert:
            file: ac15-assert.yaml
            timeout: 30s

    # AC-16: the eks section of the fixture KropathConfig CRD is installed and read
    - name: ac16-kpc-eks-section-installed
      try:
        - apply:
            file: ac16-setup.yaml
        - assert:
            file: ac16-assert.yaml
            timeout: 30s
