            timeout: 30s

    # AC-11: global EKSConfig.defaults.namingTemplate (level 7) → effCfg.defaults
    - name: ac11-global-ekscfg-naming-template
      try:
        - apply:
            file: ac11-setup.yaml
        - assert:
            file: ac11-assert.yaml
            timeout: 30s

    # AC-12: KropathConfig.mandatory.tags and EKSConfig.mandatory.tags union-merge
    - name: ac12-mandatory-tag-union-merge
      try:
        - apply:
