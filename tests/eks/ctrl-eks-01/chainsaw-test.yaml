# ctrl-eks-01 Chainsaw integration tests — all 16 acceptance criteria.
#
# Requires a kind cluster with kropath-operator running and the fixture CRDs
# applied (`make chainsaw-start chainsaw-wait`, or just `make test-eks` against
# an already-running controller).
#
# Test isolation — unique-name-per-step, no inter-step deletes:
#   Each AC owns a distinct resource name (acN-eks-policy). The controller
#   resolves a config's global counterpart by *name* — a local EKSConfig
#   payments-prod/acN-eks-policy merges only kro-system/acN-eks-policy — so a
#   per-AC name isolates each AC completely. Nothing an AC applies can shadow
#   another AC, in either direction, regardless of step order.
#
#   This replaces the previous design, which reused one `general-policy` name
#   across all 16 ACs and therefore needed 16 interleaved "reset" delete steps
#   to stop each AC's leftovers from shadowing the next. Those deletes were pure
#   overhead and made the suite both slow and order-fragile. See
#   kropath-aws/docs/frequent-rgd-errors.md §6 "CANONICAL: Unique-Name-Per-Step
#   + skipDelete" for the full rationale.
#
#   skipDelete: true stops Chainsaw's end-of-test cascade delete. Resources are
#   tiny config CRs with no finalizers and no cloud calls, so leaving them costs
#   nothing; re-running the suite simply re-applies the same names idempotently.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-eks-01
spec:
  description: "EKS effectiveConfig cascade — all 16 acceptance criteria (ctrl-eks-01)"
  skipDelete: true
  steps:
    # AC-1: globalKropathConfig.mandatory.eks.version (level 1) → effCfg.mandatory.version
    - name: ac1-global-kpc-mandatory-version
      try:
        - apply:
            file: ac01-setup.yaml
        - assert:
            file: ac01-assert.yaml
            timeout: 30s

    # AC-2: global EKSConfig.mandatory.version (level 3) → effCfg.mandatory.version
    - name: ac2-global-ekscfg-mandatory-version
      try:
        - apply:
            file: ac02-setup.yaml
        - assert:
            file: ac02-assert.yaml
            timeout: 30s

    # AC-3: global EKSConfig.defaults.version (level 7) → effCfg.defaults.version
    - name: ac3-global-ekscfg-defaults-version
      try:
        - apply:
            file: ac03-setup.yaml
        - assert:
            file: ac03-assert.yaml
            timeout: 30s

    # AC-4: globalKropathConfig.mandatory.eks.authenticationMode (level 1) → effCfg.mandatory
    - name: ac4-global-kpc-authmode
      try:
        - apply:
            file: ac04-setup.yaml
        - assert:
            file: ac04-assert.yaml
            timeout: 30s

    # AC-5: global EKSConfig.defaults (level 7) wins over globalKropathConfig.defaults (level 9)
    - name: ac5-level7-defaults-wins-over-level9
      try:
        - apply:
            file: ac05-setup.yaml
