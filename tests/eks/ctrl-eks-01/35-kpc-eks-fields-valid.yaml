# AC-16: KropathConfig with mandatory.eks.version to verify the eks section
# in the fixture CRD is installed and accepted by the API server.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: general-policy
  namespace: kro-system
spec:
  mandatory:
    eks:
      version: "1.28"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
