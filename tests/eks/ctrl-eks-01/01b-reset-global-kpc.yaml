# Reset: remove globalKropathConfig.mandatory.eks.version before AC-2.
# AC-2 tests that level-3 (globalEKSConfig.mandatory.version="1.30") propagates
# when KropathConfig.mandatory.eks.version is unset. Server-side apply clears
# eks.version because it is absent from this manifest.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: general-policy
  namespace: kro-system
spec:
  mandatory:
    eks: {}
  aws:
    accountId: "123456789012"
    region: "us-east-1"
