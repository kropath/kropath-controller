# AC-16: the eks section of the fixture KropathConfig CRD is installed and read by the reconciler.
apiVersion: v1
kind: Namespace
metadata:
  name: ac16-eks-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac16-eks-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac16-eks-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac16-eks-global-ns
spec:
  mandatory:
    eks:
      version: "1.28"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: EKSConfig
metadata:
  name: ac16-eks-policy
  namespace: ac16-eks-app-ns
spec: {}
