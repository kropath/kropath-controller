# AC-5b: globalKropathConfig with defaults.eks.authenticationMode="API_AND_CONFIG_MAP" (level 9).
# Level 7 (global EKSConfig defaults) wins over level 9 (global KropathConfig defaults).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: general-policy
  namespace: kro-system
spec:
  defaults:
    eks:
      authenticationMode: "API_AND_CONFIG_MAP"
