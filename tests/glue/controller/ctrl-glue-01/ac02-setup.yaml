# AC-2: localGlueConfig.mandatory.numberOfWorkers (level 4 integer) when no higher mandatory level is set.
# Zero is the "not set" sentinel; a non-zero value at level 4 must propagate to effCfg.mandatory.
apiVersion: aws.kropath.run/v1alpha1
kind: GlueConfig
metadata:
  name: ac2-glue-policy
  namespace: data-platform
spec:
  mandatory:
    numberOfWorkers: 10
