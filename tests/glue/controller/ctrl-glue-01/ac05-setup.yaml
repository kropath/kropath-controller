# AC-5: globalKropathConfig.defaults.glue.glueVersion (level 9 fallback) → effCfg.defaults.glueVersion
# when levels 6, 7, and 8 are empty.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac5-glue-policy
  namespace: kro-system
spec:
  defaults:
    glue:
      glueVersion: "4.0"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: GlueConfig
metadata:
  name: ac5-glue-policy
  namespace: data-platform
spec: {}
