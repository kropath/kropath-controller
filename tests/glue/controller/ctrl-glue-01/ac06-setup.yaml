# AC-6: Additive tag merge — tags from both globalKropathConfig (level 1) and localGlueConfig
# (level 4) appear in effCfg.mandatory.tags; level 1 wins on key conflicts.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac6-glue-policy
  namespace: kro-system
spec:
  mandatory:
    tags:
      env: "prod"
      org: "kropath"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: GlueConfig
metadata:
  name: ac6-glue-policy
  namespace: data-platform
spec:
  mandatory:
    tags:
      env: "dev"
      team: "data-eng"
