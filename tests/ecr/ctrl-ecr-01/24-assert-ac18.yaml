apiVersion: aws.kropath.run/v1alpha1
kind: ECRConfig
metadata:
  name: general-policy
  namespace: ecr-app-ns
status:
  # accountId/region come from the ecr-app-ns namespace annotations.
  # KropathConfig has no aws field at all (removed in KRO-1241) -- proves
  # effectiveConfig.aws is resolved solely from namespace annotations (spec AC-2).
  effectiveConfig:
    aws:
      accountId: "123456789012"
      region: us-east-1
