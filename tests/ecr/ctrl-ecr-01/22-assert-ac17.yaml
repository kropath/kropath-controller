apiVersion: aws.kropath.run/v1alpha1
kind: ECRConfig
metadata:
  name: general-policy
  namespace: ecr-app-ns
status:
  conditions:
  - type: Valid
    status: "False"
    reason: InvalidEncryptionConfiguration
  - type: PlacementResolved
    status: "True"
    reason: ResolvedFromNamespace
  - type: GlobalProfileResolved
    status: "True"
    reason: ProfileFound
