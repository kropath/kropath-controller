# AC-11: globalKropathConfig.spec.aws.region and accountId propagate to effCfg.aws.*.
apiVersion: v1
kind: Namespace
metadata:
  name: ac11-cloudwatch-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac11-cloudwatch-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac11-cloudwatch-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "ap-southeast-2"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac11-cloudwatch-global-ns
spec:
  mandatory:
    cloudwatch: {}
---
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchConfig
metadata:
  name: ac11-cw-policy
  namespace: ac11-cloudwatch-app-ns
  labels:
    aws.kropath.run/resource-name: ac11-cw-policy
spec:
  mandatory: {}
  defaults: {}
