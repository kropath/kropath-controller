# AC-11: globalKropathConfig.spec.aws.region and accountId propagate to effCfg.aws.*.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac11-cw-policy
  namespace: kro-system
spec:
  mandatory:
    cloudwatch: {}
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchConfig
metadata:
  name: ac11-cw-policy
  namespace: monitoring-prod
  labels:
    aws.kropath.run/resource-name: ac11-cw-policy
spec:
  mandatory: {}
  defaults: {}
