# AC-10: Tags union merge. Level 1 (globalKropathConfig.mandatory.tags) wins key conflict.
apiVersion: v1
kind: Namespace
metadata:
  name: ac10-cloudwatch-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac10-cloudwatch-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac10-cloudwatch-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac10-cloudwatch-global-ns
spec:
  mandatory:
    tags:
      cost-centre: "platform"
      env: "org-level"
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Local CloudWatchConfig with its own tags — union merge expected; KC wins on "env".
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchConfig
metadata:
  name: ac10-cw-policy
  namespace: ac10-cloudwatch-app-ns
  labels:
    aws.kropath.run/resource-name: ac10-cw-policy
spec:
  mandatory:
    tags:
      team: "ops"
      env: "config-level"
  defaults: {}
