# AC-7: defaults priority. localCWConfig.defaults (level 6) beats globalKropathConfig.defaults (level 9).
# KC defaults has treatMissingData="missing" (level 9); localCWCfg defaults has "ignore" (level 6).
apiVersion: v1
kind: Namespace
metadata:
  name: ac07-cloudwatch-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac07-cloudwatch-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac07-cloudwatch-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac07-cloudwatch-global-ns
spec:
  defaults:
    cloudwatch:
      treatMissingData: "missing"
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Local CloudWatchConfig with defaults.treatMissingData (level 6) — should win.
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchConfig
metadata:
  name: ac7-cw-policy
  namespace: ac07-cloudwatch-app-ns
  labels:
    aws.kropath.run/resource-name: ac7-cw-policy
spec:
  mandatory: {}
  defaults:
    treatMissingData: "ignore"
