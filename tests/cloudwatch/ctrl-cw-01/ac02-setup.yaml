# AC-2: globalCWConfig.mandatory.actionsEnabled=false (level 3). KC levels are absent.
# Verifies boolean false is a valid enforced value; nil (KC absent) is the skip sentinel.
apiVersion: v1
kind: Namespace
metadata:
  name: ac02-cloudwatch-global-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac02-cloudwatch-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac02-cloudwatch-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac02-cloudwatch-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac02-cloudwatch-global-ns
spec:
  mandatory:
    cloudwatch: {}
---
# Global CloudWatchConfig with actionsEnabled=false at level 3.
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchConfig
metadata:
  name: ac2-cw-policy
  namespace: ac02-cloudwatch-global-ns
  labels:
    aws.kropath.run/resource-name: ac2-cw-policy
spec:
  mandatory:
    actionsEnabled: false
  defaults: {}
---
# Local CloudWatchConfig — the reconcile target.
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchConfig
metadata:
  name: ac2-cw-policy
  namespace: ac02-cloudwatch-app-ns
  labels:
    aws.kropath.run/resource-name: ac2-cw-policy
spec:
  mandatory: {}
  defaults: {}
