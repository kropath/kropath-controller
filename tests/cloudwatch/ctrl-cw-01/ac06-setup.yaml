# AC-6: localCWConfig.mandatory.outputFormat="opentelemetry1.0" (level 4). KC is empty.
apiVersion: v1
kind: Namespace
metadata:
  name: ac06-cloudwatch-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac06-cloudwatch-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac06-cloudwatch-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac06-cloudwatch-global-ns
spec:
  mandatory:
    cloudwatch: {}
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchConfig
metadata:
  name: ac6-cw-policy
  namespace: ac06-cloudwatch-app-ns
  labels:
    aws.kropath.run/resource-name: ac6-cw-policy
spec:
  mandatory:
    outputFormat: "opentelemetry1.0"
  defaults: {}
