# AC-3: globalKropathConfig.mandatory.cloudwatch.treatMissingData="breaching" (level 1) propagates.
apiVersion: v1
kind: Namespace
metadata:
  name: ac03-cloudwatch-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac03-cloudwatch-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac03-cloudwatch-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac03-cloudwatch-global-ns
spec:
  mandatory:
    cloudwatch:
      treatMissingData: "breaching"
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Local CloudWatchConfig — the reconcile target.
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchConfig
metadata:
  name: ac3-cw-policy
  namespace: ac03-cloudwatch-app-ns
  labels:
    aws.kropath.run/resource-name: ac3-cw-policy
spec:
  mandatory: {}
  defaults: {}
