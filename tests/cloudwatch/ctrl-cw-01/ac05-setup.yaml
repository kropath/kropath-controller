# AC-5: globalKropathConfig.mandatory.cloudwatch.outputFormat="json" (level 1) propagates.
apiVersion: v1
kind: Namespace
metadata:
  name: ac05-cloudwatch-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac05-cloudwatch-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac05-cloudwatch-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac05-cloudwatch-global-ns
spec:
  mandatory:
    cloudwatch:
      outputFormat: "json"
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Local CloudWatchConfig — the reconcile target.
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchConfig
metadata:
  name: ac5-cw-policy
  namespace: ac05-cloudwatch-app-ns
  labels:
    aws.kropath.run/resource-name: ac5-cw-policy
spec:
  mandatory: {}
  defaults: {}
