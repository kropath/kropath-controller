# AC-4: localCWConfig.mandatory.treatMissingData="notBreaching" (level 4).
# KC mandatory.cloudwatch is empty — level 4 wins.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac4-cw-policy
  namespace: kro-system
spec:
  mandatory:
    cloudwatch: {}
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Local CloudWatchConfig with treatMissingData (level 4).
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchConfig
metadata:
  name: ac4-cw-policy
  namespace: monitoring-prod
  labels:
    aws.kropath.run/resource-name: ac4-cw-policy
spec:
  mandatory:
    treatMissingData: "notBreaching"
  defaults: {}
