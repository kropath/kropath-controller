# AC-9: localCWConfig.defaults.namingTemplate="{namespace}-{name}" (level 6).
apiVersion: v1
kind: Namespace
metadata:
  name: ac09-cloudwatch-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac09-cloudwatch-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac09-cloudwatch-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac09-cloudwatch-global-ns
spec:
  mandatory:
    cloudwatch: {}
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchConfig
metadata:
  name: ac9-cw-policy
  namespace: ac09-cloudwatch-app-ns
  labels:
    aws.kropath.run/resource-name: ac9-cw-policy
spec:
  mandatory: {}
  defaults:
    namingTemplate: "{namespace}-{name}"
