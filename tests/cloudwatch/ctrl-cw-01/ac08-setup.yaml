# AC-8: globalCWConfig.mandatory.namingTemplate="corp-{namespace}-{name}" (level 3).
# KropathConfig.cloudwatch has NO namingTemplate field — only CWConfig levels participate.
apiVersion: v1
kind: Namespace
metadata:
  name: ac08-cloudwatch-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac08-cloudwatch-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac08-cloudwatch-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac08-cloudwatch-global-ns
spec:
  mandatory:
    cloudwatch: {}
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Global CloudWatchConfig with namingTemplate at level 3.
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchConfig
metadata:
  name: ac8-cw-policy
  namespace: ac08-cloudwatch-global-ns
  labels:
    aws.kropath.run/resource-name: ac8-cw-policy
spec:
  mandatory:
    namingTemplate: "corp-{namespace}-{name}"
  defaults: {}
---
# Local CloudWatchConfig — the reconcile target.
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchConfig
metadata:
  name: ac8-cw-policy
  namespace: ac08-cloudwatch-app-ns
  labels:
    aws.kropath.run/resource-name: ac8-cw-policy
spec:
  mandatory: {}
  defaults: {}
