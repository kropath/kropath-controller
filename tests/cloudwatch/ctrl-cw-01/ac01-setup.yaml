# AC-1: globalKropathConfig with mandatory.cloudwatch.actionsEnabled=true (level 1).
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac1-cw-policy
  namespace: kro-system
spec:
  mandatory:
    cloudwatch:
      actionsEnabled: true
  aws:
    accountId: "123456789012"
    region: "ap-southeast-2"
---
# Empty local CloudWatchConfig for ac1 — cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchConfig
metadata:
  name: ac1-cw-policy
  namespace: monitoring-prod
  labels:
    aws.kropath.run/resource-name: ac1-cw-policy
spec:
  mandatory: {}
  defaults: {}
