# AC-1: globalKropathConfig with mandatory.cloudwatch.actionsEnabled=true (level 1).
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-cloudwatch-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-cloudwatch-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac01-cloudwatch-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac01-cloudwatch-global-ns
spec:
  mandatory:
    cloudwatch:
      actionsEnabled: true
---
# Empty local CloudWatchConfig for ac1 — cascade sources come from global configs.
apiVersion: aws.kropath.run/v1alpha1
kind: CloudWatchConfig
metadata:
  name: ac1-cw-policy
  namespace: ac01-cloudwatch-app-ns
  labels:
    aws.kropath.run/resource-name: ac1-cw-policy
spec:
  mandatory: {}
  defaults: {}
