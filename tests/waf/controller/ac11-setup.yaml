#
# AC-11: WAFConfig.mandatory.syncedLabels (level 4) flows to
# effCfg.mandatory.syncedLabels.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac11-waf-global-ns
spec:
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: WAFConfig
metadata:
  name: ac11-waf-policy
  namespace: ac11-waf-app-ns
spec:
  mandatory:
    syncedLabels:
      data-class: "internal"
      env: "prod"
