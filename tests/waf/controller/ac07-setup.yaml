# AC-7: globalKropathConfig.mandatory.waf.scope="REGIONAL" (level 1) flows to
# effCfg.mandatory.scope.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac7-waf-policy
  namespace: kro-system
spec:
  mandatory:
    waf:
      scope: "REGIONAL"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: WAFConfig
metadata:
  name: ac7-waf-policy
  namespace: security-prod
spec: {}
