# ctrl-waf-02 Chainsaw integration tests — controller cascade ACs: 7, 10, 11.
#
# Test isolation — unique-name-per-step, no inter-step deletes:
#   Each AC owns a distinct resource name (acN-waf-policy). The controller
#   resolves a config's global counterpart by *name*, so a per-AC name
#   isolates each AC completely.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-waf-02
spec:
  description: "WAF effectiveConfig cascade — controller ACs 7, 10, 11 (ctrl-waf-02)"
  steps:
    # AC-7: globalKropathConfig.mandatory.waf.scope="REGIONAL" (level 1) → effCfg.mandatory.scope
    - name: ac7-global-kpc-mandatory-scope
      try:
        - apply:
            file: ac07-setup.yaml
        - assert:
            file: ac07-assert.yaml
            timeout: 30s

    # AC-10: WAFConfig.mandatory.tags + KropathConfig.mandatory.tags merged in effCfg.mandatory.tags
    - name: ac10-mandatory-tag-union-merge
      try:
        - apply:
            file: ac10-setup.yaml
        - assert:
            file: ac10-assert.yaml
            timeout: 30s

    # AC-11: WAFConfig.mandatory.syncedLabels (level 4) → effCfg.mandatory.syncedLabels
    - name: ac11-mandatory-synced-labels
      try:
        - apply:
            file: ac11-setup.yaml
        - assert:
            file: ac11-assert.yaml
            timeout: 30s
