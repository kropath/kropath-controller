# AC-3: A KropathConfig in kro-system sets an ELB governance value. An ELBConfig
# in payments-prod should receive it in status.effectiveConfig once the CRD is served.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac03-dyn-elb
  namespace: kro-system
spec:
  mandatory:
    elb:
      deletionProtection: true
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: ELBConfig
metadata:
  name: ac03-dyn-elb
  namespace: payments-prod
spec:
  mandatory: {}
  defaults: {}
  configRef: ac03-dyn-elb
