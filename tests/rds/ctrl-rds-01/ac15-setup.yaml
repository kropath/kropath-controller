# AC-15: globalKropathConfig.mandatory.tags (level 1) contributes to tag union.
apiVersion: v1
kind: Namespace
metadata:
  name: ac15-rds-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac15-rds-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac15-rds-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac15-rds-global-ns
spec:
  mandatory:
    tags:
      cost-centre: platform
      env: prod
---
# AC-15: globalRDSConfig.mandatory.tags (level 3) contributes to tag union.
apiVersion: aws.kropath.run/v1alpha1
kind: RDSConfig
metadata:
  name: ac15-general-instance
  namespace: ac15-rds-global-ns
  labels:
    aws.kropath.run/resource-name: ac15-general-instance
spec:
  mandatory:
    tags:
      resource-type: rds
    syncedLabels:
      data-class: confidential
---
apiVersion: aws.kropath.run/v1alpha1
kind: RDSConfig
metadata:
  name: ac15-general-instance
  namespace: ac15-rds-app-ns
  labels:
    aws.kropath.run/resource-name: ac15-general-instance
spec: {}
