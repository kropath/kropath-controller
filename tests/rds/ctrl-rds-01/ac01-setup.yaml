# AC-1: globalKropathConfig.mandatory.rds.storageEncrypted: true (level 1).
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-rds-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-rds-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac01-rds-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac01-rds-global-ns
spec:
  mandatory:
    rds:
      storageEncrypted: true
---
apiVersion: aws.kropath.run/v1alpha1
kind: RDSConfig
metadata:
  name: ac1-general-instance
  namespace: ac01-rds-app-ns
  labels:
    aws.kropath.run/resource-name: ac1-general-instance
spec: {}
