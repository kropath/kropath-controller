# AC-16: globalKropathConfig with aws.region and aws.accountId for provider identity.
apiVersion: v1
kind: Namespace
metadata:
  name: ac16-rds-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac16-rds-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac16-rds-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "ap-southeast-2"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac16-rds-global-ns
spec: {}
---
apiVersion: aws.kropath.run/v1alpha1
kind: RDSConfig
metadata:
  name: ac16-general-instance
  namespace: ac16-rds-app-ns
  labels:
    aws.kropath.run/resource-name: ac16-general-instance
spec: {}
