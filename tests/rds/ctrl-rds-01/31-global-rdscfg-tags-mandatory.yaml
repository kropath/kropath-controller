# AC-15: globalRDSConfig.mandatory.tags (level 3) contributes to tag union.
apiVersion: aws.kropath.run/v1alpha1
kind: RDSConfig
metadata:
  name: general-instance
  namespace: kro-system
  labels:
    aws.kropath.run/resource-name: general-instance
spec:
  mandatory:
    tags:
      resource-type: rds
    syncedLabels:
      data-class: confidential
