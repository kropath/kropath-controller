    rds:
      backupRetentionPeriod: 7
---
apiVersion: aws.kropath.run/v1alpha1
kind: RDSConfig
metadata:
  name: ac6-general-instance
  namespace: ac06-rds-app-ns
  labels:
    aws.kropath.run/resource-name: ac6-general-instance
spec: {}
