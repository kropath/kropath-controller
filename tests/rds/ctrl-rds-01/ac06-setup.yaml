# AC-6: globalKropathConfig.mandatory.rds.backupRetentionPeriod: 7 (level 1 floor).
apiVersion: v1
kind: Namespace
metadata:
  name: ac06-rds-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac06-rds-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac06-rds-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
