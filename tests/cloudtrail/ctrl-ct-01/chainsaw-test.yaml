# ctrl-ct-01 Chainsaw integration tests — AC-10 (effective-config-merge).
# Requires:
#   - kind cluster with kropath-operator deployed
#   - KropathConfig CRD applied (crds/kropathconfig.yaml from kropath-aws)
#   - CloudTrailConfig CRD applied (crds/cloudtrailconfig.yaml from kropath-aws)
#
# Each AC step uses a unique resource name (acN-ct-policy) so that Chainsaw's
# deferred LIFO cleanup from prior steps cannot pollute later steps.
#
# Test isolation — unique name per step, no inter-step deletes:
#   Each step owns a distinct set of resource names (ac<N>-*). The controller
#   pairs a namespaced config with its kro-system counterpart by *name*, so a
#   per-step name isolates each step completely.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-ct-01-cascade
spec:
  namespace: cloudtrail-prod
  steps:
    # AC-10: KropathConfig.mandatory.cloudtrail.isMultiRegionTrail=true (level 1) propagates
    # to effectiveConfig.mandatory; CloudTrailConfig.defaults.enableLogFileValidation=true
    # (level 6) propagates to effectiveConfig.defaults.
    - name: ac10-effective-config-merge
      try:
        - apply:
            file: ac10-setup.yaml
        - assert:
            file: ac10-assert.yaml
            timeout: 30s
