# AC-9 setup: KinesisConfig.mandatory.syncedLabels propagates to effCfg.mandatory.syncedLabels.
# The controller merges syncedLabels from the global KinesisConfig.mandatory into the
# namespaced effectiveConfig.
---
apiVersion: aws.kropath.run/v1alpha1
kind: KinesisConfig
metadata:
  name: ac09-kinesis-policy
  namespace: kro-system
spec:
  mandatory:
    syncedLabels:
      data-class: streaming
---
apiVersion: v1
kind: Namespace
metadata:
  name: streaming-prod-ac09
  annotations:
    aws.kropath.run/global-config-namespace: kro-system
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KinesisConfig
metadata:
  name: ac09-kinesis-policy
  namespace: streaming-prod-ac09
spec: {}
