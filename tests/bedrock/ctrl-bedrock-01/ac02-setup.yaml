# AC-2: level 1 KPC.mandatory.guardrail wins over level 3 BedrockConfig.
apiVersion: v1
kind: Namespace
metadata:
  name: ac02-bedrock-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac02-bedrock-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac02-bedrock-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac02-bedrock-global-ns
spec:
  mandatory:
    bedrock:
      guardrailIdentifier: "kc-guardrail"
      guardrailVersion: "kc-1"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: BedrockConfig
metadata:
  name: ac2-bedrock-policy
  namespace: ac02-bedrock-global-ns
spec:
  mandatory:
    guardrailIdentifier: "bc-guardrail"
    guardrailVersion: "bc-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: BedrockConfig
metadata:
  name: ac2-bedrock-policy
  namespace: ac02-bedrock-app-ns
spec: {}
