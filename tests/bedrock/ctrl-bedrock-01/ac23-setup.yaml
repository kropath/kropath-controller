apiVersion: v1
kind: Namespace
metadata:
  name: ac23-bedrock-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac23-bedrock-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac23-bedrock-global-ns
---
# AC-23: tags union-merge — KropathConfig.mandatory + BedrockConfig.mandatory.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac23-bedrock-global-ns
spec:
  mandatory:
    bedrock:
      tags:
        cost-centre: "ai"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: BedrockConfig
metadata:
  name: ac23-bedrock-policy
  namespace: ac23-bedrock-global-ns
spec:
  mandatory:
    tags:
      ai-safety: "enforced"
---
apiVersion: aws.kropath.run/v1alpha1
kind: BedrockConfig
metadata:
  name: ac23-bedrock-policy
  namespace: ac23-bedrock-app-ns
spec: {}
