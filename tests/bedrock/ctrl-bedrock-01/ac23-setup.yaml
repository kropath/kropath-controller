# AC-23: tags union-merge — KropathConfig.mandatory + BedrockConfig.mandatory.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac23-bedrock-policy
  namespace: kro-system
spec:
  mandatory:
    bedrock:
      tags:
        cost-centre: "ai"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: BedrockConfig
metadata:
  name: ac23-bedrock-policy
  namespace: kro-system
spec:
  mandatory:
    tags:
      ai-safety: "enforced"
---
apiVersion: aws.kropath.run/v1alpha1
kind: BedrockConfig
metadata:
  name: ac23-bedrock-policy
  namespace: payments-prod
spec: {}
