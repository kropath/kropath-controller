apiVersion: aws.kropath.run/v1alpha1
kind: BedrockConfig
metadata:
  name: ac23-bedrock-policy
  namespace: ac23-bedrock-app-ns
status:
  effectiveConfig:
    mandatory:
      tags:
        cost-centre: "ai"
        ai-safety: "enforced"
  conditions:
  - type: Valid
    status: "True"
    reason: ValidationPassed
  - type: GlobalProfileResolved
    status: "True"
    reason: ProfileFound
