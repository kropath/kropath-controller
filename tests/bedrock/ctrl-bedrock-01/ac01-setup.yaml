# AC-1: globalKropathConfig.mandatory.bedrock.guardrailIdentifier/Version (level 1) → effCfg.mandatory.
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: ac1-bedrock-policy
  namespace: kro-system
spec:
  mandatory:
    bedrock:
      guardrailIdentifier: "abc123"
      guardrailVersion: "1"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: BedrockConfig
metadata:
  name: ac1-bedrock-policy
  namespace: payments-prod
spec: {}
