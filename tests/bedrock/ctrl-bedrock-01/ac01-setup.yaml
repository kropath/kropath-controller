# AC-1: globalKropathConfig.mandatory.bedrock.guardrailIdentifier/Version (level 1) → effCfg.mandatory.
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-bedrock-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac01-bedrock-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac01-bedrock-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac01-bedrock-global-ns
spec:
  mandatory:
    bedrock:
      guardrailIdentifier: "abc123"
      guardrailVersion: "1"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: BedrockConfig
metadata:
  name: ac1-bedrock-policy
  namespace: ac01-bedrock-app-ns
spec: {}
