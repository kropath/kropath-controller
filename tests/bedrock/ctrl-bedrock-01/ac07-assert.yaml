apiVersion: aws.kropath.run/v1alpha1
kind: BedrockConfig
metadata:
  name: ac7-bedrock-policy
  namespace: ac07-bedrock-app-ns
status:
  effectiveConfig:
    mandatory:
      allowedModels:
      - "model-a"
  conditions:
  - type: Valid
    status: "True"
    reason: ValidationPassed
  - type: GlobalProfileResolved
    status: "True"
    reason: ProfileFound
