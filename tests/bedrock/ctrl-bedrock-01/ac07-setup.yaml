# AC-7: level 1 KPC.allowedModels wins over level 3 BedrockConfig.
apiVersion: v1
kind: Namespace
metadata:
  name: ac07-bedrock-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac07-bedrock-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac07-bedrock-global-ns
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac07-bedrock-global-ns
spec:
  mandatory:
    bedrock:
      allowedModels:
      - "model-a"
  aws:
    accountId: "123456789012"
    region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: BedrockConfig
metadata:
  name: ac7-bedrock-policy
  namespace: ac07-bedrock-global-ns
spec:
  mandatory:
    allowedModels:
    - "model-b"
    - "model-c"
---
apiVersion: aws.kropath.run/v1alpha1
kind: BedrockConfig
metadata:
  name: ac7-bedrock-policy
  namespace: ac07-bedrock-app-ns
spec: {}
