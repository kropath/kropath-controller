name: pr-title

# Releases are gated on conventional-commit types, not on a human deciding to cut
# one. PRs are squash-merged, so the PR title becomes the commit subject on `main`
# and is the only thing release-please ever parses. A title it cannot parse is a
# feature that silently never ships and never reaches CHANGELOG.md.
#
# This lives in its own workflow rather than in ci.yaml so that it keeps its own
# trigger, free of any path filtering. A docs-only PR is exactly the case that
# must be typed correctly to stay out of a release, and it needs this check on a
# `types: [edited]` trigger that ci.yaml has no reason to carry.
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: read

jobs:
  lint-title:
    name: Conventional commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep the releasable types in sync with the `changelog-sections`
          # block in release-please-config.json.
          #
          #   feat            -> minor bump
          #   fix, perf, deps -> patch bump
          #   everything else -> no release
          types: |
            feat
            fix
            perf
            deps
            refactor
            docs
            test
            build
            ci
            chore
            revert

          # The ticket id goes in the scope: `feat(KRO-637): …`. Left optional and
          # unvalidated so dependency bumps and untracked chores do not need one.
          requireScope: false

          # Reject the historical `[KRO-637]: feat: …` shape, which parses as a
          # subject rather than a type and is the reason ~20 features are missing
          # from the changelog.
          #
          # Dependabot gets the bracket rule but not the leading-capital rule.
          # Its title is generated, not typed by a human: the type comes from the
          # `commit-message.prefix` pinned per ecosystem in .github/dependabot.yml
          # and is therefore always valid, but the verb it puts after the prefix
          # is dependabot's to choose and has been capitalised ("Bump …") in the
          # past. Failing a bump on that would block a security update on a
          # cosmetic rule, and release-please parses the type either way.
          subjectPattern: ${{ github.actor == 'dependabot[bot]' && '^(?!\[).+$' || '^(?![\[A-Z]).+$' }}
          subjectPatternError: |
            The subject "{subject}" of PR title "{title}" is invalid.

            Write the ticket id as a scope, not as a bracketed prefix:
              good: feat(KRO-637): restore feature-registry metadata
              bad:  [KRO-637]: feat: restore feature-registry metadata
              bad:  feat: Restore feature-registry metadata
