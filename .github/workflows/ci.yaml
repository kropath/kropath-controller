name: ci

# Documentation-only changes do not affect the binary, the image, or the
# Chainsaw suites, so the expensive work is skipped for them.
#
# That skip is decided *inside* the jobs, deliberately not with a
# `on.*.paths-ignore` filter. A trigger-level filter stops the workflow from
# starting at all, so the contexts required by the `main` ruleset -- `Unit
# tests` and `Chainsaw integration tests` -- are never reported, and a
# docs-only PR sits on "Expected - Waiting for status to be reported"
# forever with no way to merge it.
#
# So every job below runs on every PR and reports a real `success`. The
# `changes` job decides whether the work inside them actually happens.
on:
  pull_request:
  push:
    branches:
      - main

# Tool versions deliberately do NOT appear here. They are pinned once at the top
# of the Makefile and reached through the `install-*` targets below, so a CI run
# and a local `make lint` cannot drift onto different versions of the same tool.
jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect non-Markdown changes
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # Fail open. A missing or all-zero base (new branch, force push,
          # first commit) leaves no range to diff, and guessing "docs only"
          # there would silently wave code through the gate.
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable base ref -- running the full suite."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
            || ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo "Base or head commit not present locally -- running the full suite."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Three-dot: compare against the merge base, matching what GitHub
          # shows as the PR's own changes.
          files="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"

          echo "Changed files:"
          echo "${files}"

          if printf '%s\n' "${files}" | grep -qvE '(\.md$|^$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Result: non-Markdown files changed -- running the full suite."
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Result: Markdown-only change -- skipping build, test and scan steps."
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7

      - name: Setup Go
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        if: needs.changes.outputs.code == 'true'
        run: make install-golangci-lint

      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: make lint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7

      - name: Setup Go
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit tests
        if: needs.changes.outputs.code == 'true'
        run: make test

  features-verify:
    name: Feature registry drift gate
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7

      - name: Setup Go
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check docs/features.yaml is up to date
        if: needs.changes.outputs.code == 'true'
        run: make features-verify

      # kropath-aws owns the CRDs, so it is the authority on every Kind this
      # controller watches. Nothing inside this repo can catch a Kind that drifted
      # from it -- see the crds-verify comment in the Makefile (KRO-675).
      #
      # KROPATH_AWS_COMPANION_REFS lists CRD PR branches not yet on main so that
      # parallel controller+CRD PR pairs can be reviewed together.
      #   agent/implementer/e14f06bb — EMRConfig CRD (KRO-829; clear once merged)
      #   agent/implementer/5c0bce178e36 — MWAAConfig CRD stub (KRO-991; clear once KRO-990 merges)
      #   kro-952-managedprometheusconfig-crd — ManagedPrometheusConfig CRD (KRO-952; clear once merged)
      #   agent/implementer/8e4d093a801d — RAMConfig CRD stub (KRO-1006; clear once KRO-1006 merges)
      #   agent/implementer/cc989712def6 — QuickSightConfig CRD + KropathConfig quicksight
      #     section (KRO-1023, kropath-aws#245; clear once merged)
      #   kro-1030-ecrpublicconfig-crd — ECRPublicConfig CRD stub (KRO-1030, kropath-aws#252; clear once merged)
      #   kro-1039-recyclebinconfig-crd-stub — RecycleBinConfig CRD stub (KRO-1039/KRO-1038; clear once KRO-1038 merges)
      - name: Check watched Kinds against kropath-aws CRDs
        if: needs.changes.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KROPATH_AWS_COMPANION_REFS: "agent/implementer/e14f06bb agent/implementer/5c0bce178e36 kro-952-managedprometheusconfig-crd agent/implementer/8e4d093a801d agent/implementer/cc989712def6 kro-1030-ecrpublicconfig-crd kro-1039-recyclebinconfig-crd-stub"
        run: make crds-verify

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7

      - name: Setup Go
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install security scanners
        if: needs.changes.outputs.code == 'true'
        run: make install-gosec install-govulncheck

      - name: Run security scans
        if: needs.changes.outputs.code == 'true'
        run: make security

  image:
    name: Build image
    runs-on: ubuntu-latest
    needs: [changes, lint, unit, features-verify, security]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7

      - name: Compute short SHA
        id: sha
        if: needs.changes.outputs.code == 'true'
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: needs.changes.outputs.code == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: needs.changes.outputs.code == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: needs.changes.outputs.code == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          build-args: |
            GIT_COMMIT=${{ steps.sha.outputs.short }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          tags: |
            ghcr.io/kropath/kropath-controller:latest
            ghcr.io/kropath/kropath-controller:sha-${{ steps.sha.outputs.short }}

  e2e:
    name: Chainsaw integration tests
    runs-on: ubuntu-latest
    needs: [changes, lint, unit, features-verify, security]
    # Chainsaw already ran on the PR head against an identical tree; re-running
    # on the post-merge push to main duplicates the slowest job for no signal.
    # This job-level skip is safe where a path-based one would not be: the
    # required contexts are only ever evaluated on a pull request.
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7

      - name: Setup Go
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        if: needs.changes.outputs.code == 'true'
        run: make install-kind

      # Chainsaw is the one tool taken as a prebuilt release rather than built
      # by `go install`, so its version has to be handed to the action as an
      # input. Reading it back out of the Makefile keeps the pin single-sourced;
      # the `@v0.2.15` on the action is the action's own version, which
      # dependabot manages.
      - name: Read pinned tool versions
        id: tools
        if: needs.changes.outputs.code == 'true'
        run: make print-tool-versions >> "$GITHUB_OUTPUT"

      - name: Install Chainsaw
        if: needs.changes.outputs.code == 'true'
        uses: kyverno/action-install-chainsaw@v0.2.15
        with:
          release: ${{ steps.tools.outputs.CHAINSAW_VERSION }}

      - name: Run Chainsaw tests
        if: needs.changes.outputs.code == 'true'
        run: make test-chainsaw

      - name: Stop controller
        if: always() && needs.changes.outputs.code == 'true'
        run: make chainsaw-stop
