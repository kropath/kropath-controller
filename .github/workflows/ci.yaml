name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit:
    name: Go unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  e2e:
    name: Chainsaw integration tests
    runs-on: ubuntu-latest
    needs: unit

    steps:
      - name: Checkout controller
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kropath-test
          version: v0.25.0

      - name: Install test CRDs
        run: |
          kubectl apply -f tests/fixtures/crds/
          kubectl wait --for=condition=Established --timeout=60s \
            crd/awskropathconfigs.kropath.run \
            crd/awsiamconfigs.kropath.run \
            crd/awss3configs.kropath.run

      - name: Build controller
        run: |
          mkdir -p bin
          go build -o bin/kropath-operator ./cmd/manager

      - name: Start controller
        run: |
          mkdir -p /tmp/kropath-controller
          KUBECONFIG="${HOME}/.kube/config" ./bin/kropath-operator --health-probe-bind-address=:18081 > /tmp/kropath-controller/controller.log 2>&1 &
          echo $! > /tmp/kropath-controller/pid

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/readyz >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          cat /tmp/kropath-controller/controller.log
          exit 1

      - name: Prepare test namespaces
        run: |
          for ns in kro-system payments-prod; do
            kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -
          done

      - name: Install Chainsaw
        uses: kyverno/action-install-chainsaw@v0.2.15

      - name: Run Chainsaw tests
        run: |
          mkdir -p test-results
          chainsaw test tests/iam/ctrl-iam-01/ --parallel 1 --report-format JUNIT-TEST --report-path test-results/
          chainsaw test tests/s3/ctrl-s3-01/ --parallel 1 --report-format JUNIT-TEST --report-path test-results/

      - name: Stop controller
        if: always()
        run: |
          if [ -f /tmp/kropath-controller/pid ]; then
            kill "$(cat /tmp/kropath-controller/pid)" || true
          fi
