# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Every `commit-message.prefix` below is load-bearing twice over. PRs are
# squash-merged, so dependabot's commit message becomes the PR title, which
# `.github/workflows/pr-title.yaml` lints as a conventional commit and
# release-please then parses. An unprefixed or mistyped bump either fails the
# title gate or silently never reaches CHANGELOG.md.
#
#   deps  -> patch release, listed under "Dependencies"  (ships in the binary)
#   ci    -> no release                                  (workflow-only)
#   build -> no release                                  (image build only)
#
# `include: "scope"` is deliberately omitted: it would produce `deps(deps):`,
# and this repo reserves the scope for the ticket id.

version: 2
updates:
  # Go module dependencies. These are compiled into the shipped binary, so a
  # bump is a real user-visible change and earns a patch release.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # Grouping strategy: one PR for all patch bumps, one for all minor bumps, and
    # a PR of its own for each major. Patches and minors are reviewed as a batch
    # because the interesting signal is "did CI stay green", which is the same
    # answer for all of them; a major needs its changelog read, so it gets an
    # isolated PR that can be reverted without dragging routine bumps with it.
    #
    # Order matters — a dependency joins the first group it matches, so the
    # lockstep groups have to come before the catch-all ones.
    groups:
      # The k8s.io/* and sigs.k8s.io/* modules are released in lockstep and
      # controller-runtime pins a matching set. Bumping them one PR at a time
      # produces a queue of PRs that cannot compile until the last one lands.
      # Deliberately no `update-types`, so this holds for a major too, and so a
      # patch to one of them can never be split from a minor to another.
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      golang-x:
        patterns:
          - "golang.org/x/*"
          - "google.golang.org/*"
      # Everything else, split by blast radius rather than by package.
      gomod-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      gomod-minor:
        patterns:
          - "*"
        update-types:
          - "minor"

  # Action versions pinned as `uses: owner/action@vN` across .github/workflows.
  # Workflow-only, so no release — but unmanaged action pins are exactly how the
  # Go / golangci-lint / golangci-lint-action version triplet drifts out of sync.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # Dockerfile base images: the `golang:` builder stage and the distroless
  # runtime stage. The builder tag should stay at or above the toolchain in
  # go.mod; CI compiles the tree on every PR, so a bump that breaks that pairing
  # fails visibly rather than silently.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build"
    groups:
      docker-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      docker-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
